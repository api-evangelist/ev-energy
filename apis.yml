aid: ev-energy
name: ev.energy
description: 'ev.energy is a London- and Palo-Alto-based smart electric-vehicle charging
  platform. Its cloud software connects EV drivers, vehicles, EVSEs (chargers), home
  batteries, solar inverters and utility programs so charging can be shifted to cheaper,
  greener periods and aggregated as grid flexibility. The company operates a consumer
  driver app across the UK, EU, US and Canada, a white-label platform for utilities
  and e-mobility businesses, an EV Flex virtual power plant product, and the Smart
  Charge API — a public OpenAPI 3.1 REST contract at api.ev.energy covering vehicles,
  EVSEs, charging sessions, schedules, tariffs, solar, home batteries, VPP dispatch,
  rebates and utility program enrollment.'
