  contract_discovery: 'The API host api.ev.energy returns 403 text/plain for every unauthenticated
    path, including / and every /.well-known/* path, so host-root spec probing finds nothing there.
    The real OpenAPI 3.1.0 is served by the Redocly Realm developer portal at
    https://developers.ev.energy/_spec/ev.energy-API-v2.yaml — discovered from
    /page-data/ev.energy-api-v2/data.json, which names definitionId ev.energy-API-v2.yaml.
    Ownership is direct: developers.ev.energy, api.ev.energy and www.ev.energy share the registrable
    domain ev.energy, and the spec servers[] block names https://api.ev.energy/v2.'
  not_found: 'No A2A agent card on any host (canonical or legacy path). No AsyncAPI. No published
    idempotency contract. No status page, deprecation policy, changelog, CLI, embedded components,
    gRPC/protobuf, Postman collection, roadmap, trust centre, bug bounty, or first-party SDK on any
    public registry. No public API pricing and no self-service signup — credentials are provisioned
    by ev.energy during commercial onboarding.'
