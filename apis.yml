  description: 'The official ev.energy v2 REST API. 210 operations across 180 paths
    covering users, vehicles, EVSEs, charging sessions, schedules, tariffs, regions,
    solar, solar forecasts, home batteries, boundary meters, CT clamps, HEM systems,
    sites, carbon intensity, grid data, programs, rebates, subscriptions, notifications,
    support tickets and VPP dispatch. OAuth 2.0 (authorization code with PKCE, and
    client credentials) with 35 fine-grained scopes; RFC 9457 problem-details errors;
    RFC 5988 Link-header pagination; ULID-prefixed resource IDs.'
