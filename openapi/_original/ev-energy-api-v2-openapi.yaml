          additionalProperties: true
          example:
            evse_model: ChargePoint Home Flex
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When the ticket was created in the support system.
          example: '2019-08-24T14:15:22Z'
          readOnly: true
        ticket_updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the ticket was last updated in the support system.
          example: '2019-08-24T15:30:00Z'
          readOnly: true
        resolved_at:
          type:
            - string
