    CarbonFeed:
      title: CarbonFeed
      type: object
      description: >-
        A carbon feed representing a source of carbon intensity data for a
        specific region or grid.
      x-tags:
        - Carbon
      required:
        - id
        - url
        - name
      properties:
        id:
          type: string
          description: Unique identifier for the carbon feed.
          pattern: cabf[A-Z\d]{26}
          example: cabf01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/carbon_feeds/cabf01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        name:
          type: string
          description: Human-readable name for the carbon feed.
          example: UK National Grid
          readOnly: true
    GridFeed:
      title: GridFeed
      type: object
      description: >-
        A grid feed representing a source of grid signal data used for smart
        charging decisions.
      x-tags:
        - Grid
      required:
        - id
        - url
        - name
        - reference_code
        - priority
      properties:
        id:
          type: string
          description: Unique identifier for the grid feed.
          pattern: grfd[A-Z\d]{26}
          example: grfd01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/grid_feeds/grfd01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        name:
          type: string
          description: Human-readable name for the grid feed.
          example: CAISO Peak Demand
          readOnly: true
        reference_code:
          type: string
          description: >-
            Machine-readable reference code for the grid feed, consistent across
            environments.
          example: CAISO_PEAK
          readOnly: true
        priority:
          type: integer
          description: >-
            Priority level (1-10) used to resolve conflicts when a user has
            multiple overlapping grid feeds.
          minimum: 1
          maximum: 10
          example: 8
          readOnly: true
    GridLevel:
      title: GridLevel
      type: object
      description: >-
        A grid level representing a time-varying signal value within a grid
        feed. Values are between 1 and 100; values above 50 discourage charging
        during the interval, while values below 50 encourage it. A value of 50
        has no effect.
      x-tags:
        - Grid
      required:
        - value
        - started_at
        - interval_seconds
        - created_at
      properties:
        value:
          type: integer
          description: >-
            The grid level value (1-100). 50 is neutral, higher values
            discourage charging, lower values encourage it.
          minimum: 1
          maximum: 100
          example: 80
          readOnly: true
        started_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this grid level interval began (ISO 8601 datetime). Null if the
            interval has no lower bound.
          example: '2024-01-15T18:00:00Z'
          readOnly: true
        interval_seconds:
          type: integer
          nullable: true
          description: >-
            The duration of this grid level interval in seconds. Null if the
            interval has no upper or lower bound.
          example: 10800
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When this grid level was created (ISO 8601 datetime).
          example: '2024-01-14T09:00:00Z'
          readOnly: true
    CarbonIntensities:
      title: CarbonIntensities
      type: object
      description: A collection of carbon intensity data points for a specific carbon feed.
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/carbon_feeds/cabf01HN2NJ9NMRZBXT1H6FT9N7735/carbon_intensities
          readOnly: true
        carbon_feed:
          type: string
          format: uri
          example: https://api.ev.energy/v2/carbon_feeds/cabf01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        carbon_intensities:
          type: array
          description: A list of carbon intensity data points.
          items:
            $ref: '#/components/schemas/CarbonIntensity'
          readOnly: true
    CarbonIntensity:
      title: CarbonIntensity
      type: object
      description: >-
        A carbon intensity data point representing CO2 emissions per unit of
        electricity generated.
      x-tags:
        - Carbon
      required:
        - started_at
        - interval_seconds
        - co2_intensity_grams_per_kilowatt_hour
        - created_at
      properties:
        started_at:
          type: string
          format: date-time
          description: When this interval began.
          example: '2024-01-15T10:00:00Z'
          readOnly: true
        interval_seconds:
          type: integer
          description: The number of seconds that this interval lasts for.
          example: 1800
          readOnly: true
        co2_intensity_grams_per_kilowatt_hour:
          type: integer
          description: Carbon intensity in gCO2/kWh.
          example: 245
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When this record was created (ISO 8601 datetime).
          example: '2024-01-15T09:45:00Z'
          readOnly: true
    Price:
      title: Price
      type: object
      description: A price for a specific time interval.
      x-tags:
