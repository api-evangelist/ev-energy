                - type: object
                  required:
                    - id
                    - url
                    - supplier
                    - name
                    - currency
                  properties:
                    id:
                      type: string
                      pattern: tari[A-Z\d]{26}
                    url:
                      type: string
                      format: uri
                    supplier:
                      type: string
                      format: uri
                    name:
                      type: string
                    currency:
                      type: string
                  additionalProperties: true
                - type: 'null'
              description: >-
                The tariff used by the scheduler for charge optimisation, which
                may differ from the billing tariff. Returns a URL by default, or
                null if not set. Expandable with ?expand=scheduler_tariff to
                return a TariffBase object (additional fields may be present
                beyond those listed here).
    TariffDetail:
      title: TariffDetail
      examples:
        - id: tari01HN2NJ9NMRZBXT1H6FT9N7735
          url: https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735
          supplier: https://api.ev.energy/v2/suppliers/supl01HN2NJ9NMRZBXT1H6FT9N7735
          name: Fangorn Biomass
          currency: GBP
          daily_prices:
            peak:
              price: '0.30'
              times:
