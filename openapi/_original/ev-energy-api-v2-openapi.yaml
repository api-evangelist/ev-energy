  /regions:
    get:
      summary: List regions
      tags:
        - Regions
      operationId: get-regions
      description: >-
        List the regions created by your organisation (geometry omitted —
        retrieve a single region for its GeoJSON boundary).
      security:
        - oauth2:
            - region:read
      parameters:
        - $ref: '#/components/parameters/version-2'
        - $ref: '#/components/parameters/previous'
        - $ref: '#/components/parameters/next'
        - $ref: '#/components/parameters/page_size'
        - schema:
            type: string
          in: query
          name: name
          description: Exact region name.
        - schema:
            type: string
          in: query
          name: name__in
          description: Comma-separated list of exact region names.
        - schema:
            type: string
            pattern: rgrp[A-Z\d]{26}
          in: query
          name: region_group_id
          description: Only regions belonging to this region group (uid).
        - schema:
            type: string
            enum:
              - OTHER
              - ELECTRICITY
          in: query
          name: type
        - schema:
            type: string
            pattern: >-
              ^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$
            example: 42.2793,-71.1631
          in: query
          name: contains
          description: >-
            latitude,longitude — only regions strictly containing this point (a
            point exactly on a region's boundary does not match).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
          headers:
            Link:
              $ref: '#/components/headers/link'
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
        '400':
          $ref: '#/components/responses/Problem400BadRequestList'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
    post:
      summary: Create region
      tags:
        - Regions
      operationId: post-regions
      description: >-
        Create a single region. The submitted geometries are unioned server-side
        into one MultiPolygon. Region names are unique across all organisations:
        a name clash returns 409 with the existing region's URL — there is no
        upsert, and regions cannot be replaced via the API. The creating
        application must be linked to an organisation (creation is attributed to
        it, and only that organisation can read the region afterwards) —
        otherwise 403. Linked region_groups must belong to your organisation.
      security:
        - oauth2:
            - region:write
      parameters:
        - $ref: '#/components/parameters/version-2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionCreate'
      responses:
        '201':
          description: Region created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDetail'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
        '400':
          $ref: '#/components/responses/Problem400BadRequestCreate'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '409':
          description: >-
            A region with this name already exists (problem type
            region-name-conflict; extension member `conflicts` lists the
            clashing name and existing region URL). Nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '413':
          description: >-
            Request body exceeds the 20 MB limit (problem type
            payload-too-large).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '422':
          description: >-
            Validation failed — malformed GeoJSON, geometry not repairable by
            make_valid (problem type invalid-geometry, naming the region), or
            field validation errors (problem type validation-failed-regions).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
