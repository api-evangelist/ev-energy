  /support-ticket-stats/top-categories:
    get:
      summary: Get top support ticket categories and subcategories
      tags:
        - Support Tickets
      description: >-
        Returns the most common categories and subcategories sorted by ticket
        count. Supports a limit parameter to control the number of results.
      operationId: get-support_ticket_stats-top-categories
      responses:
        '200':
          description: Returns top categories and subcategories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    description: List of most common categories.
                    items:
                      type: object
                      required:
                        - category
                        - count
                        - percentage
                      properties:
                        category:
                          allOf:
                            - $ref: '#/components/schemas/SupportTicketCategoryEnum'
                          description: Category enum value.
                          example: CHARGER
                        count:
                          type: integer
                          description: Number of distinct tickets with this category.
                          example: 145
                        percentage:
                          type: number
                          format: float
                          description: Percentage of total tickets (0-1).
                          example: 0.45
                  subcategories:
                    type: array
                    description: >-
                      List of most common subcategories with their parent
                      category.
                    items:
                      type: object
                      required:
                        - subcategory
                        - category
                        - count
                        - percentage
                      properties:
                        subcategory:
                          allOf:
                            - $ref: >-
                                #/components/schemas/SupportTicketSubcategoryEnum
                          description: Subcategory enum value.
                          example: HARDWARE_ISSUE
                        category:
                          allOf:
                            - $ref: '#/components/schemas/SupportTicketCategoryEnum'
                          description: Parent category enum value.
                          example: CHARGER
                        count:
                          type: integer
                          description: Number of distinct tickets with this subcategory.
                          example: 78
                        percentage:
                          type: number
                          format: float
                          description: Percentage of total tickets (0-1).
                          example: 0.24
              examples:
                Example:
                  value:
                    categories:
                      - category: CHARGER
                        count: 145
                        percentage: 0.45
                      - category: MOBILE_APP
                        count: 89
                        percentage: 0.28
                    subcategories:
                      - subcategory: HARDWARE_ISSUE
                        category: CHARGER
                        count: 78
                        percentage: 0.24
                      - subcategory: APP_CRASH_FREEZE
                        category: MOBILE_APP
                        count: 45
                        percentage: 0.14
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      parameters:
        - $ref: '#/components/parameters/version-2'
        - name: limit
          in: query
          description: >-
            Maximum number of categories/subcategories to return. Defaults to
            10.
          schema:
            type: integer
            default: 10
            minimum: 1
