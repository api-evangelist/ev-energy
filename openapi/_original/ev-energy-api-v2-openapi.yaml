            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCompatibilityCheckResult'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '405':
          $ref: '#/components/responses/Problem405MethodNotAllowed'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
      security: []
  /vehicle_waitlist:
    post:
      summary: Add user to the vehicle waitlist
      description: >-
        Captures a user who hit an `incompatible` result on the vehicle
        compatibility check, so we can notify them once their hardware becomes
        supported. Pre-account, anonymous endpoint — no OAuth token required.


        The request body must identify the device in exactly one of two modes:


        - **Picker mode** — supply `vehicle_model_id` (uid of a `CarModel`).
        `vehicle_make_name` and `vehicle_model_name` must be omitted / null.

        - **Manual entry** — supply both `vehicle_make_name` and
        `vehicle_model_name` as free-text strings. `vehicle_model_id` must be
        omitted / null.


        Any other combination — including all three null — returns `400`.


        Country is derived server-side: from `program.country` when `program_id`
        is supplied; otherwise from the `Accept-Language` header (defaulting to
        `US`).


        Error responses follow RFC 9457 Problem Details. Problem types emitted
        by this endpoint:


        - `validation-failed-vehicle-waitlist` — request body fails validation
        (missing required field, mode constraint violation, unknown
        `vehicle_model_id` / `program_id`).
      tags:
        - Vehicles
      operationId: post-vehicle_waitlist
      parameters:
        - $ref: '#/components/parameters/version-2'
        - $ref: '#/components/parameters/Accept-Language'
        - name: client_id
          in: query
          required: false
          description: >-
            OAuth `Application.client_id`. Mirrors the pre-account onboarding
            and compatibility-check endpoints: when supplied and the application
            has sandbox mode enabled, the endpoint returns a canned `201`
            without persisting anything.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleWaitlistRequest'
      responses:
        '201':
          description: Waitlist entry created. Body echoes the new entry's uid.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleWaitlistResponse'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '405':
          $ref: '#/components/responses/Problem405MethodNotAllowed'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      security: []
