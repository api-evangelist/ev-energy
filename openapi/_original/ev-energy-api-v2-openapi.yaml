                  total_resolved:
                    type: integer
                    description: Total number of resolved tickets.
                    example: 170
                  total_unresolved:
                    type: integer
                    description: Total number of unresolved tickets.
                    example: 30
              examples:
                Example:
                  value:
                    resolution_rate: 0.85
                    avg_resolution_time_hours: 24.5
                    median_resolution_time_hours: 18.2
                    total_resolved: 170
                    total_unresolved: 30
