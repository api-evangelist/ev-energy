webhooks:
  charging_sub_session.created:
    post:
      summary: Charging sub-session created
      description: >-
        A charging sub-session is created, representing a period of charging in
        a single mode.
      tags:
        - Charging Sessions
      parameters:
        - name: svix-event-type
          in: header
          required: true
          description: >-
            The event type for this webhook, always
            `charging_sub_session.created` for this endpoint. This matches the
            `type` field in the body envelope, so you can route on the header
            without parsing the body.
          schema:
            type: string
            enum:
              - charging_sub_session.created
        - $ref: '#/components/parameters/svix-id'
        - $ref: '#/components/parameters/svix-timestamp'
        - $ref: '#/components/parameters/svix-signature'
      requestBody:
        description: >-
          A `{type, timestamp, data}` envelope. `data` is the created charging
          sub-session resource, in exactly the same format returned by `GET
          /v2/charging_sub_sessions/{id}`. The event type is also delivered in
          the `svix-event-type` header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingSubSessionCreatedWebhook'
      responses:
        '200':
          description: >-
            Return a 200 status to indicate that the data was received
            successfully.
  charging_sub_session.ended:
    post:
      summary: Charging sub-session ended
      description: >-
        A charging sub-session has ended, representing a period of charging in a
        single mode.
      tags:
        - Charging Sessions
      parameters:
        - name: svix-event-type
          in: header
          required: true
          description: >-
            The event type for this webhook, always `charging_sub_session.ended`
            for this endpoint. This matches the `type` field in the body
            envelope, so you can route on the header without parsing the body.
          schema:
            type: string
            enum:
              - charging_sub_session.ended
        - $ref: '#/components/parameters/svix-id'
        - $ref: '#/components/parameters/svix-timestamp'
        - $ref: '#/components/parameters/svix-signature'
      requestBody:
        description: >-
          A `{type, timestamp, data}` envelope. `data` is the ended charging
          sub-session resource, in exactly the same format returned by `GET
          /v2/charging_sub_sessions/{id}`. The event type is also delivered in
          the `svix-event-type` header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingSubSessionEndedWebhook'
      responses:
        '200':
          description: >-
            Return a 200 status to indicate that the data was received
            successfully.
components:
  schemas:
    User:
      title: User
      description: A resource that represents an individual user in the ev.energy system.
      type: object
      x-tags:
        - Users
      required:
        - id
        - url
      properties:
        id:
          type: string
          description: Unique identifier for the given user.
          pattern: user[A-Z\d]{26}
          example: user01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          format: uri
          readOnly: true
        email:
          type: string
          format: email
        full_name:
          type: string
          readOnly: true
          description: The user's full name.
          example: Frodo Baggins
        joined_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time when the user joined the platform.
          example: '2023-06-15T10:00:00Z'
        terms_consent_datetime:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
          description: >-
            When the user gave their terms and conditions consent, or null if
            they have not.
          example: '2023-06-15T10:00:00Z'
        default_location:
          anyOf:
            - $ref: '#/components/schemas/Location'
            - $ref: '#/components/schemas/LocationDetail'
          description: >-
            LocationDetail is served when a single user is requested, otherwise
            Location is served for user lists.
        vehicles:
          type: array
          items:
            type: string
            format: uri
            example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
            readOnly: true
          readOnly: true
        evses:
          type: array
          items:
            type: string
            format: uri
            example: https://api.ev.energy/v2/evses/evse01HSH04XHZCT92RN018F0236ZM
            readOnly: true
          readOnly: true
    VehicleConnectors:
      title: VehicleConnectors
      description: A vehicle's DC-fast charging connectors (native plug + adapters).
      type: object
      x-tags:
        - Vehicles
      required:
        - url
        - vehicle
        - native_connector
        - adaptors
        - updated_at
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/connectors
        vehicle:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
        native_connector:
          type:
            - string
            - 'null'
          enum:
            - CCS
            - NACS
            - CHADEMO
            - null
          description: |-
            The vehicle's built-in DC-fast plug. A per-vehicle override, falling
            back to the model's default connector when unset; null when not yet
            known.
        adaptors:
          type: array
          items:
            type: string
            enum:
              - CCS
              - NACS
              - CHADEMO
          description: Additional connectors usable via an adapter. Empty when none.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
    VehicleConnectorsUpdate:
      title: VehicleConnectorsUpdate
      description: Request body for `PATCH /vehicles/{vehicle_id}/connectors`.
      type: object
      properties:
        native_connector:
          type:
            - string
            - 'null'
          enum:
            - CCS
            - NACS
            - CHADEMO
            - null
        adaptors:
          type: array
          items:
            type: string
            enum:
              - CCS
              - NACS
              - CHADEMO
    VehicleStateOfCharge:
      title: VehicleStateOfCharge
      description: A vehicle's current battery state of charge.
      type: object
      x-tags:
        - Vehicles
      required:
        - url
        - vehicle
        - state_of_charge_percentage
        - source
        - updated_at
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/state_of_charge
        vehicle:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
        state_of_charge_percentage:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
          description: Current battery percentage. Null when unknown.
        source:
          type:
            - string
            - 'null'
          enum:
            - MANUAL
            - CONNECTED
            - null
          readOnly: true
          description: |-
            Where the current value came from: MANUAL (driver-entered) or
            CONNECTED (vehicle telemetry). Null when no value is available.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
    VehicleStateOfChargeUpdate:
      title: VehicleStateOfChargeUpdate
      description: Request body for `PATCH /vehicles/{vehicle_id}/state_of_charge`.
      type: object
      properties:
        state_of_charge_percentage:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
    UserNotificationPreferences:
      title: UserNotificationPreferences
      description: |-
        The user's notification group opt-in state.

        On `GET`, every known group is returned with its current boolean state.
        On `PATCH`, only the keys you include are modified; omitted keys are
        left untouched. `PATCH {}` and `PATCH {"groups": {}}` are valid no-ops.
        Unknown group names produce a `400`.
      type: object
      x-tags:
        - Users
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/notification_preferences
        groups:
          type: object
          description: >-
            Map of notification group name to opt-in state. Each group

            corresponds to a category of push/email notifications:


            - `charging_flow` — session lifecycle updates (plug-in, schedule,
            complete).

            - `charging_issues` — errors and failures during a charging session.

            - `charging_optimisation` — smart-charging schedule and savings
            updates.

            - `deals_and_offers` — marketing offers (subject to the user's
            marketing consent).

            - `power_supply_notifications` — grid / power-supply events
            (feature-flagged).
          additionalProperties: false
          properties:
            charging_flow:
              type: boolean
            charging_issues:
              type: boolean
            charging_optimisation:
              type: boolean
            deals_and_offers:
              type: boolean
            power_supply_notifications:
              type: boolean
          example:
            charging_flow: true
            charging_issues: true
            charging_optimisation: false
            deals_and_offers: false
            power_supply_notifications: false
    RoutePlannerPreferences:
      title: RoutePlannerPreferences
      description: |-
        A user's sticky EV Route Planner preferences, created with defaults on
        first access. `PATCH` treats the body as a partial map — only the keys
        you include are changed.
      type: object
      x-tags:
        - Users
      required:
        - url
        - preferred_vehicle
        - min_charger_power_watts
        - arrive_with_min_percent
        - updated_at
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/route_planner_preferences
        preferred_vehicle:
          type:
            - string
            - 'null'
          format: uri
          description: Link to the vehicle selected by default, or null if none is set.
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
        min_charger_power_watts:
          type:
            - integer
            - 'null'
          enum:
            - 22000
            - 50000
            - 100000
            - 150000
            - 250000
            - null
          description: |-
            Soft minimum charger power (watts) for en-route charger search. Null
            means all chargers.
        arrive_with_min_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Default arrival battery floor seeded into new route plans.
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RoutePlannerPreferencesUpdate:
      title: RoutePlannerPreferencesUpdate
      description: |-
        Request body for `PATCH /users/{user_id}/route_planner_preferences`.
        All fields are optional; only those supplied are changed.
      type: object
      properties:
        preferred_vehicle:
          type:
            - string
            - 'null'
          format: uri
          description: Vehicle URL to set as default, or null to clear.
        min_charger_power_watts:
          type:
            - integer
            - 'null'
          enum:
            - 22000
            - 50000
            - 100000
            - 150000
            - 250000
            - null
        arrive_with_min_percent:
          type: integer
          minimum: 0
          maximum: 100
    PasswordResetRequest:
      title: PasswordResetRequest
      description: Request body for the password-reset endpoint.
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The email address of the account to send a reset link to.
    PasswordResetResult:
      title: PasswordResetResult
      description: |-
        Acknowledgement that the password reset request was accepted. The
        same response is returned whether or not an account exists for the
        supplied email.
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - password_reset_email_sent
    EVSECompatibilityCheckResult:
      title: EVSECompatibilityCheckResult
      description: |-
        Compatibility verdict for an `(EVSEModel, country)` pair. Returned
        by `GET /evse_compatibility/check`.
      type: object
      required:
        - compatible
        - beta
        - recommendation_rank
      properties:
        compatible:
          type: boolean
          description: True if the model is supported in the requested country.
        beta:
          type: boolean
          description: |-
            True if support is currently in early-access / beta. Always
            present in the response; `false` when `compatible` is `false`.
        recommendation_rank:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 10
          description: |-
            Priority of the EVSE make on the new device-selection screen.
            Lower = higher priority (1 = top, 10 = lowest explicit value);
            `null` means no rank set and should be treated as lower priority
            than any explicit value. Always reflects the make's current
            value, independent of `compatible`.
    PayoutMethod:
      title: PayoutMethod
      description: |
        The user's preferred payout method. All three fields are nullable when
        no payout method has been set up. `receiver_type` and the format of
        `receiver` are determined by `receiver_wallet`:

        - `PAYPAL` → `receiver` is an email, `receiver_type` is `EMAIL`
        - `VENMO` → `receiver` is a phone number, `receiver_type` is `PHONE`
        - `BILL_CREDITS` → `receiver` is the user's billing account number
          (may be empty), `receiver_type` is `ACCOUNT_NUMBER`
      type: object
      x-tags:
        - Users
      required:
        - url
        - receiver
        - receiver_type
        - receiver_wallet
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/payout_method
        receiver:
          type:
            - string
            - 'null'
          description: |
            The destination identifier for the payout (email for `PAYPAL`,
            phone for `VENMO`, billing account number for `BILL_CREDITS`).
            Null when no payout method has been set up.
          example: alice@example.com
        receiver_type:
          type:
            - string
            - 'null'
          enum:
            - EMAIL
            - PHONE
            - ACCOUNT_NUMBER
            - null
          description: The semantic type of the `receiver` field. Server-derived.
          readOnly: true
        receiver_wallet:
          type:
            - string
            - 'null'
          enum:
            - PAYPAL
            - VENMO
            - BILL_CREDITS
            - null
          description: Which payout wallet the user has selected. Null when none is set.
    PayoutMethodUpdate:
      title: PayoutMethodUpdate
      description: |
        Request body for `PATCH /users/{user_id}/payout_method`.

        `receiver_wallet` is always required. For `PAYPAL` and `VENMO` the
        client must also supply `receiver` (an email or phone respectively).
        For `BILL_CREDITS`, `receiver` must not be supplied — it is derived
        server-side from the user's linked billing account.
      type: object
      required:
        - receiver_wallet
      properties:
        receiver:
          type:
            - string
            - 'null'
          maxLength: 254
          description: |
            Email when `receiver_wallet` is `PAYPAL`, phone when `VENMO`. Must
            not be supplied when `receiver_wallet` is `BILL_CREDITS`.
          example: alice@example.com
        receiver_wallet:
          type: string
          enum:
            - PAYPAL
            - VENMO
            - BILL_CREDITS
    RoutePoint:
      title: RoutePoint
      type: object
      description: A single geographic point on a saved route.
      required:
        - latitude
        - longitude
        - name
      properties:
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
        name:
          type: string
          maxLength: 100
    SavedRoute:
      title: SavedRoute
      description: |
        A user's saved route-planner route — a reusable origin/destination/
        waypoints "recipe" plus planning preferences. It deliberately does not
        store the resulting charging plan, projected state of charge, or weather
        snapshots; those are recalculated on each re-plan.
      type: object
      x-tags:
        - Users
      required:
        - id
        - url
        - user
        - name
        - favourite
        - origin
        - destination
        - waypoints
        - arrive_with_min_percent
        - preferred_departure_minutes
        - created_at
        - last_used_at
      properties:
        id:
          type: string
          pattern: savr[A-Z\d]{26}
          readOnly: true
          example: savr01HRFF3SEVSCRAV9B3CHVDFN0H
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/saved_routes/savr01HRFF3SEVSCRAV9B3CHVDFN0H
        user:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          description: Link to the user who owns this route.
        name:
          type: string
          maxLength: 200
          description: User-supplied name for the route.
        favourite:
          type: boolean
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destination:
          $ref: '#/components/schemas/RoutePoint'
        waypoints:
          type: array
          maxItems: 25
          description: Ordered intermediate stops. Empty when the route is direct.
          items:
            $ref: '#/components/schemas/RoutePoint'
        arrive_with_min_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Target battery floor on arrival.
        preferred_departure_minutes:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
          description: |
            Preferred departure hint as an offset in minutes from midnight of
            the day the route is re-planned. Null means "leave now".
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          description: Bumped each time the route is re-planned.
    SavedRouteCreate:
      title: SavedRouteCreate
      description: Request body for `POST /users/{user_id}/saved_routes`.
      type: object
      required:
        - name
        - origin
        - destination
        - arrive_with_min_percent
      properties:
        name:
          type: string
          maxLength: 200
        favourite:
          type: boolean
          default: false
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destination:
          $ref: '#/components/schemas/RoutePoint'
        waypoints:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/RoutePoint'
        arrive_with_min_percent:
          type: integer
          minimum: 0
          maximum: 100
        preferred_departure_minutes:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
        last_used_at:
          type: string
          format: date-time
    SavedRoutePatch:
      title: SavedRoutePatch
      description: |
        Request body for `PATCH /users/{user_id}/saved_routes/{saved_route_id}`.
        All fields are optional; only those supplied are changed.
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        favourite:
          type: boolean
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destination:
          $ref: '#/components/schemas/RoutePoint'
        waypoints:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/RoutePoint'
        arrive_with_min_percent:
          type: integer
          minimum: 0
          maximum: 100
        preferred_departure_minutes:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
        last_used_at:
          type: string
          format: date-time
    VehicleModelConnector:
      title: VehicleModelConnector
      description: |
        A vehicle model's DC-fast connector for one charging region. A model's
        connector can differ by market, so each row records the connector (and
        its provenance) for one region.
      type: object
      x-tags:
        - Vehicles
      required:
        - url
        - vehicle_model
        - region
        - connector_type
        - source
        - confidence
        - verified_at
        - updated_at
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/vehicle_models/vmod01HRFF3SEVSCRAV9B3CHVDFN0H/connectors/NORTH_AMERICA
        vehicle_model:
          type: string
          format: uri
          readOnly: true
          example: >-
            https://api.ev.energy/v2/vehicle_models/vmod01HRFF3SEVSCRAV9B3CHVDFN0H
          description: Link to the vehicle model this connector belongs to.
        region:
          type: string
          enum:
            - NORTH_AMERICA
            - EUROPE
          description: The charging region this connector applies in.
        connector_type:
          type: string
          enum:
            - CCS
            - NACS
            - CHADEMO
            - GBT
          description: The model's native DC-fast connector in this region.
        source:
          type:
            - string
            - 'null'
          enum:
            - EV_ENERGY
            - CAR_API
            - USER
            - DVLA
            - PROVIDER
            - FLEET
            - null
          description: Provenance of this regional connector value.
        confidence:
          type:
            - string
            - 'null'
          enum:
            - HIGH
            - MEDIUM
            - LOW
            - null
          description: Curator confidence in this value.
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When this value was last verified.
        updated_at:
          type: string
          format: date-time
          readOnly: true
    VehicleModelConnectorCreate:
      title: VehicleModelConnectorCreate
      description: Request body for `POST /vehicle_models/{vehicle_model_id}/connectors`.
      type: object
      required:
        - region
        - connector_type
      properties:
        region:
          type: string
          enum:
            - NORTH_AMERICA
            - EUROPE
        connector_type:
          type: string
          enum:
            - CCS
            - NACS
            - CHADEMO
            - GBT
        source:
          type:
            - string
            - 'null'
          enum:
            - EV_ENERGY
            - CAR_API
            - USER
            - DVLA
            - PROVIDER
            - FLEET
            - null
        confidence:
          type:
            - string
            - 'null'
          enum:
            - HIGH
            - MEDIUM
            - LOW
            - null
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
    VehicleModelConnectorPatch:
      title: VehicleModelConnectorPatch
      description: |
        Request body for
        `PATCH /vehicle_models/{vehicle_model_id}/connectors/{region}`. All
        fields are optional; only those supplied are changed. `region` is the
        key and cannot be changed.
      type: object
      properties:
        connector_type:
          type: string
          enum:
            - CCS
            - NACS
            - CHADEMO
            - GBT
        source:
          type:
            - string
            - 'null'
          enum:
            - EV_ENERGY
            - CAR_API
            - USER
            - DVLA
            - PROVIDER
            - FLEET
            - null
        confidence:
          type:
            - string
            - 'null'
          enum:
            - HIGH
            - MEDIUM
            - LOW
            - null
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
    EVSE:
      title: EVSE
      description: >-
        A resource that represents a single, physical piece of hardware for
        supplying electricity to an electric vehicle.
      type: object
      x-tags:
        - EVSEs
      required:
        - id
        - url
        - cpid
      properties:
        id:
          type: string
          description: Unique identifier for the given EVSE.
          pattern: evse[A-Z\d]{26}
          example: evse01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          format: uri
          readOnly: true
        cpid:
          type: string
          description: >-
            A unique identifier for the chargepoint. The format varies by
            manufacturer and model.
          example: SHIR100001
          readOnly: true
        model:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/evse_models/emod01HS9A004X5TB5JCMHENB5Z446
            - $ref: '#/components/schemas/EVSEModel'
          readOnly: true
        user:
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          oneOf:
            - type: string
              example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
              format: uri
            - $ref: '#/components/schemas/User'
          readOnly: true
        latest_status_log:
          example: >-
            https://api.ev.energy/v2/evse/evse01HSH04KDEWF6Z4DB2J77J74K5/status_logs/2024-01-01T11:11:11.1111Z/
          oneOf:
            - type:
                - string
                - 'null'
              example: >-
                https://api.ev.energy/v2/evse/evse01HSH04KDEWF6Z4DB2J77J74K5/status_logs/2024-01-01T11:11:11.1111Z/
              format: uri
            - $ref: '#/components/schemas/EVSEStatusLog'
          description: >-
            An expandable reference to the most recent status log for this EVSE.
            This can be requested or expanded to get the most accurate
            information we have on the device's current status.


            **Inferring reachability:** v2 deliberately does not expose a
            discrete `online`/`offline` state on the EVSE resource — the
            boundary is fuzzy and prone to misuse. To decide whether an EVSE is
            currently reachable, expand `latest_status_log` (or fetch it
            separately) and compare its `sampled_at` timestamp against your own
            staleness threshold (for example: a charger silent for more than 15
            minutes is likely unreachable).
          readOnly: true
        ct_clamp:
          oneOf:
            - type:
                - string
                - 'null'
              format: uri
              example: >-
                https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/CTClamp'
          description: >-
            An expandable reference to the CT clamp associated with this EVSE.
            Will be null if no CT clamp is installed.
          readOnly: true
        lock_mode:
          type:
            - string
            - 'null'
          enum:
            - UNLOCKED
            - SMART
            - LOCKED
            - null
          example: UNLOCKED
          description: >-
            Lock mode of the EVSE. ``UNLOCKED`` allows free charging, ``SMART``
            only allows charging within smart-charging hours, ``LOCKED`` blocks
            all charging.
          readOnly: true
        location:
          type:
            - object
            - 'null'
          properties:
            latitude:
              type: number
              format: double
              example: 51.5074
            longitude:
              type: number
              format: double
              example: -0.1278
          required:
            - latitude
            - longitude
          example:
            latitude: 51.5074
            longitude: -0.1278
          description: >-
            The geographic location of the EVSE as a latitude/longitude point.


            **Why smart charging needs it:** the location tells ev.energy which
            electricity grid the charger sits on, which drives the core
            smart-charging decisions:


            - **Carbon optimisation** — selects the local carbon-intensity feed
            so charging is shifted to the lowest-carbon periods.

            - **Timezone** — resolves the charger's timezone so time-of-day
            charging schedules and tariff windows are applied in local time.

            - **Programs and solar** — determines the eligible
            grid/demand-response programs and the relevant solar forecast.


            Without an accurate location the scheduler cannot reliably optimise
            charging for cost and carbon.


            **When it is set:** during commissioning, where the supplied
            postcode/address is geocoded to a latitude/longitude (or, for
            app-linked chargers, copied from the owner's home location). It can
            be corrected later via `PATCH`. Null when the location has not yet
            been determined.
        lifecycle_state:
          type:
            - string
            - 'null'
          enum:
            - CREATED_LINKED
            - INSTALLED
            - COMMISSIONED
            - DECOMMISSIONED
            - UNKNOWN
            - PROBABLY_INSTALLED
            - UNPAIRED
            - PENDING
            - ENROLLED
            - null
          example: COMMISSIONED
          description: >-
            The most recently recorded stage of the EVSE's onboarding lifecycle.
            Null when no stage has been recorded for it yet, which is normal for
            a charger that has only just been created.
          readOnly: true
        charging_sub_sessions:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/charging_sub_sessions/?evse_id=evse01HSH04KDEWF6Z4DB2J77J74K5
          description: >-
            Provides a pre-constructed URL to list charging sub-sessions
            involving this EVSE.
    CTClamp:
      title: CTClamp
      description: >-
        A CT (Current Transformer) clamp used to measure grid current, typically
        for solar charging logic.
      type: object
      x-tags:
        - CT Clamps
      properties:
        id:
          type: string
          description: Unique identifier for the given CT clamp.
          pattern: ctcl[A-Z\d]{26}
          example: ctcl01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        evse:
          oneOf:
            - type:
                - string
                - 'null'
              format: uri
              example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/EVSE'
          description: >-
            The EVSE associated with this CT clamp. Will be null if not linked
            to an EVSE.
          readOnly: true
        calibration_factor:
          type: integer
          description: >-
            Calibration multiplier for current readings. A value of -1 indicates
            the clamp was fitted the wrong way around.
          example: 1
          readOnly: true
    CTClampLog:
      title: CTClampLog
      description: >-
        Records the current measurement from a CT clamp at a particular point in
        time.
      type: object
      x-tags:
        - CT Clamps
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5/logs/2024-04-17T09:39:45.984584Z
          readOnly: true
        sampled_at:
          type: string
          format: date-time
          description: The date and time the current measurement was taken on the CT clamp.
        logged_at:
          type: string
          format: date-time
          description: The date and time when this data was recorded on the server.
        ct_clamp:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/CTClamp'
          description: The CT clamp this log entry belongs to.
        current_milliamps:
          type: integer
          description: >-
            The current reading in milliamps. Positive values indicate import
            from grid, negative values indicate export (e.g. solar generation).
          example: 5200
    EVSEModel:
      title: Model
      description: A resource representing a model of EVSEs.
      type: object
      required:
        - id
        - url
        - name
      properties:
        id:
          type: string
          description: Unique identifier for the given EVSE Model.
          pattern: emod[A-Z\d]{26}
          example: emod01HS9A004X5TB5JCMHENB5Z446
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse_models/emod01HS9A004X5TB5JCMHENB5Z446
          readOnly: true
        name:
          type: string
          example: EVWC2S22
          readOnly: true
        make:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/evse_makes/emak01HS8FRMXGE3566EDXCMWGW5W4
            - $ref: '#/components/schemas/EVSEMake'
        display_name:
          type:
            - string
            - 'null'
          example: EVWC2S22
          description: >-
            The EVSE model name for in-app display. May be null if no display
            name has been set.
          readOnly: true
        onboarding_url:
          type:
            - string
            - 'null'
          example: >-
            https://api.ev.energy/v2/evse_onboarding?model_id=emod01HN2NJHAJJAQD32QJ4QXTDSGW&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          format: uri
          description: >-
            A pre-constructed link to initiate onboarding for an EVSE with this
            model. If it is null, then we do not support intergrating with this
            EVSE and the user will need an integrated vehicle in order for us to
            be able to track their charging.


            Your `client_id` and the user's `user_id` are automatically included
            based on your authentication token. If you are using client
            credentials authentication, the user ID will not be automatically
            included unless you set the EvEnergy-User header on your request.
          readOnly: true
      x-tags:
        - EVSEs
    EVSEMake:
      title: Make
      description: A resource representing a manufacturer of EVSEs.
      type: object
      x-tags:
        - EVSEs
      required:
        - id
        - url
        - name
      properties:
        id:
          type: string
          description: Unique identifier for the given EVSE Make.
          pattern: emak[A-Z\d]{26}
          example: emak01HS8FRXKJD5JZZ7ZN6W8H21P8
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse_makes/emak01HS8FRXKJD5JZZ7ZN6W8H21P8
          readOnly: true
        name:
          type: string
          example: BG SyncEV
          readOnly: true
        display_name:
          type:
            - string
            - 'null'
          example: BG SyncEV
          description: >-
            The EVSE make name for in-app display. May be null if no display
            name has been set.
          readOnly: true
        icon:
          type:
            - string
            - 'null'
          format: uri
          example: https://cdn.example.com/volvo.png
          description: A url for an image of the make's logo.
          readOnly: true
        onboarding_url:
          type:
            - string
            - 'null'
          example: >-
            https://api.ev.energy/v2/evse_onboarding?make_id=emak01HN2NJQRGDQP0GBE1F7R6PB3D&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          description: >-
            A pre-constructed link to initiate onboarding for an EVSE of this
            make. If it is null, then it cannot be onboarded with model alone.
            You should filter the list of [EVSE
            models](ev.energy-API-v2.yaml/paths/~1evse_models/get) by this make
            and then have the user select their model.


            Your `client_id` and the user's `user_id` are automatically included
            based on your authentication token. If you are using client
            credentials authentication, the user ID will not be automatically
            included unless you set the EvEnergy-User header on your request.
          readOnly: true
        is_beta:
          type: boolean
          example: false
          description: Whether this EVSE make integration is in beta.
          readOnly: true
        evse_models:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/evse_models/?make_id=emak01HN2NJQRGDQP0GBE1F7R6PB3D
          description: >-
            A pre-constructed link to a list of EVSE models filtered for this
            make.
          readOnly: true
    VehicleOnboardingCompleteRequest:
      title: VehicleOnboardingCompleteRequest
      description: >-
        Request body for `POST /vehicle_onboarding/complete`. Exchanges a
        provider `auth_code` (typically returned by the Smartcar Connect native
        SDK) for the list of vehicles created on the user's account.
      type: object
      x-tags:
        - Vehicles
      required:
        - authorization_request_uid
        - auth_code
      properties:
        authorization_request_uid:
          type: string
          format: uuid
          description: >-
            UUID of the `AccountAuthorizationRequest` returned by the init
            endpoint.
          example: 4d4ce3d9-8a16-46a8-99e1-3f3f9b8a3a5b
        auth_code:
          type: string
          description: OAuth `auth_code` returned by the integration provider.
          example: SC-AUTH-CODE-EXAMPLE
        smartcar_user_id:
          type:
            - string
            - 'null'
          writeOnly: true
          maxLength: 100
          description: >-
            SmartCar user UUID (the `userId` returned alongside `auth_code` on
            the Connect redirect / native SDK callback). Optional; only set for
            the SmartCar provider.
          example: a4c82e9f-0b1c-4d2e-8f3a-5b6c7d8e9f01
    VehicleOnboardingCompleteResponse:
      title: VehicleOnboardingCompleteResponse
      description: >-
        Response body for `POST /vehicle_onboarding/complete`. Always an array;
        the single-vehicle case is returned as a one-element list.
      type: object
      x-tags:
        - Vehicles
      required:
        - vehicles
      properties:
        vehicles:
          type: array
          items:
            type: object
            required:
              - id
              - url
            properties:
              id:
                type: string
                description: V2 UID of the created vehicle.
                example: vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
              url:
                type: string
                format: uri
                description: >-
                  Absolute URL of the vehicle resource (suitable for `GET
                  /v2/vehicles/{uid}`).
                example: >-
                  https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/
    EVSEImportRequest:
      title: EVSEImportRequest
      description: >-
        Request body for `POST /evse_onboarding/import`. The backend uses the
        authenticated user's email (and `secondary_email` if set on the profile)
        to look up the device at the provider, so only the provider name and the
        device's serial number are required from the client.
      type: object
      x-tags:
        - EVSEs
      required:
        - provider
        - serial_number
      properties:
        provider:
          type: string
          description: >-
            The integration provider that owns the EVSE. Must be one of the
            providers that supports serial-number-based import.
          enum:
            - ChargePoint
            - EO
            - SyncEV
            - EnelX
            - Easee
            - Wallbox
            - Zaptec
          example: Wallbox
        serial_number:
          type: string
          description: >-
            The serial number (CPID) of the EVSE as printed on the device or
            shown in the provider's app.
          example: WBX-12345678
    EVSEWaitlistRequest:
      title: EVSEWaitlistRequest
      description: >-
        Request body for `POST /evse_waitlist`. Device identification fields are
        mutually constrained: supply exactly one of (`evse_model_id`) or (both
        `evse_make_name` and `evse_model_name`). Any other combination returns
        `400`. Country is not part of the request body — see endpoint
        description for how it is derived.
      type: object
      x-tags:
        - EVSEs
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address to notify when the user's hardware becomes supported.
          example: user@example.com
        program_id:
          type:
            - string
            - 'null'
          pattern: prog[A-Z\d]{26}
          description: >-
            Optional `ProgramConfig` uid. Captured where known (web signup,
            whitelabel microsite) so later notification logic can scope by
            program.
          example: prog01HRS4TSK26BPBV7127DH7E0HA
        evse_model_id:
          type:
            - string
            - 'null'
          pattern: emod[A-Z\d]{26}
          description: >-
            Uid of an `EVSEModel`. Used when the user picked from the EVSE
            picker. Mutually exclusive with `evse_make_name` /
            `evse_model_name`.
          example: emod01HRS4TSK26BPBV7127DH7E0HA
        evse_make_name:
          type: string
          description: >-
            Free-text make name from manual entry. Must be supplied together
            with `evse_model_name`. Mutually exclusive with `evse_model_id`.
          example: Wallbox
        evse_model_name:
          type: string
          description: >-
            Free-text model name from manual entry. Must be supplied together
            with `evse_make_name`. Mutually exclusive with `evse_model_id`.
          example: Pulsar Pro
    EVSEWaitlistResponse:
      title: EVSEWaitlistResponse
      description: >-
        Response body for `POST /evse_waitlist`. Echoes just the new entry's
        uid; no `url` is returned because the endpoint exposes no retrieve
        action (privacy by design — waitlist entries cannot be enumerated or
        looked up via the public API).
      type: object
      x-tags:
        - EVSEs
      required:
        - id
      properties:
        id:
          type: string
          pattern: ewlt[A-Z\d]{26}
          description: Uid of the created waitlist entry.
          example: ewlt01HRS4TSK26BPBV7127DH7E0HA
    VehicleWaitlistRequest:
      title: VehicleWaitlistRequest
      description: >-
        Request body for `POST /vehicle_waitlist`. Device identification fields
        are mutually constrained: supply exactly one of (`vehicle_model_id`) or
        (both `vehicle_make_name` and `vehicle_model_name`). Any other
        combination returns `400`. Country is not part of the request body — see
        endpoint description for how it is derived.
      type: object
      x-tags:
        - Vehicles
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address to notify when the user's hardware becomes supported.
          example: user@example.com
        program_id:
          type:
            - string
            - 'null'
          pattern: prog[A-Z\d]{26}
          description: >-
            Optional `ProgramConfig` uid. Captured where known (web signup,
            whitelabel microsite) so later notification logic can scope by
            program.
          example: prog01HRS4TSK26BPBV7127DH7E0HA
        vehicle_model_id:
          type:
            - string
            - 'null'
          pattern: vmod[A-Z\d]{26}
          description: >-
            Uid of a `CarModel`. Used when the user picked from the vehicle
            picker. Mutually exclusive with `vehicle_make_name` /
            `vehicle_model_name`.
          example: vmod01HRS4TSK26BPBV7127DH7E0HA
        vehicle_make_name:
          type: string
          description: >-
            Free-text make name from manual entry. Must be supplied together
            with `vehicle_model_name`. Mutually exclusive with
            `vehicle_model_id`.
          example: Tesla
        vehicle_model_name:
          type: string
          description: >-
            Free-text model name from manual entry. Must be supplied together
            with `vehicle_make_name`. Mutually exclusive with
            `vehicle_model_id`.
          example: Model 3
    VehicleWaitlistResponse:
      title: VehicleWaitlistResponse
      description: >-
        Response body for `POST /vehicle_waitlist`. Echoes just the new entry's
        uid; no `url` is returned because the endpoint exposes no retrieve
        action (privacy by design — waitlist entries cannot be enumerated or
        looked up via the public API).
      type: object
      x-tags:
        - Vehicles
      required:
        - id
      properties:
        id:
          type: string
          pattern: vwlt[A-Z\d]{26}
          description: Uid of the created waitlist entry.
          example: vwlt01HRS4TSK26BPBV7127DH7E0HA
    EVSEOnboardingJsonResponse:
      title: EVSEOnboardingJsonResponse
      description: >-
        JSON payload returned by `GET /evse_onboarding?response_type=json`.
        Carries the absolute Start-wrapper URL.
      type: object
      x-tags:
        - EVSEs
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: >-
            Absolute URL to the EVSE onboarding wrapper. Open it in a WebView
            (mobile) or redirect the browser to it (web). The wrapper view
            either redirects to the provider (when a model was supplied) or
            shows the make picker.
          example: >-
            https://api.ev.energy/evse-onboarding/start/abc12345-def6-7890-1234-567890abcdef/
    VehicleOnboardingJsonResponse:
      title: VehicleOnboardingJsonResponse
      description: >-
        JSON payload returned by `GET /vehicle_onboarding?response_type=json`.
        Used by native mobile clients to launch the onboarding flow.
      type: object
      x-tags:
        - Vehicles
      required:
        - authorization_request_id
        - url
        - auth_method
      properties:
        authorization_request_id:
          type: string
          format: uuid
          readOnly: true
          description: >-
            UUID identifying the in-flight onboarding request. Echo it back to
            `POST /vehicle_onboarding/complete` (as `authorization_request_uid`)
            to finish onboarding.
        url:
          type: string
          format: uri
          description: >-
            The integration provider's authorization URL the client should
            navigate to (or pass to the native SDK).
          example: >-
            https://connect.smartcar.com/oauth/authorize?response_type=code&client_id=...
        auth_method:
          type: string
          enum:
            - api
            - native
          description: >-
            Whether the client should open `url` in a WebView (`api`) or launch
            the provider's native SDK with the supplied scopes (`native`).
            `native` is currently used for Smartcar BMW/MINI when the
            `smartcar_native_sdk` waffle flag is enabled.
        scopes:
          type:
            - array
            - 'null'
          items:
            type: string
          description: >-
            OAuth scopes that the SDK should request when `auth_method=native`.
            Null when the field does not apply (for example for
            `auth_method=api` providers that do not surface scopes here).
          example:
            - read_vehicle_info
            - read_charge
            - control_charge
        single_select:
          type:
            - boolean
            - 'null'
          description: >-
            Whether the SDK should restrict the user to picking a single
            vehicle. Null when the field does not apply.
    Vehicle:
      title: Vehicle
      description: A resource representing a single, physical electric vehicle.
      type: object
      x-tags:
        - Vehicles
      required:
        - id
        - url
        - integrated
        - battery_size_watt_hours
        - effective_battery_size_watt_hours
        - maximum_charge_limit_percentage
        - description
        - disabled
        - smart_charging_enabled
        - vehicle_class
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle.
          pattern: vhcl[A-Z\d]{26}
          example: vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          readOnly: true
        trim:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/trim/vehicle_trim01HRFHBCM7VBSWRPVYFBQMH2BR
            - $ref: '#/components/schemas/VehicleTrim'
          description: >-
            Defaults to a url, but can be expanded to the full Trim resource via
            the `expand` query parameter.
          readOnly: true
        user:
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          oneOf:
            - type: string
              format: uri
              example: https://api.ev.energy/v2/user/user01HN2NJ9NMRZBXT1H6FT9N7735
            - $ref: '#/components/schemas/User'
          description: >-
            Defaults to a url, but can be expanded to the full User resource via
            the `expand` query parameter.
        latest_status_log:
          example: >-
            https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-04-17T09:39:45.994584Z/
          oneOf:
            - type:
                - string
                - 'null'
              example: >-
                https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-04-17T09:39:45.994584Z/
              format: uri
            - $ref: '#/components/schemas/VehicleStatusLog'
          description: >-
            An expandable reference to the most recent status log for this
            Vehicle. This can be requested or expanded to get the most accurate
            information we have on the device's current status.
        charging_sub_sessions:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/charging_sub_sessions/?vehicle_id=vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          description: >-
            Provides a pre-constructed URL to list charging sub-sessions
            involving this Vehicle.
        integrated:
          enum:
            - UNINTEGRATED
            - ACTIVE
            - INACTIVE
          description: >-
            Whether we have an integration with this vehicle.

            - `UNINTEGRATED`: This vehicle is not integrated

            - `ACTIVE`: This vehicle is integrated and the connection is
            working.

            - `INACTIVE`: This vehicle has been integrated but the connection
            has been severed, usually because the user needs to reconnect it.
          readOnly: true
        battery_size_watt_hours:
          type: integer
          minimum: 1000
          maximum: 300000
          description: >-
            The nominal battery capacity of the vehicle in watt-hours according
            to the vehicle integration or trim. Editable via PATCH only for
            unintegrated vehicles; sending it for an integrated vehicle is
            rejected. Setting it flags the battery size as user-provided. Stored
            to the nearest 0.01 kWh (10 Wh), so the value read back may be
            rounded.
          example: 60000
        effective_battery_size_watt_hours:
          type: integer
          description: >-
            The effective battery capacity of the vehicle in watt-hours,
            accounting for estimated degradation based on odometer reading. This
            is the value used by the smart charging scheduler.
          readOnly: true
          example: 60000
        maximum_charge_limit_percentage:
          type: integer
          minimum: 50
          maximum: 100
          description: >-
            The target state of charge of the car as a percentage between 50 and
            100. The car will not be smart charged above this value. Can be null
            if target charge level has not been set or we don't know the car's
            battery size.
          default: 100
        description:
          type: string
          maxLength: 200
          description: Human-readable label for the vehicle.
          example: My Volvo C40
          readOnly: true
        disabled:
          type: boolean
          description: >-
            Whether the vehicle has been disabled and can no longer be
            smart-charged or controlled. Set when the user unenrolls the
            vehicle, when an integrated vehicle is switched to unintegrated
            ('dumb'), or when the owning account is pending deletion. Disabled
            vehicles that have not been permanently deleted are still returned
            by this endpoint. This is independent of integrated: a disabled
            vehicle can still report integrated=ACTIVE (e.g. pending deletion),
            and a healthy never-integrated vehicle is not disabled.
          example: false
          readOnly: true
        smart_charging_enabled:
          type: boolean
          description: Whether smart (dynamic) charging is enabled for this vehicle.
          example: true
        vehicle_class:
          type:
            - string
            - 'null'
          enum:
            - PASSENGER
            - COMMERCIAL
            - null
          description: Class of vehicle, passenger or commercial.
          example: PASSENGER
    VehicleWrite:
      title: Vehicle
      description: >-
        Fields that can be set when creating an unintegrated Vehicle resource.
        The client supplies a `model` (and optional `battery_size_watt_hours`);
        the backend resolves or creates a hidden trim under the hood.
      type: object
      x-tags:
        - Vehicles
      required:
        - model
      properties:
        model:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/vehicle_models/vmod01HN2P436099PEQ20B7TKPGTEJ
          readOnly: false
          description: >-
            UID-based URL of an existing CarModel. The backend resolves or
            creates a hidden trim for the given model and (optional) battery
            size.
        battery_size_watt_hours:
          type: integer
          minimum: 1000
          maximum: 300000
          example: 60000
          description: Battery size in watt-hours.
        description:
          type: string
          maxLength: 200
          example: My Volvo C40
          description: >-
            Optional human-readable label for the vehicle. Defaults to a string
            built from the user's email and the resolved make/model when
            omitted.
        vehicle_class:
          type:
            - string
            - 'null'
          enum:
            - PASSENGER
            - COMMERCIAL
            - null
          description: Class of vehicle, passenger or commercial.
          example: PASSENGER
        user:
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          type: string
          format: uri
          readOnly: false
          description: Required if using Client Credentials authentication.
    VehicleTrim:
      title: VehicleTrim
      description: >-
        A resource representing a "trim level" of a particular vehicle model,
        which captures a specific set of features.
      type: object
      x-tags:
        - Vehicles
      required:
        - id
        - url
        - name
        - onboarding_url
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle Trim.
          pattern: trim[A-Z\d]{26}
          example: trim01HRFHBCM7VBSWRPVYFBQMH2BR
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/vehicle_trim/trim01HRFHBCM7VBSWRPVYFBQMH2BR
          readOnly: true
        name:
          type: string
          example: Recharge Core (69 kWh)
          readOnly: true
        model:
          oneOf:
            - type: string
              format: uri
            - $ref: '#/components/schemas/VehicleModel'
        battery_size_watt_hours:
          type:
            - integer
            - 'null'
          description: Battery size in watt-hours. null if not known for this trim.
          example: 75500
          readOnly: true
        onboarding_url:
          type:
            - string
            - 'null'
          example: >-
            https://api.ev.energy/v2/vehicle_onboarding?trim_id=trim01HN2NZ1040Y8E77CQGXADC2TZ&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          format: uri
          description: >-
            A pre-constructed link to initiate onboarding for a vehicle with
            this trim. If it is null, then we do not support intergrating with
            this vehicle and you should POST the trim to
            [/vehicles](ev.energy-API-v2.yaml/paths/~1vehicles/post) to create
            an unintegrated vehicle.


            Your `client_id` and the user's `user_id` are automatically included
            based on your authentication token. If you are using client
            credentials authentication, the user ID will not be automatically
            included unless you set the EvEnergy-User header on your request.
          readOnly: true
    VehicleTrimCreate:
      title: VehicleTrimCreate
      description: Request body for creating a custom vehicle trim.
      type: object
      x-tags:
        - Vehicles
      required:
        - name
        - model
        - battery_size_watt_hours
      properties:
        name:
          type: string
          description: The name of the vehicle trim.
          example: Custom Trim
        model:
          type: string
          format: uri
          description: URL reference to the vehicle model this trim belongs to.
          example: >-
            https://api.ev.energy/v2/vehicle_models/vmod01HSBR8Z36GD7A46K7M4R12VG0
        battery_size_watt_hours:
          type: integer
          description: Battery size in watt hours. Must be between 1000 and 300000.
          minimum: 1000
          maximum: 300000
          example: 75500
    VehicleModelWrite:
      title: VehicleModelWrite
      description: Fields that must be set when creating a VehicleModel resource.
      type: object
      x-tags:
        - Vehicles
      required:
        - name
        - make
      properties:
        name:
          type: string
          description: The name of the vehicle model.
          example: Model 3
        make:
          type: string
          format: uri
          description: URL reference to the vehicle make.
          example: >-
            https://api.ev.energy/v2/vehicle_makes/vmak01HRFHBCM7VBSWRPVYFBQMH2BR
    VehicleModel:
      title: VehicleModel
      description: A resource representing a model of vehicle.
      type: object
      x-tags:
        - Vehicles
      required:
        - id
        - url
        - name
        - default_battery_size_watt_hours
        - default_connector_type
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle Model.
          pattern: vmod[A-Z\d]{26}
          example: vmod01HSBR8Z36GD7A46K7M4R12VG0
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/vehicle_models/vmod01HSBR8Z36GD7A46K7M4R12VG0
          readOnly: true
        name:
          type: string
          example: C40
          readOnly: true
        make:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/vehicle_makes/vmak01HRFHBCM7VBSWRPVYFBQMH2BR
            - $ref: '#/components/schemas/VehicleMake'
        onboarding_url:
          type:
            - string
            - 'null'
          format: uri
          example: >-
            https://api.ev.energy/v2/vehicle_onboarding?model_id=vmod01HN2P436099PEQ20B7TKPGTEJ&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          description: >-
            A pre-constructed link to initiate onboarding for a vehicle of this
            model. If it is null, then it cannot be onboarded with model alone.
            You should filter the list of [vehicle
            trims](ev.energy-API-v2.yaml/paths/~1vehicle_trims/get) by this
            model and then have the user select their trim.


            Your `client_id` and the user's `user_id` are automatically included
            based on your authentication token. If you are using client
            credentials authentication, the user ID will not be automatically
            included unless you set the EvEnergy-User header on your request.
        vehicle_trims:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/vehicle_trims?model_id=vmod01HN2P436099PEQ20B7TKPGTEJ
          description: >
            A pre-constructed link to a list of vehicle trims filtered for this
            model.
          readOnly: true
        default_battery_size_watt_hours:
          type: integer
          description: >-
            Default battery size in watt-hours for this model, derived from the
            most common battery size across trims. Falls back to 45000 Wh if no
            trim data exists.
          example: 79000
          readOnly: true
        default_connector_type:
          type:
            - string
            - 'null'
          enum:
            - CCS
            - NACS
            - CHADEMO
            - null
          description: |-
            Default charging connector type for this model, used to pre-fill
            connector selection during vehicle onboarding. Null when not yet
            known. Editable via PATCH with the `vehicle_catalogue:write` scope.
    VehicleModelUpdate:
      title: VehicleModelUpdate
      description: Request body for `PATCH /vehicle_models/{vehicle_model_id}`.
      type: object
      properties:
        default_connector_type:
          type:
            - string
            - 'null'
          enum:
            - CCS
            - NACS
            - CHADEMO
            - null
    VehicleMake:
      title: VehicleMake
      description: A resource representing a vehicle manufacturer.
      type: object
      x-tags:
        - Vehicles
      required:
        - id
        - url
        - name
        - icon
        - onboarding_url
        - models
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle Make.
          pattern: vmak[A-Z\d]{26}
          example: vmak01HRFHBCM7VBSWRPVYFBQMH2BR
          readOnly: true
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/vehicle_makes/vmak01HRFHBCM7VBSWRPVYFBQMH2BR
          readOnly: true
        name:
          type: string
          example: Volvo
          readOnly: true
        icon:
          type:
            - string
            - 'null'
          format: uri
          example: https://cdn.example.com/volvo.png
          description: A url for an image of the make's logo.
          readOnly: true
        onboarding_url:
          type:
            - string
            - 'null'
          example: >-
            https://api.ev.energy/v2/vehicle_onboarding/?make_id=vmak01HN2P75GBNFRJPCZJXEFVXH5E&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          description: >-
            A pre-constructed link to initiate onboarding for a vehicle of this
            make. If it is null, then it cannot be onboarded with make alone.
            You should filter the list of [vehicle
            models](ev.energy-API-v2.yaml/paths/~1vehicle_models/get) by this
            make and then have the user select their model.


            Your `client_id` and the user's `user_id` are automatically included
            based on your authentication token. If you are using client
            credentials authentication, the user ID will not be automatically
            included unless you set the EvEnergy-User header on your request.
          readOnly: true
        models:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/vehicle_models?make_id=vmak01HN2P75GBNFRJPCZJXEFVXH5E
          description: >-
            A pre-constructed link to a list of vehicle models filtered for this
            make.
          readOnly: true
        subscription_name:
          type:
            - string
            - 'null'
          description: >-
            Full OEM telematics subscription name required for vehicle
            connectivity (e.g. 'Volkswagen We Connect ID'). Null if no
            subscription is required.
          example: Volkswagen We Connect ID
          readOnly: true
        subscription_package:
          type:
            - string
            - 'null'
          description: >-
            Specific OEM subscription package required (e.g. 'We Connect ID').
            Null if no subscription is required.
          example: We Connect ID
          readOnly: true
    VehicleCompatibilityCheckResult:
      title: VehicleCompatibilityCheckResult
      description: |-
        Compatibility verdict for a `(vehicle_model, country)` pair.
        Returned by `GET /vehicle_compatibility/check`.
      type: object
      required:
        - compatible
        - recommendation_rank
      properties:
        compatible:
          type: boolean
          description: True if the model is supported in the requested country.
        recommendation_rank:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 10
          description: |-
            Priority of the car make on the new device-selection screen.
            Lower = higher priority (1 = top, 10 = lowest explicit value);
            `null` means no rank set and should be treated as lower priority
            than any explicit value. Always reflects the make's current
            value, independent of `compatible`.
    ProgramVehicleCompatibility:
      title: ProgramVehicleCompatibility
      description: >-
        A vehicle compatibility record indicating whether a particular vehicle
        model is supported for smart charging.
      type: object
      x-tags:
        - Vehicles
      properties:
        can_control_charge:
          type: boolean
          description: Whether ev.energy can control charging for this vehicle model.
          example: true
          readOnly: true
        model:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/vehicle_models/vmod01HSBR8Z36GD7A46K7M4R12VG0
            - $ref: '#/components/schemas/VehicleModel'
          description: >-
            Link to the vehicle model by default. Expanded to full object when
            ?expand=model is used.
          readOnly: true
        type:
          type:
            - string
            - 'null'
          description: >-
            The vehicle type: BEV (Battery Electric Vehicle) or PHEV (Plug-in
            Hybrid Electric Vehicle).
          example: BEV
          enum:
            - BEV
            - PHEV
            - null
          readOnly: true
        supported_countries:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
          description: >-
            List of ISO 3166-1 alpha-2 country codes this vehicle is compatible
            in.
          example:
            - US
            - CA
          readOnly: true
        start_year:
          type: integer
          description: The first model year this compatibility applies to.
          example: 2020
          readOnly: true
        end_year:
          type:
            - integer
            - 'null'
          description: >-
            The last model year this compatibility applies to. Null if still in
            production.
          example: 2026
          readOnly: true
    ScheduleInterval:
      title: ScheduleInterval
      description: >-
        A schedule interval represents a charging instruction for a specific
        time period within a charging session. It specifies the charging current
        (in milliamps) that should be applied during that period.
      type: object
      x-tags:
        - Schedules
      properties:
        started_at:
          type: string
          format: date-time
          example: '2024-01-01T02:00:00Z'
          description: >-
            The start time of the period this schedule applies to. Always
            aligned to half-hour boundaries (:00 or :30).
          readOnly: true
        interval_seconds:
          type:
            - integer
            - 'null'
          example: 1800
          description: >-
            The duration of this schedule in seconds. Currently always 1800
            seconds (30 minutes), or null for boost sessions which have no
            defined end time.
          readOnly: true
        current_milliamps:
          type: integer
          example: 7400
          description: >-
            The charging current in milliamps that should be applied during this
            period. A value of 0 means no charging.
          readOnly: true
        schedule_type:
          type: string
          example: SMART
          enum:
            - INITIAL_CHARGE_TIME
            - BATTERY_WARMING
            - SMART
            - BOOST
            - SOLAR_ONLY
            - SOLAR_SMART
            - V2G_DISCHARGE
            - V2G_CHARGEBACK
            - LEGACY
          description: |-
            The type of scheduling that generated this instruction.

            - INITIAL_CHARGE_TIME: Initial charge to condition the battery
            - BATTERY_WARMING: Pre-warming the hour before the ready-by-time
            - SMART: Optimised smart charging
            - BOOST: Immediate charging at maximum rate
            - SOLAR_ONLY: Charging only from solar generation
            - SOLAR_SMART: Combined solar and smart charging
            - V2G_DISCHARGE: Vehicle-to-grid discharge
            - V2G_CHARGEBACK: Charging back after V2G discharge
            - LEGACY: Legacy schedules from before type tracking
          readOnly: true
        dispatched_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2024-01-01T02:00:15Z'
          description: >-
            When this schedule was last sent to the device. Null if not yet
            dispatched.
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T01:55:00Z'
          description: When this schedule was created.
          readOnly: true
    ChargingSession:
      title: ChargingSession
      type: object
      description: >-
        Represents a single physical plug-in episode (plug in → unplug). A
        session may contain multiple charging sub-sessions if the charging mode
        changed while the vehicle was plugged in. Only recorded from the
        feature's release (July 2026) onwards — earlier charging history is not
        backfilled. See [Understanding charging
        data](docs/understanding/charging_sessions.md).
      x-tags:
        - Charging sessions
      required:
        - id
        - url
        - start
      properties:
        id:
          type: string
          description: Unique identifier for the charging session.
          pattern: cses[A-Z\d]{26}
          example: cses01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sessions/cses01HSH04KDEWF6Z4DB2J77J74K5
        start:
          type: string
          format: date-time
          description: >-
            When the plug-in episode began, i.e. when the vehicle was plugged
            in.
          readOnly: true
        end:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the plug-in episode ended, i.e. when the vehicle was unplugged.
            Null while the vehicle is still plugged in.
          readOnly: true
        vehicle:
          oneOf:
            - type:
                - string
                - 'null'
              format: uri
              example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
            - $ref: '#/components/schemas/Vehicle'
        evse:
          oneOf:
            - type:
                - string
                - 'null'
              format: uri
              example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/EVSE'
        sub_sessions:
          oneOf:
            - type: array
              items:
                type: string
                format: uri
              example:
                - >-
                  https://api.ev.energy/v2/charging_sub_sessions/csub01HSH08F2YWBKZ9NXR7P3QD5VT
                - >-
                  https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
              description: Links to sub-sessions by default.
            - type: array
              items:
                $ref: '#/components/schemas/ChargingSubSession'
              description: >-
                Expanded sub-sessions when ?expand=sub_sessions is used, ordered
                newest first.
          description: >-
            Links by default, expanded data when ?expand=sub_sessions is used.
            Ordered newest first.
    ChargingSubSessionCreatedWebhook:
      title: Charging Sub Session Created Webhook
      description: Webhook payload delivered when a charging sub-session is created.
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          enum:
            - charging_sub_session.created
          description: The event type. Also delivered in the `svix-event-type` header.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp for when the event occurred.
        data:
          description: >-
            The created charging sub-session, in the same format returned by
            `GET /v2/charging_sub_sessions/{id}`.
          allOf:
            - $ref: '#/components/schemas/ChargingSubSession'
      examples:
        - type: charging_sub_session.created
          timestamp: '2022-11-03T20:26:10.344522Z'
          data:
            id: csub01HSH04KDEWF6Z4DB2J77J74K5
            url: >-
              https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
            start: '2019-08-24T14:15:22Z'
            end: null
            mode: SMART
            energy_delivered_watt_hours: 0
            location:
              name: Home
            cost: 0
            currency: GBP
            total_co2_grams: 0
            co2_intensity_grams_per_kilowatt_hour: 1
            co2_intensity_classification: low
            duration_minutes: 0
            grid_energy_delivered_watt_hours: 0
            solar_energy_delivered_watt_hours: 0
    ChargingSubSessionEndedWebhook:
      title: Charging Sub Session Ended Webhook
      description: Webhook payload delivered when a charging sub-session ends.
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          enum:
            - charging_sub_session.ended
          description: The event type. Also delivered in the `svix-event-type` header.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp for when the event occurred.
        data:
          description: >-
            The ended charging sub-session, in the same format returned by `GET
            /v2/charging_sub_sessions/{id}`.
          allOf:
            - $ref: '#/components/schemas/ChargingSubSession'
      examples:
        - type: charging_sub_session.ended
          timestamp: '2022-11-03T20:26:10.344522Z'
          data:
            id: csub01HSH04KDEWF6Z4DB2J77J74K5
            url: >-
              https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
            start: '2019-08-24T14:15:22Z'
            end: '2019-08-24T15:15:22Z'
            mode: SMART
            energy_delivered_watt_hours: 2300
            location:
              name: Home
            cost: 634
            currency: GBP
            total_co2_grams: 229
            co2_intensity_grams_per_kilowatt_hour: 1
            co2_intensity_classification: low
            duration_minutes: 60
            grid_energy_delivered_watt_hours: 1840
            solar_energy_delivered_watt_hours: 460
    ChargingSubSession:
      title: SubSession
      type: object
      description: >-
        Represents a period within a charging session (one plug-in episode) when
        the same charging mode was active. Begins either when a vehicle is
        plugged in or when it switches mode (eg. from smart to boost) and ends
        either when the vehicle is unplugged or the mode switches again. Note
        that start/end bound the period the mode was active — not when energy
        was actually flowing. Energy may be delivered during only part of the
        sub-session, or in several separate bursts (see the energy_usage
        endpoint). See [Understanding charging
        data](docs/understanding/charging_sessions.md).
      x-tags:
        - Charging sessions
      required:
        - id
        - url
        - start
        - end
        - mode
        - energy_delivered_watt_hours
        - location
        - cost
        - currency
        - total_co2_grams
        - co2_intensity_grams_per_kilowatt_hour
        - co2_intensity_classification
        - duration_minutes
        - grid_energy_delivered_watt_hours
        - solar_energy_delivered_watt_hours
      properties:
        id:
          type: string
          description: Unique identifier for the given Charging sub-session.
          pattern: csub[A-Z\d]{26}
          example: csub01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
        start:
          type: string
          format: date-time
          description: >-
            When this sub-session began — either when the vehicle was plugged
            in, or when the charging mode changed (e.g. the user activated
            boost). Not necessarily when energy started flowing; see the
            energy_usage endpoint for actual delivery intervals.
          readOnly: true
        end:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When this sub-session ended — either when the vehicle was unplugged,
            or when the charging mode changed again. Null while the sub-session
            is ongoing. Energy delivery often finishes well before this time
            (e.g. once the target charge level is reached).
          readOnly: true
        mode:
          enum:
            - SMART
            - BOOST
            - UNMANAGED_HOME
            - UNMANAGED_OTG
            - MANAGED_OTG
          description: |-
            The type of scheduling applied during this period.

            SMART: Actively optimised charging

            BOOST: Charge immediately

            UNMANAGED_HOME: No optimisation, at a home location

            UNMANAGED_OTG: No optimisation, at an on-the-go (public) location

            MANAGED_OTG: Optimised charging at an on-the-go (public) location
          readOnly: true
        vehicle:
          oneOf:
            - type:
                - string
                - 'null'
              example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
              format: uri
            - $ref: '#/components/schemas/Vehicle'
        evse:
          oneOf:
            - type:
                - string
                - 'null'
              example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
              format: uri
            - $ref: '#/components/schemas/EVSE'
        energy_delivered_watt_hours:
          type: integer
          example: 2300
          description: Net energy delivered to the vehicle during this sub-session in Wh.
          readOnly: true
        cost:
          type:
            - integer
            - 'null'
          example: 634
          readOnly: true
        location:
          type: object
          properties:
            name:
              type: string
              example: Home
              readOnly: true
            coordinates:
              type: object
              $ref: '#/components/schemas/LatLong'
              description: Can be null
            postal_code:
              type:
                - string
                - 'null'
              maxLength: 10
            address_1:
              type:
                - string
                - 'null'
            timezone:
              type:
                - string
                - 'null'
              example: Europe/London
