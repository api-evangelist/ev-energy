  /hem_systems/{hem_system_id}/energy_stats:
    parameters:
      - schema:
          type: string
        name: hem_system_id
        in: path
        required: true
        description: The ID of the specific HEM system.
    get:
      summary: Get aggregated energy statistics for a HEM system
      description: >-
        Returns aggregated energy statistics for the HEM system over a specified
        time range and resolution.


        Returns 400 Bad Request if query parameters are invalid (missing,
        malformed timestamps, unsupported resolution, or misaligned boundaries).
      tags:
        - HEM Systems
      responses:
        '200':
          description: Returns aggregated energy statistics for the HEM system.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HEMSystemEnergyStatsResponse'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-hem_systems-hem_system_id-energy_stats
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-06-01T00:00:00Z'
          description: >-
            Start of time range (ISO 8601 with timezone, e.g.
            2024-06-01T00:00:00Z or 2024-05-31T23:00:00+01:00). Must be aligned
            to the resolution in the HEM system's timezone: :00 or :30 for
            PT30M, midnight for P1D, 1st of month at midnight for P1M.
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-07-01T00:00:00Z'
          description: >-
            End of time range (ISO 8601 with timezone, e.g. 2024-07-01T00:00:00Z
            or 2024-06-30T23:00:00+01:00). Must be aligned to the resolution in
            the HEM system's timezone: :00 or :30 for PT30M, midnight for P1D,
            1st of month at midnight for P1M.
        - name: resolution
          in: query
          required: true
          schema:
            type: string
            enum:
              - PT30M
              - P1D
              - P1M
            example: P1D
          description: >-
            Aggregation resolution: PT30M (30 minutes, max 24h window), P1D (1
            day, max 31 days), or P1M (1 month, max 366 days).
        - $ref: '#/components/parameters/version-2'
      security:
        - oauth2:
            - home_energy:read
