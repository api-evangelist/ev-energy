  /support_tickets/categories:
    get:
      summary: Get support ticket categories
      tags:
        - Support Tickets
      description: Returns all available support ticket categories and subcategories.
      operationId: get-support_tickets-categories
      responses:
        '200':
          description: Returns all available categories and subcategories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    description: >-
                      List of all available ticket categories. Each category
                      includes the enum value and its human-readable label.
                    items:
                      type: object
                      required:
                        - value
                        - label
                      properties:
                        value:
                          allOf:
                            - $ref: '#/components/schemas/SupportTicketCategoryEnum'
                          description: >-
                            The enum value (ALL_CAPS format) for programmatic
                            use.
                          example: CHARGER
                        label:
                          type: string
                          description: Human-readable label for display.
                          example: Charger
                  subcategories:
                    type: array
                    description: >-
                      List of all available ticket subcategories. Each
                      subcategory includes the enum value and its human-readable
                      label.
                    items:
                      type: object
                      required:
                        - value
                        - label
                      properties:
                        value:
                          allOf:
                            - $ref: >-
                                #/components/schemas/SupportTicketSubcategoryEnum
                          description: >-
                            The enum value (ALL_CAPS format) for programmatic
                            use.
                          example: HARDWARE_ISSUE
                        label:
                          type: string
                          description: Human-readable label for display.
                          example: Hardware Issue
              examples:
                Example:
                  value:
                    categories:
                      - value: ACCOUNT
                        label: Account
                      - value: CHARGER
                        label: Charger
                      - value: CHARGING_SESSION
                        label: Charging Session
                      - value: MOBILE_APP
                        label: Mobile App
                      - value: OTHER
                        label: Other
                      - value: SOLAR
                        label: Solar
                      - value: USABILITY_UX
                        label: Usability/UX
                      - value: VEHICLE
                        label: Vehicle
                    subcategories:
                      - value: ACCESSIBILITY
                        label: Accessibility
                      - value: HARDWARE_ISSUE
                        label: Hardware Issue
                      - value: APP_CRASH_FREEZE
                        label: App crash / freeze
                      - value: TELEMATICS_ISSUE
                        label: Telematics issue
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      parameters:
        - $ref: '#/components/parameters/version-2'
  /support-ticket-stats/sankey:
    get:
      summary: Get support ticket Sankey diagram data
      tags:
        - Support Tickets
      description: >-
        Returns aggregated data for visualizing ticket flow from category to
        subcategory in a Sankey diagram. Only includes tickets with
        human-verified categories.
      operationId: get-support_ticket_stats-sankey
      responses:
        '200':
          description: Returns Sankey diagram nodes and links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    description: >-
                      List of nodes in the Sankey diagram (categories and
                      subcategories).
                    items:
                      type: object
                      required:
                        - id
                        - label
                      properties:
                        id:
                          type: string
                          description: >-
                            Unique identifier for the node (prefixed with
                            'category:' or 'subcategory:').
                          example: category:Charger
                        label:
                          type: string
                          description: Human-readable label for display.
                          example: Charger
                  links:
                    type: array
                    description: List of links between nodes representing ticket flows.
                    items:
                      type: object
                      required:
                        - source
                        - target
                        - value
                      properties:
                        source:
                          type: string
                          description: ID of the source node (category).
                          example: category:Charger
                        target:
                          type: string
                          description: ID of the target node (subcategory).
                          example: subcategory:Hardware Issue
                        value:
                          type: integer
                          description: Number of tickets flowing from source to target.
                          example: 42
              examples:
                Example:
                  value:
                    nodes:
                      - id: category:Charger
                        label: Charger
                      - id: subcategory:Hardware Issue
                        label: Hardware Issue
                    links:
                      - source: category:Charger
                        target: subcategory:Hardware Issue
                        value: 42
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      parameters:
        - $ref: '#/components/parameters/version-2'
  /support-ticket-stats/volume:
    get:
      summary: Get support ticket volume time series
      tags:
        - Support Tickets
      description: >-
        Returns time series data showing ticket volume over time. Can be grouped
        by day, week, or month.
      operationId: get-support_ticket_stats-volume
      responses:
        '200':
          description: Returns time series data for ticket volume.
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_series:
                    type: array
                    description: List of time periods with ticket counts.
                    items:
                      type: object
                      required:
                        - date
                        - count
                      properties:
                        date:
                          type: string
                          format: date
                          description: ISO 8601 date string for the time period.
                          example: '2024-01-15'
                        count:
                          type: integer
                          description: Number of distinct tickets created in this period.
                          example: 23
              examples:
                Example:
                  value:
                    time_series:
                      - date: '2024-01-15'
                        count: 23
                      - date: '2024-01-16'
                        count: 31
                      - date: '2024-01-17'
                        count: 18
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      parameters:
        - $ref: '#/components/parameters/version-2'
        - name: group_by
          in: query
          description: Time period to group by (day, week, or month). Defaults to day.
          schema:
            type: string
            enum:
