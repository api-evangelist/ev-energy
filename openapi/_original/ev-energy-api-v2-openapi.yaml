  /charging_sub_sessions/{charging_sub_session_id}/recalculate_energy_usages:
    parameters:
      - $ref: '#/components/parameters/charging_sub_session_id'
    post:
      summary: Recalculate energy usages for a charging sub-session
      description: >
        Triggers a recalculation of energy usages (and performance assessment)
        for a completed

        charging sub-session. Use `dry_run` to preview the recalculation without
        persisting

        changes, and `cap_overages` to control whether energy overages are
        capped.
      tags:
        - Charging Sessions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                  description: >-
                    If true, the recalculation is simulated and no changes are
                    persisted.
                cap_overages:
                  type: boolean
                  default: true
                  description: If true, energy overages are capped during recalculation.
      responses:
        '200':
          description: >
            Recalculation has been triggered (or simulated if `dry_run` was
            true). The

            response includes the total energy delivered for the session both
            before and

            after the recalculation so the caller can see the effect. When
            `dry_run` is

            true, `new_energy_delivered_watt_hours` reflects the prospective
            value that

            would result from the recalculation (no persistence).
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - previous_energy_delivered_watt_hours
                  - new_energy_delivered_watt_hours
                properties:
                  status:
                    type: string
                    enum:
                      - recalculation_triggered
                      - dry_run_completed
                    example: recalculation_triggered
                  previous_energy_delivered_watt_hours:
                    type: integer
                    description: >-
                      Total energy delivered for the session before the
                      recalculation, in watt-hours.
                    example: 3500
                  new_energy_delivered_watt_hours:
                    type: integer
                    description: >-
                      Total energy delivered for the session after the
                      recalculation, in watt-hours. When `dry_run` is true, this
                      is the prospective value that would result from
                      committing.
                    example: 4250
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: >-
        post-charging_sub_sessions-charging_sub_session_id-recalculate_energy_usages
      parameters:
        - $ref: '#/components/parameters/version-2'
      security:
        - oauth2:
            - charging_session:write
      x-stoplight:
        id: chargingsubsession-recalculate-energy-usages-endpoint
