  /support_tickets/{support_ticket_id}:
    parameters:
      - $ref: '#/components/parameters/support_ticket_id'
    get:
      summary: Retrieve support ticket
      description: >-
        Retrieve information about a single, specific support ticket.


        Access control:

        - User-scoped tokens: Can only access tickets belonging to that user

        - Organization-scoped tokens: Can only access tickets belonging to users
        in that organization

        - Tokens with access_all_areas: Can access all tickets including those
        without a user


        Note: Tickets without a user (null user field) will return 404 for
        tokens without access_all_areas permission.
      tags:
        - Support Tickets
      responses:
        '200':
          description: Returns a single support ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-support_tickets-support_ticket_id
      parameters:
        - $ref: '#/components/parameters/version-2'
        - $ref: '#/components/parameters/expand-on-supportticket'
      security:
        - oauth2:
            - support:read
    patch:
      summary: Update support ticket
      tags:
        - Support Tickets
      responses:
        '200':
          description: Support ticket updated successfully.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: patch-support_tickets-support_ticket_id
      security:
        - oauth2:
            - support:write
      description: >-
        Update support ticket categorization.


        Access control follows the same rules as retrieval:

        - User-scoped tokens: Can only update tickets belonging to that user

        - Organization-scoped tokens: Can only update tickets belonging to users
        in that organization

        - Tokens with access_all_areas: Can update all tickets including those
        without a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicket'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTicket'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTicket'
      parameters:
        - $ref: '#/components/parameters/version-2'
  /support_tickets/{support_ticket_id}/messages:
    parameters:
      - $ref: '#/components/parameters/support_ticket_id'
    get:
      summary: List messages for a support ticket
      description: >-
        List all messages in a support ticket conversation, ordered by position.


        Access control follows the same rules as the parent support ticket:

        - User-scoped tokens: Can only access messages for tickets belonging to
        that user

        - Organization-scoped tokens: Can only access messages for tickets
        belonging to users in that organization

        - Tokens with access_all_areas: Can access messages for all tickets
        including those without a user
      tags:
        - Support Tickets
      responses:
        '200':
          description: Returns a list of messages for the specified support ticket.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportTicketMessage'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestList'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-support_tickets-support_ticket_id-messages
      parameters:
        - $ref: '#/components/parameters/version-2'
        - schema:
            type: string
          in: query
          name: message_type
          description: >-
            Filter by message type (e.g., INITIAL_REQUEST, CUSTOMER_RESPONSE,
            HUMAN_AGENT_RESPONSE, AI_AGENT_RESPONSE)
        - schema:
            type: string
          in: query
          name: message_type__in
          description: Filter by multiple message types (comma-separated)
        - schema:
            type: integer
          in: query
          name: position
          description: Filter by message position in the conversation (0 is first message)
        - schema:
            type: integer
          in: query
          name: position__gte
          description: Filter for messages at or after this position
        - schema:
            type: integer
          in: query
          name: position__lte
          description: Filter for messages at or before this position
      security:
        - oauth2:
            - support:read
