            prices:
              oneOf:
                - type: string
                  format: uri
                  example: >-
                    https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735/prices
                - type: array
                  items:
                    $ref: '#/components/schemas/Price'
                - type: 'null'
              description: >-
                Link to prices endpoint by default. When expanded with
