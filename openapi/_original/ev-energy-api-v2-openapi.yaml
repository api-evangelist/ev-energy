              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
  /region_groups:validate:
    post:
      summary: Validate a region group upload
      tags:
        - Regions
      operationId: post-region_groups:validate
      description: >-
        Zero-write dry-run of POST /region_groups with the identical body.
        Always returns 200 for content findings (name clashes, invalid geometry,
        duplicate names) — the findings ARE the response. Clashing entries
        include the existing region's URL; renaming the submitted region is the
        only resolution — regions are never replaced or linked.
      security:
        - oauth2:
            - region:write
      parameters:
        - $ref: '#/components/parameters/version-2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionGroupCreate'
      responses:
        '200':
          description: Validation findings. Zero writes occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionGroupValidationResult'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
        '400':
          $ref: '#/components/responses/Problem400BadRequestCreate'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '413':
          description: >-
            Request body exceeds the 20 MB limit (problem type
            payload-too-large).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '422':
          description: >-
            The body itself is malformed (missing name, wrong field types, more
            than 500 regions). Content-level findings return 200 instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
