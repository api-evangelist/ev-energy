    GeoJsonPolygon:
      title: GeoJsonPolygon
      type: object
      description: >-
        RFC 7946 GeoJSON Polygon in WGS 84. Positions are [longitude, latitude]
        (note the order — this is the GeoJSON interchange standard, not the
        {latitude, longitude} object used elsewhere in this API). The first ring
        is the exterior boundary; any further rings are holes.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          description: >-
            Array of linear rings; each ring is a closed list of [longitude,
            latitude] positions (first position repeated last).
          minItems: 1
          maxItems: 100
          items:
            type: array
            minItems: 4
            maxItems: 25000
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    GeoJsonMultiPolygon:
      title: GeoJsonMultiPolygon
      type: object
      description: >-
        RFC 7946 GeoJSON MultiPolygon in WGS 84. Positions are [longitude,
        latitude]. Each member is a Polygon coordinate array.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - MultiPolygon
        coordinates:
          type: array
          description: Array of Polygon coordinate arrays.
          minItems: 1
          maxItems: 500
          items:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: array
              minItems: 4
              maxItems: 25000
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
