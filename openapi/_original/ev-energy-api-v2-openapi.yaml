    UsageInterval:
      title: UsageInterval
      type: object
      properties:
        interval_seconds:
          type: integer
          description: The number of seconds that this interval lasts for.
          readOnly: true
        started_at:
          type: string
          format: date-time
          description: When this interval began.
          readOnly: true
        total_energy_delivered_watt_hours:
          type: integer
          description: The total number of watt hours delivered during the interval.
          readOnly: true
        meter_usage_watt_hours:
          type: integer
          nullable: true
          description: >-
            An estimate of the supply meter usage in watt hours during the
            interval, accounting for charging system losses between the supply
            meter and the EVSE/Vehicle. Null when not available.
          readOnly: true
        alt_usage_watt_hours:
          type: integer
          nullable: true
          description: >-
            Counterfactual energy usage in watt hours. Represents the estimated
            energy that would have been delivered during this interval if the
            vehicle had charged immediately without managed charging. Null when
            not available.
          readOnly: true
        percentage_import:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: >-
            The percentage of energy imported from the grid during this interval
            (0-100). Used for calculating costs with home solar.
          readOnly: true
        electricity_cost_sub_unit:
          type: string
          format: decimal
          nullable: true
          description: >-
            The electricity rate for this interval, in the smallest sub-unit of
            the currency (e.g. pence/kWh, cents/kWh). For merged intervals with
            multiple pricing tiers, this is the sum of the distinct rate values.
          readOnly: true
        energy_delivered_by_price:
          type: object
          $ref: '#/components/schemas/EnergyDeliveredByPrice'
          description: >-
            Energy delivered during the interval, broken down by the price paid
            for that energy. For example, if half the period was at peak price
            (50p) and half at off-peak price (20p), this field would contain an
            entry for 20p and an entry for 50p with the total energy delivered
            at each price. Note that prices are always quoted in the smallest
            sub-unit of the currency. (Ie. cents for USD, pence for GBP.)
          readOnly: true
    EnergyDeliveredByPrice:
      title: EnergyDeliveredByPrice
      type: object
      properties:
        price:
          type: string
          description: The price paid for the energy in the smallest unit of the currency.
          example: '21.3'
          format: decimal
        energy_delivered_watt_hours:
          type: integer
          example: 1800
    EnergyUsage:
      title: EnergyUsage
      type: object
      description: >-
        Detailed energy usage for a charging sub-session, reported as a list of
        intervals recording when energy was actually delivered to the vehicle
        and how much. Use this (rather than the sub-session's start/end) to
        determine when charging actually happened.
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/energy_usage
          readOnly: true
        currency:
          type: string
          example: GBP
          description: >-
            The currency that prices for intervals are quoted in. Note that we
            always use the smallest unit of the currency.
          readOnly: true
        charging_sub_session:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        intervals:
          type: array
          description: A list of energy usage intervals for this charging sub-session.
          items:
            $ref: '#/components/schemas/UsageInterval'
          readOnly: true
        last_updated_at:
          type: string
          format: date-time
          description: The datetime when the energy usages were last updated at.
    ChargingSessionFlag:
      title: ChargingSessionFlag
      type: object
      properties:
        name:
          type: string
          description: >-
            Name describing the type of issue flagged. New values may be added
            over time.
          example: ENERGY_OVER_DELIVERY
        root_cause:
          type: string
          description: >-
            Category describing the root cause of the issue. New values may be
            added over time.
          example: CHARGE_MEASUREMENT_OSCILLATION
      required:
        - name
        - root_cause
    ChargingSubSessionFlags:
      title: ChargingSubSessionFlags
      type: object
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/flags
          readOnly: true
        charging_sub_session:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
              readOnly: true
            - $ref: '#/components/schemas/ChargingSubSession'
          description: The charging sub-session these flags belong to. Expandable.
        flags:
          type: array
          description: A list of flags associated with this charging sub-session.
          items:
            $ref: '#/components/schemas/ChargingSessionFlag'
          readOnly: true
      required:
        - url
        - charging_sub_session
        - flags
    ChargingSubSessionDebugMetadata:
      title: ChargingSubSessionDebugMetadata
      type: object
      description: Session-level diagnostic information for a charging sub-session.
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/debug_metadata
          readOnly: true
        charging_sub_session:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
              readOnly: true
            - $ref: '#/components/schemas/ChargingSubSession'
          description: The charging sub-session this debug metadata belongs to. Expandable.
        start_reason:
          oneOf:
            - type: string
              enum:
                - BOOST_START
                - SMART_CHARGE_ENABLED
                - SMART_CHARGE_DISABLED
                - SOLAR_SETTINGS
                - ADMIN_CREATE_FAKE
                - ADMIN_IMPORT_CSV
                - REPROCESS_VEHICLEDATALOGS_CMD
                - SFTP_IMPORTER
                - EVSE_CONNECT
                - CP_EVSE_CONNECT
                - VEHICLE_LOG_CONNECT
                - USER_SETTINGS
            - type: 'null'
          description: >-
            The reason the session was started. New values may be added over
            time.
          readOnly: true
        finish_reason:
          oneOf:
            - type: string
              enum:
                - BOOST_START
                - SMART_CHARGE_ENABLED
                - SMART_CHARGE_DISABLED
                - SOLAR_SETTINGS
                - ADMIN_ACTION
                - FAKE_CURRENT_CHARGING_CMD
                - REPROCESS_VEHICLEDATALOGS_CMD
                - SFTP_IMPORTER
                - INVALIDATE_ACCOUNT
                - REMOVE_INTEGRATION
                - EVSE_UNPAIR
                - EVSE_DISCONNECT
            - type: 'null'
          description: The reason the session finished. New values may be added over time.
          readOnly: true
        is_energy_delivered_capped:
          type: boolean
          description: >-
            Indicates whether delivered energy was capped to prevent unrealistic
            over-delivery beyond the vehicle's battery capacity.
          readOnly: true
        uncapped_energy_delivered_watt_hours:
          oneOf:
            - type: integer
            - type: 'null'
          description: >-
            The recalculated energy in watt-hours that would have been delivered
            without capping. Null when energy delivery was not capped or when
            recalculation cannot be completed.
          readOnly: true
        energy_usage_calculation_method:
          type: string
          enum:
            - ESTIMATED_CHARGE_ENERGY_ADDED
            - ESTIMATED_CHARGE_LEVEL
            - ESTIMATED_CHARGE_RATE
            - METERED
            - METERED_CHARGE_RATE
            - BETA_ESTIMATED_CHARGE_ENERGY_ADDED
            - ESTIMATED_CHARGE_LEVEL_WITH_INFERENCE
            - MANUAL_ENTRY
          description: The method used to calculate energy usage for this session.
          readOnly: true
        energy_usage_interpolation_method:
          type: string
          enum:
            - LINEAR
            - LINEAR_WITH_CHARGE_STEP
          description: >-
            The method used to interpolate data readings when calculating energy
            usage.
          readOnly: true
        solar_integration_type:
          oneOf:
            - type: string
              enum:
                - UNAVAILABLE
                - HARDWARE
                - SOFTWARE
                - SOFTWARE_BETA
                - HARDWARE_PASSTHROUGH
            - type: 'null'
          description: >-
            The solar integration type of the EVSE paired with this session.
            Null when no EVSE is associated with the session.
          readOnly: true
      required:
        - url
        - charging_sub_session
        - start_reason
        - finish_reason
        - is_energy_delivered_capped
        - uncapped_energy_delivered_watt_hours
        - energy_usage_calculation_method
        - energy_usage_interpolation_method
        - solar_integration_type
    Schedules:
      title: Schedules
      type: object
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/schedules
          readOnly: true
        charging_sub_session:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/ChargingSubSession'
          description: >-
            The charging sub-session these schedules belong to. Defaults to a
            url, but can be expanded to the full ChargingSubSession resource via
            the `expand` query parameter.
          readOnly: true
        schedules:
          type: array
          description: A list of schedule intervals for this charging sub-session.
          items:
            $ref: '#/components/schemas/ScheduleInterval'
          readOnly: true
    SchedulePlans:
      title: SchedulePlans
      type: object
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/schedule_plans
          readOnly: true
        charging_sub_session:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/ChargingSubSession'
          description: >-
            The charging sub-session these schedule plans belong to. Defaults to
            a url, but can be expanded to the full ChargingSubSession resource
            via the `expand` query parameter.
          readOnly: true
        schedule_plans:
          type: array
          description: A list of schedule plans for this charging sub-session.
          items:
            $ref: '#/components/schemas/SchedulePlan'
          readOnly: true
    SchedulePlan:
      title: SchedulePlan
      type: object
      description: >-
        A schedule plan containing the parameters used to generate charging
        schedules.
      properties:
        id:
          type: string
          pattern: scpl[A-Z\d]{26}
          example: scpl01HSH04KDEWF6Z4DB2J77J74K5
          description: Unique identifier for this schedule plan.
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T02:00:00Z'
          description: When this schedule plan was created.
          readOnly: true
        ready_by_time:
          type: string
          format: date-time
          example: '2024-01-01T08:00:00Z'
          description: The target time by which charging should be complete.
          readOnly: true
        price_threshold_minor_unit:
          type:
            - integer
            - 'null'
          example: 1500
          description: >-
            Price threshold in minor currency units (e.g., cents/pence)
            multiplied by 100. For example, 1500 represents 15 pence (£0.15),
            and 50 represents 0.5 pence (£0.005). Null if no threshold set.
          readOnly: true
        power_on_current_milliamps:
          type: integer
          example: 32000
          description: The charging current in milliamps when power is on.
          readOnly: true
        power_off_current_milliamps:
          type: integer
          example: 0
          description: The current in milliamps when power is off (typically 0).
          readOnly: true
        seconds_to_charge:
          type: integer
          example: 10800
          description: The number of seconds required to complete charging.
          readOnly: true
        vehicle_charge_level_watt_hours:
          type:
            - integer
            - 'null'
          example: 25000
          description: >-
            The vehicle's battery level in watt-hours at the time the plan was
            created. Null if unknown.
          readOnly: true
        estimated_charge_rate_watts:
          type: integer
          example: 7400
          description: The estimated charging rate in watts.
          readOnly: true
        estimated_charge_rate_source:
          type:
            - string
            - 'null'
          enum:
            - CURRENT_SESSION_EVSE_DATA_LOGS
            - CURRENT_SESSION_VEHICLE_DATA_LOGS
            - ENERGY_TRANSFER_PERIODS
            - DEFAULT_CHARGE_RATE
            - MAX_EVSE_CHARGE_RATE
            - MAX_VEHICLE_CHARGE_RATE
            - null
          description: >-
            The source of data used for estimating charge rate. Null if not
            specified.
          readOnly: true
        watt_hours_to_charge:
          type: integer
          example: 22000
          description: The total energy required to complete charging in watt-hours.
          readOnly: true
        min_charge_limit_percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 0
          description: The minimum charge limit as a percentage (0-100).
          readOnly: true
        max_charge_limit_percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 80
          description: The maximum charge limit as a percentage (0-100).
          readOnly: true
        price_data:
          oneOf:
            - type: 'null'
            - type: array
              items:
                $ref: '#/components/schemas/Price'
          description: >-
            Tariff rate intervals active when this schedule plan was created.
            Null by default; expand with ?expand=price_data to populate. Returns
            null if no tariff is associated with the session.
          readOnly: true
    ChargingSubSessionAssessment:
      title: ChargingSubSessionAssessment
      type: object
      description: Performance assessment for a completed charging sub-session.
      properties:
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/assessment
          readOnly: true
        charging_sub_session:
          oneOf:
            - type: string
              format: uri
              example: >-
                https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
            - $ref: '#/components/schemas/ChargingSubSession'
          description: >-
            The parent charging sub-session. Defaults to a url, but can be
            expanded to the full ChargingSubSession resource via the `expand`
            query parameter.
          readOnly: true
        energy_delivered_to_capacity_percentage:
          type:
            - integer
            - 'null'
          description: >-
            Energy delivered as a percentage of battery capacity. Values above
            100 indicate overdelivery.
          example: 85
          readOnly: true
        energy_delivery_percentage:
          type:
            - integer
            - 'null'
          description: Energy delivered as a percentage of energy required.
          example: 92
          readOnly: true
        average_charge_rate_watts:
          type:
            - integer
            - 'null'
          description: Average charge rate in watts throughout the session.
          example: 7200
          readOnly: true
        max_charge_rate_watts:
          type:
            - integer
            - 'null'
          description: Maximum charge rate in watts throughout the session.
          example: 11000
          readOnly: true
        metrics:
          $ref: '#/components/schemas/ChargingSubSessionAssessmentMetrics'
          readOnly: true
        ratings:
          $ref: '#/components/schemas/ChargingSubSessionAssessmentRatings'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: When the assessment was last updated.
          readOnly: true
    ChargingSubSessionAssessmentMetrics:
      title: ChargingSubSessionAssessmentMetrics
      type: object
      description: >-
        Performance quality metrics for a charging session assessment. All
        fields are nullable.
      properties:
        vehicle_data_uptime:
          type:
            - integer
            - 'null'
          description: Vehicle data uptime as a percentage (0-100).
          example: 95
        vehicle_location_uptime:
          type:
            - integer
            - 'null'
          description: Vehicle location uptime as a percentage (0-100).
          example: 90
        vehicle_error_rate:
          type:
            - integer
            - 'null'
          description: Vehicle error rate as a percentage (0-100).
          example: 2
        vehicle_command_adherence:
          type:
            - integer
            - 'null'
          description: Vehicle command adherence as a percentage (0-100).
          example: 88
        evse_data_uptime:
          type:
            - integer
            - 'null'
          description: EVSE data uptime as a percentage (0-100).
          example: 98
        evse_command_adherence:
          type:
            - integer
            - 'null'
          description: EVSE command adherence as a percentage (0-100).
          example: 92
        schedule_quality:
          type:
            - integer
            - 'null'
          description: >-
            Time that schedule requested charging but no charge occurred as a
            percentage (0-100).
          example: 85
        charge_outside_of_schedule:
          type:
            - integer
            - 'null'
          description: Energy usage outside of schedule as a percentage (0-100).
          example: 5
        session_duration:
          type:
            - integer
            - 'null'
          description: Session duration.
          example: 28800
        energy_delivered_vs_required:
          type:
            - integer
            - 'null'
          description: Energy delivered vs required as a percentage (0-100).
          example: 95
        savings_attainment_rate:
          type:
            - integer
            - 'null'
          description: >-
            Savings achieved compared to theoretical maximum as a percentage
            (0-100).
          example: 78
        session_savings_range:
          type:
            - integer
            - 'null'
          description: >-
            Difference between maximum and minimum theoretical session costs
            (units of currency).
          example: 30
        charge_energy_added_meter_reset:
          type:
            - boolean
            - 'null'
          description: Whether a charge energy added meter reset was detected.
          example: false
        charge_energy_added_oscillation_count:
          type:
            - integer
            - 'null'
          description: Number of charge energy added oscillations.
          example: 0
        charge_level_oscillation_count:
          type:
            - integer
            - 'null'
          description: Number of charge level oscillations.
          example: 1
        charge_location_data_at_session_start_minutes:
          type:
            - integer
            - 'null'
          description: Age of charge location data at session start, in minutes.
          example: 5
        last_location_update_implied_velocity_kmh:
          type:
            - integer
            - 'null'
          description: Implied velocity from last location update, in km/h.
          example: 0
        distance_from_home_meters:
          type:
            - integer
            - 'null'
          description: Distance from home in meters.
          example: 15
        missing_location:
          type:
            - boolean
            - 'null'
          description: Whether location data is missing.
          example: false
        vehicle_median_data_gap_duration_minutes:
          type:
            - integer
            - 'null'
          description: Median vehicle data gap duration in minutes.
          example: 3
        vehicle_max_data_gap_duration_minutes:
          type:
            - integer
            - 'null'
          description: Maximum vehicle data gap duration in minutes.
          example: 12
        vehicle_data_frequency_below_threshold:
          type:
            - integer
            - 'null'
          description: Vehicle data frequency below threshold as a percentage (0-100).
          example: 8
        evse_median_data_gap_duration_minutes:
          type:
            - integer
            - 'null'
          description: Median EVSE data gap duration in minutes.
          example: 2
        evse_max_data_gap_duration_minutes:
          type:
            - integer
            - 'null'
          description: Maximum EVSE data gap duration in minutes.
          example: 8
        evse_data_frequency_below_threshold:
          type:
            - integer
            - 'null'
          description: EVSE data frequency below threshold as a percentage (0-100).
          example: 5
        charge_rate_max_mad_score:
          type:
            - integer
            - 'null'
          description: Maximum MAD score for charge rate.
          example: 3
        charge_rate_max_median_ratio:
          type:
            - integer
            - 'null'
          description: Charge rate max to median ratio as a percentage (0-100).
          example: 140
    ChargingSubSessionAssessmentRatings:
      title: ChargingSubSessionAssessmentRatings
      type: object
      description: >-
        RAG (Red/Amber/Green) quality ratings for assessment metrics. Includes
        an overall quality rating.
      additionalProperties:
        type: string
        enum:
          - RED
          - AMBER
          - GREEN
          - NOT_APPLICABLE
      example:
        overall: RED
        energy_delivered_to_capacity_ratio: RED
        energy_delivery_ratio: RED
        average_charge_rate_watts: AMBER
        max_charge_rate_watts: AMBER
        vehicle_data_uptime: GREEN
        schedule_quality: GREEN
        session_duration: GREEN
    IncentiveScheme:
      title: IncentiveScheme
      type: object
      description: >-
        Incentive Schemes define a set of rules for how an elgible User can earn
        monetary Incentives.
      examples:
        - id: incs01JE3ZY9Z2C0E087C942B9WKBC
          name: Off-Peak Charging Incentives
          description: Earn $0.10 per kWh when charging off-peak
          visible: false
          available: true
      properties:
        id:
          type: string
          description: 'Prefix: "incs"'
        name:
          type: string
          description: Name to be displayed to the User.
        description:
          type: string
          description: Describes the rules of how the User earns this Incentive.
        visible:
          type: boolean
          default: false
          description: Should this Incentive Scheme be visible to the User in the App.
        available:
          type: boolean
          default: true
          description: >-
            Is this Incentive available for the User to earn.

            Some Incentive Schemes can only be earned a limitted number of times
            per User or Device.

            E.g. A Sign Up Incentive that can only be earned once per Device.

            This will also be False if it is outside the active period of the
            Incentive Scheme.
    EVSESite:
      title: EVSESite
      type: object
      description: >-
        Represents a place with one or more EVSEs installed which can be
        accessed by multiple users.
      required:
        - id
        - url
        - evses
        - cpms_connection
      properties:
        id:
          type: string
          pattern: site[A-Z\d]{26}
          examples:
            - site01JX2SZ0WAFTDYVYY0JRAYREY7
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse_sites/site01JX2SZ0WAFTDYVYY0JRAYREY7
          readOnly: true
        evses:
          type: array
          description: A list of all EVSEs that are currently associated with this site.
          items:
            type: string
            format: uri
            examples:
              - https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        cpms_connection:
          type:
            - string
            - 'null'
          description: >-
            The type of ChargePoint Management System that this site is
            connected to, if there is one.
          enum:
            - null
            - CHARGEPOINT
            - SWTCH
          readOnly: true
        cpms_connection_display_name:
          type:
            - string
            - 'null'
          description: >-
            A human-readable name for the Chargepoint Management System that the
            site is connected to.
          example: ChargePoint
        user_connected:
          type:
            - boolean
            - 'null'
          description: >-
            When authenticated as a specific user (eg. via the Authorisation
            Code grant type) or when the EvEnergy-User header is set to a valid
            user ID, this field will indicate whether the user is currently
            connected to this EVSE Site's CPMS. If the request is not made in
            the context of a user, or the site does not have a CPMS connection,
            this field will be null.
          readOnly: true
    VPPModes:
      title: VPPModes
      type: object
      description: >-
        VPP (Virtual Power Plant) mode capabilities indicating which control
        modes are supported by the resource.
      required:
        - target_power
        - import_max_power
        - export_max_power
        - charge_mode
      properties:
        target_power:
          type: boolean
          description: Whether target power control mode is supported.
          readOnly: true
          example: true
        import_max_power:
          type: boolean
          description: Whether import maximum power control mode is supported.
          readOnly: true
          example: true
        export_max_power:
          type: boolean
          description: Whether export maximum power control mode is supported.
          readOnly: true
          example: false
        charge_mode:
          type: boolean
          description: Whether charge mode control is supported.
          readOnly: true
          example: true
      examples:
        - target_power: true
          import_max_power: true
          export_max_power: false
          charge_mode: true
    EVSEConnectivity:
      title: EVSEConnectivity
      type: object
      description: >-
        Connectivity snapshot for an EVSE including signal strength, SIM data,
        firmware version, and connection reliability.
      required:
        - signal_strength_rssi_dbm
        - lowest_signal_strength_rssi_dbm_7d
        - highest_signal_strength_rssi_dbm_7d
        - connection_reliability_30d
        - ip_address
        - iccid
        - firmware_version
        - latest_status_log
      properties:
        signal_strength_rssi_dbm:
          type:
            - integer
            - 'null'
          description: Last known signal strength in RSSI dBm. Null for WiFi EVSEs.
          readOnly: true
          example: -65
        lowest_signal_strength_rssi_dbm_7d:
          type:
            - integer
            - 'null'
          description: >-
            Lowest signal strength in RSSI dBm over the past 7 days. Null for
            WiFi EVSEs.
          readOnly: true
          example: -89
        highest_signal_strength_rssi_dbm_7d:
          type:
            - integer
            - 'null'
          description: >-
            Highest signal strength in RSSI dBm over the past 7 days. Null for
            WiFi EVSEs.
          readOnly: true
          example: -57
        connection_reliability_30d:
          type: integer
          description: >-
            Connection reliability over the past 30 days, from 0 (fully offline)
            to 100 (fully online).
          readOnly: true
          example: 97
        ip_address:
          type:
            - string
            - 'null'
          description: >-
            The IP address assigned to the EVSE's SIM. Null if no SIM data is
            available.
          readOnly: true
          example: 10.193.28.42
        iccid:
          type:
            - string
            - 'null'
          description: The ICCID of the EVSE's SIM card. Null if no SIM data is available.
          readOnly: true
          example: '8944110000001234567'
        firmware_version:
          type:
            - string
            - 'null'
          description: The current firmware version running on the EVSE. Null if not known.
          readOnly: true
          example: 1.2.3
