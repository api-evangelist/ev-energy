        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-support_tickets
      description: >-
        List all support tickets that the authorization token has access to.


        Access control:

        - User-scoped tokens: Returns only tickets belonging to that user

        - Organization-scoped tokens: Returns only tickets belonging to users in
        that organization

        - Tokens with access_all_areas: Returns all tickets including those
        without a user


        Note: Tickets without a user (null user field) are only accessible to
        applications with access_all_areas permission. These tickets represent
        inquiries from channels where a user account may not exist (e.g.,
        pre-signup inquiries, web forms).
      parameters:
        - $ref: '#/components/parameters/previous'
        - $ref: '#/components/parameters/next'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/version-2'
        - $ref: '#/components/parameters/expand-on-supportticket'
        - schema:
            type: string
          in: query
          name: external_ticket_id
          description: Filter by external ticket ID from support system
        - schema:
