        Note: daily_prices and type are only available under contract. Please
        reach out to your account manager to find out more.
      x-tags:
        - Tariffs
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            scheduler_tariff:
              oneOf:
                - type: string
                  format: uri
                  example: >-
