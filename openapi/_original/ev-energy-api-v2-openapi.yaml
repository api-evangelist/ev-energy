    link:
      description: Provides links to the previous and next pages of data, if they exist.
      example: >-
        <https://api.ev.energy/v2/vehicles?page_size=25&page_before=vhcl01HRFF3SEVSCRAV9B3CHVDFN0H>;
        rel="previous",
        <https://api.ev.energy/v2/vehicles?page_size=25&page_after=vhcl01HRFF3SEVSCRAV9B3CHVDFN0H>;
        rel="next"
      schema:
        type: string
    link-timestamps:
      description: Provides links to the previous and next pages of data, if they exist.
      example: >-
        <https://api.ev.energy/v2/vehicles?page_size=25&page_before=2024-04-18T08:53:52.225655Z>;
        rel="previous",
        <https://api.ev.energy/v2/vehicles?page_size=25&page_after=2024-04-18T08:53:52.225655Z>;
        rel="next"
      schema:
        type: string
    link-pages:
      description: Provides links to the previous and next pages of data, if they exist.
      example: >-
        <about:blank>; rel="previous",
        <https://api.ev.energy/v2/examples/?page=2&page_size=25>; rel="next"
      schema:
        type: string
    version-2:
      description: >-
        Indicates the version of the API that generated this response. If
        EvEnergy-Version was not specified in the request, this will be your
        OAuth application's default version.
      schema:
        type: number
        enum:
          - 2
    x-ratelimit-limit:
      description: >-
        The maximum number of requests that can be made to this endpoint per
        hour. Defaults to 1000 but may vary per client.
      schema:
        type: number
        default: 1000
    x-ratelimit-remaining:
      description: >-
        The number of requests remaining until this client's rate limit is
        reached.
      schema:
        type: number
        default: 999
    retry-after:
      description: >-
        The number of seconds until this client's requests will not be rate
        limited.
      schema:
        type: number
        default: 3600
