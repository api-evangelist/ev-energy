    LatLong:
      title: LatLong
      type: object
      description: Coordinates model used for locations.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: float
          example: 51.52576576674041
        longitude:
          type: number
          format: float
          example: -0.08366433371722264
    Location:
      title: Location
      type: object
      description: >
        Location model for charging locations.


        **Address validation:** Address fields are optional as a group, but each
        field independently triggers the requirement. If any of `address_1`,
        `address_2`, `city`, `state`, `postal_code`, `country_code`, or
        `coordinates` is provided with a non-null value, then `address_1`,
        `city`, `postal_code`, and `country_code` must all be provided as
        non-null values. Sending the keys with explicit `null` values is allowed
        and does not trigger the requirement (this is how addresses are cleared
        via `PATCH`). Partial addresses are rejected with a 400.
      properties:
        address_1:
          type:
            - string
            - 'null'
          description: First line of address.
        address_2:
          type:
            - string
            - 'null'
          description: Second line of address.
        postal_code:
          type:
            - string
            - 'null'
          description: Postal Code.
        country_code:
          anyOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
          $ref: '#/components/schemas/CountryCode'
        coordinates:
          anyOf:
            - $ref: '#/components/schemas/LatLong'
            - type: 'null'
        tariff:
          oneOf:
            - format: uri
              type:
                - string
                - 'null'
              example: https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735
            - $ref: '#/components/schemas/Tariff'
        city:
          type:
            - string
            - 'null'
        state:
          type:
            - string
            - 'null'
        evse_site:
          oneOf:
            - type:
                - string
                - 'null'
            - $ref: '#/components/schemas/EVSESite'
          description: >-
            If null, the user's location is not an EVSE Site. Otherwise, this
            field references the site they are a part of.
      dependentSchemas:
        address_1:
          if:
            properties:
              address_1:
                not:
                  type: 'null'
          then:
            required:
              - city
              - postal_code
              - country_code
            properties:
              city:
                not:
                  type: 'null'
              postal_code:
                not:
                  type: 'null'
              country_code:
                not:
                  type: 'null'
        address_2:
          if:
            properties:
              address_2:
                not:
                  type: 'null'
          then:
            required:
              - address_1
              - city
              - postal_code
              - country_code
            properties:
              address_1:
                not:
                  type: 'null'
              city:
                not:
                  type: 'null'
              postal_code:
                not:
                  type: 'null'
              country_code:
                not:
                  type: 'null'
        city:
          if:
            properties:
              city:
                not:
                  type: 'null'
          then:
            required:
              - address_1
              - postal_code
              - country_code
            properties:
              address_1:
                not:
                  type: 'null'
              postal_code:
                not:
                  type: 'null'
              country_code:
                not:
                  type: 'null'
        state:
          if:
            properties:
              state:
                not:
                  type: 'null'
          then:
            required:
              - address_1
              - city
              - postal_code
              - country_code
            properties:
              address_1:
                not:
                  type: 'null'
              city:
                not:
                  type: 'null'
              postal_code:
                not:
                  type: 'null'
              country_code:
                not:
                  type: 'null'
        postal_code:
          if:
            properties:
              postal_code:
                not:
                  type: 'null'
          then:
            required:
              - address_1
              - city
              - country_code
            properties:
              address_1:
                not:
                  type: 'null'
              city:
                not:
                  type: 'null'
              country_code:
                not:
                  type: 'null'
        country_code:
          if:
            properties:
              country_code:
                not:
                  type: 'null'
          then:
            required:
              - address_1
              - city
              - postal_code
            properties:
              address_1:
                not:
                  type: 'null'
              city:
                not:
                  type: 'null'
              postal_code:
                not:
                  type: 'null'
        coordinates:
          if:
            properties:
              coordinates:
                not:
                  type: 'null'
          then:
            required:
              - address_1
              - city
              - postal_code
              - country_code
            properties:
              address_1:
                not:
                  type: 'null'
              city:
                not:
                  type: 'null'
              postal_code:
                not:
                  type: 'null'
              country_code:
                not:
                  type: 'null'
    LocationDetail:
      title: Location
      description: >-
        Extra fields only included when a single location is requested but
        omitted when locations are listed.
      allOf:
        - type: object
          properties:
            current_carbon_intensity_grams_per_kilowatt_hour:
              type:
                - integer
                - 'null'
              example: 300
              description: >-
                The current carbon intensity associated with the location in
                gCO2/kWh.
        - $ref: '#/components/schemas/Location'
    Program:
      title: Program
      type: object
      properties:
        id:
          type: string
          example: prog01JCK1HPNAANB8WN253G27SFPC
          pattern: prog[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          example: https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC
          format: uri
          readOnly: true
        name:
          type: string
          example: CoolCharge
          description: A human-friendly name for the Program.
          readOnly: true
        description:
          type: string
          example: >-
            A program which incentivises charging when it's coolest to charge
            your EV
          description: >-
            A plain text description of the program's incentives and
            requirements.
          readOnly: true
        logo:
          type:
            - string
            - 'null'
          format: uri
          description: URL to download a logo image for the Program.
          readOnly: true
        sponsor_name:
          type: string
          example: Cool Power
          description: >-
            The name of the organisation which sponsors the program. Often, but
            not always, a utility company.
          readOnly: true
        external_url:
          type: string
          format: uri
          example: https://www.example.com/coolcharge
          description: >-
            A publicly accessible URL where individuals can enroll in the
            program.
          readOnly: true
    ProgramTier:
      title: ProgramTier
      type: object
      example:
        id: tier01JCK1HPNAANB8WN253G27SFPC
        url: >-
          https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC/tiers/tier01JCK1HPNAANB8WN253G27SFPC
        short_name: standard
        name: Standard Tier
        logo_svg: https://api.ev.energy/media/program_tiers/standard.svg
        description_short: <html>Charge at off-peak times to earn standard rewards.</html>
        description_long: >-
          <html><p>Members of the Standard Tier earn rewards for charging during
          off-peak hours. No additional eligibility requirements
          apply.</p></html>
        smart_charging_enabled: true
        disable_changing_tariff: false
        visible: true
        eligible: true
      properties:
        id:
          type: string
          example: tier01JCK1HPNAANB8WN253G27SFPC
          pattern: tier[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          example: >-
            https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC/tiers/tier01JCK1HPNAANB8WN253G27SFPC
          format: uri
          readOnly: true
        short_name:
          type: string
          example: standard
          description: A short slug-style identifier for the tier, unique within a program.
          readOnly: true
        name:
          type:
            - string
            - 'null'
          example: Standard Tier
          description: A human-friendly name for the tier.
          readOnly: true
        logo_svg:
          type:
            - string
            - 'null'
          format: uri
          description: URL to download an SVG logo for the tier.
          readOnly: true
        description_short:
          type:
            - string
            - 'null'
          description: >-
            Short HTML description of the tier. Wrapped in `<html>` tags on both
            real and sandbox responses.
          readOnly: true
        description_long:
          type:
            - string
            - 'null'
          description: >-
            Longer HTML description of the tier. Wrapped in `<html>` tags on
            both real and sandbox responses.
          readOnly: true
        smart_charging_enabled:
          type: boolean
          description: Whether smart charging is enabled for users in this tier.
          readOnly: true
        disable_changing_tariff:
          type: boolean
          description: Whether users in this tier are blocked from changing their tariff.
          readOnly: true
        visible:
          type: boolean
          description: >-
            Whether this tier should be shown to users when selecting a tier
            within the program.
          readOnly: true
        eligible:
          type:
            - boolean
            - 'null'
          description: >
            Whether the authenticated user is eligible to join this tier.
            Populated only when

            the request is authenticated as a specific user (Authorization Code
            / Password grant,

            or Client Credentials with the `EvEnergy-User` header). `null` for
            anonymous and

            pure client-credentials requests.
          readOnly: true
    ParticipationAgreementVersion:
      title: ParticipationAgreementVersion
      type: object
      description: |
        A version of a Program's Participation Agreement. Programs have a single
        Participation Agreement with versioned content; users accept a version
        via `POST .../{id}/accept`. The currently active version is the
        highest-numbered published one — fetch it from the `current`
        sub-resource.
      properties:
        id:
          type: string
          example: pagv01JCDYP6Z8MX9XWVAV0A7G3KPN
          pattern: pagv[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          format: uri
          example: >-
            https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC/participation_agreement_versions/pagv01JCDYP6Z8MX9XWVAV0A7G3KPN
          readOnly: true
        version_number:
          type: integer
          example: 1
          description: >-
            Monotonically increasing version number scoped to the parent
            agreement.
          readOnly: true
        published:
          type: boolean
          description: |
            Whether this version is the currently active one shown to users.
            Only one version per agreement should be published at a time.
          readOnly: true
        content:
          type: string
          description: >-
            HTML content of the agreement, translated for the requesting user's
            language.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When this version was created.
          readOnly: true
    Region:
      title: Region
      type: object
      description: >-
        A named geographic boundary (WGS 84) used to gate program tier
        eligibility, tariffs, carbon feeds and reward offers. Names are globally
        unique and immutable once created. The list representation omits the
        geometry; request a single region for the full GeoJSON MultiPolygon.
      properties:
        id:
          type: string
          example: regn01JCK1HPNAANB8WN253G27SFPC
          pattern: regn[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/regions/regn01JCK1HPNAANB8WN253G27SFPC
          readOnly: true
        name:
          type: string
          example: WEST ROXBURY
          description: Globally unique region name. Immutable after creation.
        type:
          type:
            - string
            - 'null'
          enum:
            - OTHER
            - ELECTRICITY
            - null
          description: Optional classification of the region.
        region_groups:
          type: array
          description: URLs of the region groups this region belongs to.
          readOnly: true
          items:
            type: string
            format: uri
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RegionDetail:
      title: Region
      description: >-
        Region including its full geometry. Served for single-region requests;
        the geometry is omitted from region lists.
      allOf:
        - $ref: '#/components/schemas/Region'
        - type: object
          properties:
            geometry:
              description: >-
                The region's boundary as a GeoJSON MultiPolygon, or null if the
                region has no geometry.
              oneOf:
                - $ref: '#/components/schemas/GeoJsonMultiPolygon'
                - type: 'null'
    RegionCreate:
      title: RegionCreate
      type: object
      required:
        - name
        - geometries
      properties:
        name:
          type: string
          description: >-
            Globally unique region name. A clash returns 409
            region-name-conflict — there is no upsert on this endpoint.
        type:
          type:
            - string
            - 'null'
          enum:
            - OTHER
            - ELECTRICITY
            - null
        geometries:
          type: array
          description: >-
            One or more GeoJSON Polygon/MultiPolygon geometries. The server
            unions them (GEOS unary union, make_valid applied) into a single
            MultiPolygon.
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - $ref: '#/components/schemas/GeoJsonPolygon'
              - $ref: '#/components/schemas/GeoJsonMultiPolygon'
        region_groups:
          type: array
          description: URLs of existing region groups to link the new region to.
          items:
            type: string
            format: uri
    RegionGroupEntry:
      title: RegionGroupEntry
      type: object
      required:
        - name
        - geometries
      properties:
        name:
          type: string
          example: MILTON
          description: >-
            Must not match any existing region — clashes fail the whole request
            with 409.
        type:
          type:
            - string
            - 'null'
          enum:
            - OTHER
            - ELECTRICITY
            - null
        geometries:
          type: array
          description: >-
            One or more GeoJSON Polygon/MultiPolygon geometries, unioned
            server-side into a single MultiPolygon.
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - $ref: '#/components/schemas/GeoJsonPolygon'
              - $ref: '#/components/schemas/GeoJsonMultiPolygon'
    RegionGroupCreate:
      title: RegionGroupCreate
      type: object
      required:
        - name
        - regions
      properties:
        name:
          type: string
          example: Eversource MA Pilot 1A
          description: Unique name for the new group.
        regions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/RegionGroupEntry'
    RegionGroup:
      title: RegionGroup
      type: object
      properties:
        id:
          type: string
          example: rgrp01JCK1HPNAANB8WN253G27SFPC
          pattern: rgrp[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        name:
          type: string
          example: Eversource MA Pilot 1A
        regions:
          type: array
          description: URLs of the member regions.
          readOnly: true
          items:
            type: string
            format: uri
        regions_collection:
          type: string
          format: uri
          description: Pre-built link to the regions collection filtered to this group.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    RegionValidationResult:
      title: RegionValidationResult
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - OK
            - NAME_EXISTS
            - INVALID_GEOMETRY
            - INVALID
        problems:
          type: array
          items:
            type: string
        computed:
          type:
            - object
            - 'null'
          properties:
            geometry_count:
              type: integer
            resulting_polygon_count:
              type: integer
            area_sq_km:
              type: number
        existing_region:
          type:
            - string
            - 'null'
          format: uri
          description: Present when status is NAME_EXISTS — URL of the clashing region.
    RegionGroupValidationResult:
      title: RegionGroupValidationResult
      type: object
      properties:
        valid:
          type: boolean
          description: True when committing the identical body would succeed.
        group:
          type: object
          properties:
            name:
              type: string
            status:
              type: string
              enum:
                - AVAILABLE
                - NAME_EXISTS
            problems:
              type: array
              items:
                type: string
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RegionValidationResult'
