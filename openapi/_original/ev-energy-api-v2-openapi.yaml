              - week
              - month
            default: day
  /support-ticket-stats/resolution:
    get:
      summary: Get support ticket resolution metrics
      tags:
        - Support Tickets
      description: >-
        Returns metrics about ticket resolution including resolution rate,
        average and median resolution times.
      operationId: get-support_ticket_stats-resolution
      responses:
        '200':
          description: Returns resolution metrics.
          content:
            application/json:
              schema:
                type: object
                required:
