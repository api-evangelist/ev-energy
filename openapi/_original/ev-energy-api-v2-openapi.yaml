  /charging_sub_sessions/{charging_sub_session_id}/energy_usage:
    parameters:
      - $ref: '#/components/parameters/charging_sub_session_id'
    get:
      summary: Retrieve periodic energy usage intervals for a charging sub-session
      description: >-
        Retrieve periodic energy usage intervals for a specific charging
        sub-session. This is the endpoint to use to find out when energy was
        actually delivered to the vehicle.


        A sub-session's start/end only mark when its charging mode was active —
        within that window, energy delivery may begin late (e.g. smart charging
        waiting for an off-peak period), finish early (e.g. the target charge
        level was reached), or occur in several separate bursts. The intervals
        returned here report the actual delivery.


        By default, intervals are regular fixed-length periods. If you are
        looking for intervals that cover the whole time energy is being
        delivered (which are therefore of irregular length) — for example to
        find the actual charging windows — use the `merge_consecutive_intervals`
        query parameter. Gaps where no energy flowed are returned as intervals
        with zero energy delivered; filter them out with
        `energy_delivered_watt_hours__gt=0` if you only want the charging
        windows.


        See [Understanding charging
        data](docs/understanding/charging_sessions.md) for how charging
        sessions, sub-sessions and energy usage intervals relate.
      tags:
        - Charging Sessions
      responses:
        '200':
          description: >-
            Returns information about a single charging sub-session's energy
            usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyUsage'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-charging_sub_sessions-charging_sub_session_id-energy_usage
      parameters:
        - $ref: '#/components/parameters/version-2'
        - $ref: '#/components/parameters/expand-on-chargingsubsession-energyusage'
        - $ref: '#/components/parameters/energy_delivered_watt_hours__gt'
        - schema:
            type: boolean
          in: query
          name: merge_consecutive_intervals
          description: >-
            Request consecutive intervals of energy delivery (and intervals of
            no delivery) to be merged into combined periods of irregular
