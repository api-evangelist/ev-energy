          scheduler_tariff: https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7835
          current_price: 10
          prices: >-
            https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735/prices
      description: >-
        Extra fields only included when a single tariff is requested. Note:
