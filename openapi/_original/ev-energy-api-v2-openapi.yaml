    get:
      summary: List region groups
      tags:
        - Regions
      operationId: get-region_groups
      description: List the region groups created by your organisation.
      security:
        - oauth2:
            - region:read
      parameters:
        - $ref: '#/components/parameters/version-2'
        - $ref: '#/components/parameters/previous'
        - $ref: '#/components/parameters/next'
        - $ref: '#/components/parameters/page_size'
        - schema:
            type: string
          in: query
          name: name
          description: Exact group name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegionGroup'
          headers:
            Link:
              $ref: '#/components/headers/link'
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
        '400':
          $ref: '#/components/responses/Problem400BadRequestList'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
    post:
      summary: Create region group
      tags:
        - Regions
      operationId: post-region_groups
      description: >-
        Atomically create a region group together with its member regions. Names
        are unique across all organisations, and every submitted region name
        must be fresh — a clash with an existing region always fails the whole
        request with 409; regions are never replaced or linked. Any failure
        rolls the whole request back — nothing is partially written. Send the
        identical body to POST /region_groups:validate first for a zero-write
        preview. The creating application must be linked to an organisation
        (creation is attributed to it, and only that organisation can read the
        group and regions afterwards) — otherwise 403.
      security:
        - oauth2:
            - region:write
      parameters:
        - $ref: '#/components/parameters/version-2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionGroupCreate'
      responses:
        '201':
          description: Group and regions created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionGroup'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
        '400':
          $ref: '#/components/responses/Problem400BadRequestCreate'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '409':
          description: >-
            Name conflict — either the group name is taken (problem type
            region-group-name-conflict, extension member
            `existing_region_group`) or one or more region entries clash with
            existing regions (problem type region-name-conflict, extension
            member `conflicts`). Includes clashes that appeared between
            :validate and this commit. Nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '413':
          description: >-
            Request body exceeds the 20 MB limit (problem type
            payload-too-large).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '422':
          description: >-
            Validation failed — unrepairable geometry (invalid-geometry, naming
            the region), duplicate/empty names, more than 500 regions, or an
            empty group (validation-failed-regions).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
  /region_groups/{region_group_id}:
    parameters:
      - schema:
          type: string
          pattern: rgrp[A-Z\d]{26}
        name: region_group_id
        in: path
        required: true
    get:
      summary: Retrieve region group
      tags:
