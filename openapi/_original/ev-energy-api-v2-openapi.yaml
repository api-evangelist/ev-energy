        type: string
        example: vmod01HN2NV5DY9C262PQKG75GHN8K
      description: The ID of a Vehicle Model to filter by.
    user_id_onboarding:
      name: user_id
      in: query
      required: true
      schema:
        type: string
        pattern: user[A-Z\d]{26}
        example: user01HN2NJ9NMRZBXT1H6FT9N7735
      description: The ID of a user to onboard a device for.
    evenergy-user-required:
      name: EvEnergy-User
      in: header
      required: false
      description: >-
        This endpoints requires a user ID to be specified via this header when
        using Client Credentials authentication.
      schema:
        type: string
        pattern: user[A-Z\d]{26}
        example: user01HN2NJ9NMRZBXT1H6FT9N7735
    client_id:
      name: client_id
      in: query
      required: true
      schema:
        type: string
        example: sandbox-cc-id
        minLength: 1
      description: >-
        Your OAuth2 application client_id, issued when your ev.energy API
        integration was provisioned. This is the same value used when obtaining
        tokens via the Authorization Code or Client Credentials flows — not a
        user-created value. Passing an unrecognised string will result in an
        error. The onboarding endpoints redirect the user's browser through an
        OAuth flow to connect their device; the client_id determines which
        registered application is initiating the flow, so the correct branding,
        redirect URIs, and scopes are applied.
