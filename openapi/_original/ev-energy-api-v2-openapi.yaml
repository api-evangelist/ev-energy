          example: '2024-01-15T10:00:00Z'
          readOnly: true
        interval_seconds:
          type: integer
          description: The duration of this price interval in seconds.
          example: 1800
          readOnly: true
        price_minor_units:
          type: integer
          description: The price in minor currency units (e.g., pence for GBP).
          example: 10
          readOnly: true
