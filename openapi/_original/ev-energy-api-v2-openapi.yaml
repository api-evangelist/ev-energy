        - $ref: '#/components/parameters/version-2'
      description: Update a vehicle.
      security:
        - oauth2:
            - vehicle:write
      requestBody:
        description: Details of Vehicle to be updated.
        content:
          application/json:
            schema:
              type: object
              properties:
                battery_size_watt_hours:
                  type: integer
                  minimum: 1000
                  maximum: 300000
                  description: >-
                    Battery size in watt-hours. Editable only for unintegrated
                    vehicles; sending it for an integrated vehicle is rejected.
                    Setting it flags the battery size as user-provided. Stored
                    to the nearest 0.01 kWh (10 Wh), so the value read back may
                    be rounded.
                maximum_charge_limit_percentage:
                  type: integer
                  minimum: 50
                  maximum: 100
                  description: >-
                    The required target state of charge of the car as a
                    percentage between 50 and 100. The car will not be smart
                    charged above this value.  
                smart_charging_enabled:
                  type: boolean
                  description: >-
                    Whether smart (dynamic) charging is enabled for this
                    vehicle.
                vehicle_class:
                  type:
                    - string
                    - 'null'
                  enum:
                    - PASSENGER
