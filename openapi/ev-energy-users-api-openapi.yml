            example: 300
            description: The current carbon intensity associated with the location in gCO2/kWh.
      - $ref: '#/components/schemas/Location'
    UserNotificationPreferences:
      title: UserNotificationPreferences
      description: 'The user''s notification group opt-in state.


        On `GET`, every known group is returned with its current boolean state.

        On `PATCH`, only the keys you include are modified; omitted keys are

        left untouched. `PATCH {}` and `PATCH {"groups": {}}` are valid no-ops.

        Unknown group names produce a `400`.'
      type: object
      x-tags:
      - Users
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/notification_preferences
        groups:
          type: object
          description: 'Map of notification group name to opt-in state. Each group

            corresponds to a category of push/email notifications:


            - `charging_flow` — session lifecycle updates (plug-in, schedule, complete).

            - `charging_issues` — errors and failures during a charging session.

            - `charging_optimisation` — smart-charging schedule and savings updates.

            - `deals_and_offers` — marketing offers (subject to the user''s marketing consent).

            - `power_supply_notifications` — grid / power-supply events (feature-flagged).'
          additionalProperties: false
          properties:
            charging_flow:
              type: boolean
            charging_issues:
              type: boolean
            charging_optimisation:
              type: boolean
            deals_and_offers:
              type: boolean
            power_supply_notifications:
              type: boolean
          example:
            charging_flow: true
            charging_issues: true
            charging_optimisation: false
            deals_and_offers: false
            power_supply_notifications: false
    PriceSummary:
      title: PriceSummary
      description: A single price for a certain time range.
      type: object
      examples:
      - price: '0.10'
        times:
        - start: '18:00:00'
          end: 00:00:00
      x-tags:
      - Tariffs
      properties:
        price:
          type: string
          example: '0.10'
          description: The price is in major currency units e.g. 0.10 means £0.10.
        times:
