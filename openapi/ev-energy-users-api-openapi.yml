          items:
            $ref: '#/components/schemas/Times'
    RoutePlannerPreferences:
      title: RoutePlannerPreferences
      description: 'A user''s sticky EV Route Planner preferences, created with defaults on

        first access. `PATCH` treats the body as a partial map — only the keys

        you include are changed.'
      type: object
      x-tags:
      - Users
      required:
