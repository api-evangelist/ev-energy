    PayoutMethod:
      title: PayoutMethod
      description: "The user's preferred payout method. All three fields are nullable when\nno payout method has been set up. `receiver_type` and the format of\n`receiver` are determined by `receiver_wallet`:\n\n- `PAYPAL` → `receiver` is an email, `receiver_type` is `EMAIL`\n- `VENMO` → `receiver` is a phone number, `receiver_type` is `PHONE`\n- `BILL_CREDITS` → `receiver` is the user's billing account number\n  (may be empty), `receiver_type` is `ACCOUNT_NUMBER`\n"
      type: object
      x-tags:
      - Users
      required:
      - url
      - receiver
      - receiver_type
      - receiver_wallet
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/payout_method
        receiver:
          type:
          - string
          - 'null'
          description: 'The destination identifier for the payout (email for `PAYPAL`,

            phone for `VENMO`, billing account number for `BILL_CREDITS`).

            Null when no payout method has been set up.

            '
          example: alice@example.com
        receiver_type:
          type:
          - string
          - 'null'
          enum:
          - EMAIL
          - PHONE
          - ACCOUNT_NUMBER
          - null
          description: The semantic type of the `receiver` field. Server-derived.
          readOnly: true
        receiver_wallet:
          type:
          - string
          - 'null'
          enum:
          - PAYPAL
          - VENMO
          - BILL_CREDITS
          - null
          description: Which payout wallet the user has selected. Null when none is set.
