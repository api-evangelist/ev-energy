          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735/route_planner_preferences
        preferred_vehicle:
          type:
          - string
          - 'null'
          format: uri
          description: Link to the vehicle selected by default, or null if none is set.
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
        min_charger_power_watts:
          type:
          - integer
          - 'null'
          enum:
          - 22000
          - 50000
          - 100000
          - 150000
          - 250000
          - null
          description: 'Soft minimum charger power (watts) for en-route charger search. Null

            means all chargers.'
