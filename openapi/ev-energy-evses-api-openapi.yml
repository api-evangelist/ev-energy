          description: Text to be displayed on a button leading to the external_link location
        read_at:
          type: string
          format: date-time
          description: When the user examined the contents of this notification
        resolved_at:
          type: string
          format: date-time
          description: When the problem associated with this notification was resolved
    EVSECommandLog:
      title: EVSECommandLog
      description: Records a command that was sent to an EVSE.
      type: object
      x-tags:
      - EVSEs
      properties:
        url:
          type: string
          example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5/command_logs/2024-04-17T09:39:45.984584Z/
          format: uri
          readOnly: true
        logged_at:
          type: string
          description: The date and time when this command was logged by the ev.energy system.
          format: date-time
          readOnly: true
        evse:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/EVSE'
        max_load_target_milliamps:
          type:
          - integer
          - 'null'
          example: 32000
          description: The target maximum load sent to the EVSE, in milliamps.
          readOnly: true
        is_enabled_target:
          type:
          - boolean
          - 'null'
          example: true
          description: The target state sent for is_enabled (i.e. free-vend mode).
          readOnly: true
        always_enabled:
          type:
          - boolean
          - 'null'
          example: false
          description: Whether the EVSE should always be in is_enabled (i.e. free-vend) mode.
          readOnly: true
        reason:
          type:
          - string
          - 'null'
          example: SCHEDULED_CHARGING
          description: The reason the command was sent to the EVSE.
          readOnly: true
          enum:
          - SCHEDULED_CHARGING
          - REFRESH_SCHEDULES
          - STOP_CHARGE
          - START_CHARGE
          - SOLAR_CHARGE_NIGHTTIME_CHARGE_RATE
          - API_TRIGGERED_COMMAND
          - COMMISSIONING
          - CHARGING_SESSION
          - VEHICLE_TO_HOME
          - FREE_VEND
          - MAINTAIN_EVSE_STATE
          - CREATE_HOME_CHARGER
          - LOCKED_MODE
          - SMART_CHARGE_ENABLED_CHANGED
          - SMART_CHARGE_ENABLED
          - SMART_CHARGE_DISABLED
        internal_command_id:
          type:
          - string
          - 'null'
          format: uuid
          example: d4e5f6a7-b8c9-0123-def0-123456789abc
          description: Internal UUID to track this command dispatch. This links with device command logs.
          readOnly: true
    EVSE:
      title: EVSE
      description: A resource that represents a single, physical piece of hardware for supplying electricity to an electric vehicle.
      type: object
      x-tags:
      - EVSEs
      required:
      - id
      - url
      - cpid
      properties:
        id:
          type: string
          description: Unique identifier for the given EVSE.
          pattern: evse[A-Z\d]{26}
          example: evse01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          format: uri
          readOnly: true
        cpid:
          type: string
          description: A unique identifier for the chargepoint. The format varies by manufacturer and model.
          example: SHIR100001
          readOnly: true
        model:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/evse_models/emod01HS9A004X5TB5JCMHENB5Z446
          - $ref: '#/components/schemas/EVSEModel'
          readOnly: true
        user:
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          oneOf:
          - type: string
            example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
            format: uri
          - $ref: '#/components/schemas/User'
          readOnly: true
        latest_status_log:
          example: https://api.ev.energy/v2/evse/evse01HSH04KDEWF6Z4DB2J77J74K5/status_logs/2024-01-01T11:11:11.1111Z/
          oneOf:
          - type:
            - string
            - 'null'
            example: https://api.ev.energy/v2/evse/evse01HSH04KDEWF6Z4DB2J77J74K5/status_logs/2024-01-01T11:11:11.1111Z/
            format: uri
          - $ref: '#/components/schemas/EVSEStatusLog'
          description: 'An expandable reference to the most recent status log for this EVSE. This can be requested or expanded to get the most accurate information we have on the device''s current status.


            **Inferring reachability:** v2 deliberately does not expose a discrete `online`/`offline` state on the EVSE resource — the boundary is fuzzy and prone to misuse. To decide whether an EVSE is currently reachable, expand `latest_status_log` (or fetch it separately) and compare its `sampled_at` timestamp against your own staleness threshold (for example: a charger silent for more than 15 minutes is likely unreachable).'
          readOnly: true
        ct_clamp:
          oneOf:
          - type:
            - string
            - 'null'
            format: uri
            example: https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/CTClamp'
          description: An expandable reference to the CT clamp associated with this EVSE. Will be null if no CT clamp is installed.
          readOnly: true
        lock_mode:
          type:
          - string
          - 'null'
          enum:
          - UNLOCKED
          - SMART
          - LOCKED
          - null
          example: UNLOCKED
          description: Lock mode of the EVSE. ``UNLOCKED`` allows free charging, ``SMART`` only allows charging within smart-charging hours, ``LOCKED`` blocks all charging.
          readOnly: true
        location:
          type:
          - object
          - 'null'
          properties:
            latitude:
              type: number
              format: double
              example: 51.5074
            longitude:
              type: number
              format: double
              example: -0.1278
          required:
          - latitude
          - longitude
          example:
            latitude: 51.5074
            longitude: -0.1278
          description: 'The geographic location of the EVSE as a latitude/longitude point.


            **Why smart charging needs it:** the location tells ev.energy which electricity grid the charger sits on, which drives the core smart-charging decisions:


            - **Carbon optimisation** — selects the local carbon-intensity feed so charging is shifted to the lowest-carbon periods.

            - **Timezone** — resolves the charger''s timezone so time-of-day charging schedules and tariff windows are applied in local time.

            - **Programs and solar** — determines the eligible grid/demand-response programs and the relevant solar forecast.


            Without an accurate location the scheduler cannot reliably optimise charging for cost and carbon.


            **When it is set:** during commissioning, where the supplied postcode/address is geocoded to a latitude/longitude (or, for app-linked chargers, copied from the owner''s home location). It can be corrected later via `PATCH`. Null when the location has not yet been determined.'
        lifecycle_state:
          type:
          - string
          - 'null'
          enum:
          - CREATED_LINKED
          - INSTALLED
          - COMMISSIONED
          - DECOMMISSIONED
          - UNKNOWN
          - PROBABLY_INSTALLED
          - UNPAIRED
          - PENDING
          - ENROLLED
          - null
          example: COMMISSIONED
          description: The most recently recorded stage of the EVSE's onboarding lifecycle. Null when no stage has been recorded for it yet, which is normal for a charger that has only just been created.
          readOnly: true
        charging_sub_sessions:
          type: string
          format: uri
          example: https://api.ev.energy/charging_sub_sessions/?evse_id=evse01HSH04KDEWF6Z4DB2J77J74K5
          description: Provides a pre-constructed URL to list charging sub-sessions involving this EVSE.
    VPPModes:
      title: VPPModes
      type: object
      description: VPP (Virtual Power Plant) mode capabilities indicating which control modes are supported by the resource.
      required:
      - target_power
      - import_max_power
      - export_max_power
      - charge_mode
      properties:
        target_power:
          type: boolean
          description: Whether target power control mode is supported.
          readOnly: true
          example: true
        import_max_power:
          type: boolean
          description: Whether import maximum power control mode is supported.
          readOnly: true
          example: true
        export_max_power:
          type: boolean
          description: Whether export maximum power control mode is supported.
          readOnly: true
          example: false
        charge_mode:
          type: boolean
          description: Whether charge mode control is supported.
          readOnly: true
          example: true
      examples:
      - target_power: true
        import_max_power: true
        export_max_power: false
        charge_mode: true
    TariffBase:
      title: TariffBase
      type: object
      description: 'Core tariff properties shared by Tariff and expanded scheduler_tariff. Note: daily_prices and type are only available under contract. Please reach out to your account manager to find out more.'
      x-tags:
      - Tariffs
      required:
      - id
      - url
      - supplier
      - name
      - currency
      properties:
        id:
          type: string
          description: Unique identifier for the given user.
          pattern: tari[A-Z\d]{26}
          example: tari01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735
        supplier:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/suppliers/supl01HN2NJ9NMRZBXT1H6FT9N7735
          - $ref: '#/components/schemas/Supplier'
          description: The energy company that supplies this tariff.
        name:
          type: string
          example: Fangorn Biomass
        currency:
          type: string
          example: GBP
        highlighted:
          type: boolean
          description: A highlighted tariff is one that is often selected by users.
        type:
          enum:
          - FLAT_RATE
          - DUAL_RATE
          - THREE_RATE
          - DYNAMIC
          - EXTERNALLY_MANAGED
          - OTHER
        daily_prices:
          $ref: '#/components/schemas/DailyPrices'
          description: 'The times returned here are localised to the timezone the tariff is in.

            The timezone is returned in `timezone_name`.'
        timezone_name:
          type: string
          example: Europe/London
        price_chart_url:
          type:
          - string
          - 'null'
          description: The url of a website which can display a chart of prices for the tariff. This website is an external resource and is not affiliated with ev.energy.
          example: https://www.example.com/
        gsp_group:
          type:
          - string
          - 'null'
          description: The GB Grid Supply Point (DNO region) the tariff applies to. Suppliers publish region-specific rates, so the same named tariff can appear once per region with differing prices; this field distinguishes them. `null` for tariffs that are not region-specific.
          example: _C
        valid_from:
          type: string
          format: date
          description: The date from which this tariff became available to new customers.
          example: '2026-03-17'
        valid_until:
          type:
          - string
          - 'null'
          format: date
          description: The date after which this tariff is no longer available to new customers (it has been superseded). `null` if the tariff is still open to new sign-ups. Use the `valid` query parameter to filter the list to only currently-available tariffs.
          example: '2027-03-17'
    User:
