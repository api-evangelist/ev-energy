        sampled_at:
          type: string
          description: The date and time when this OCPP message was recorded.
          format: date-time
          readOnly: true
        evse:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/EVSE'
        direction:
          type: string
          description: Whether the message was sent to or received from the charger.
          readOnly: true
          example: Sent
          enum:
          - Sent
          - Received
        action:
          type: string
          description: The OCPP action label for this message.
          readOnly: true
          example: StatusNotification
          enum:
          - Authorize
          - BootNotification
          - CancelReservation
          - CertificateSigned
          - ChangeAvailability
          - ChangeConfiguration
          - ClearCache
          - ClearChargingProfile
          - DataTransfer
          - DeleteCertificate
          - DiagnosticsStatusNotification
          - ExtendedTriggerMessage
          - FirmwareStatusNotification
          - GetCompositeSchedule
          - GetConfiguration
          - GetDiagnostics
          - GetInstalledCertificateIds
          - GetLocalListVersion
          - GetLog
          - Heartbeat
          - InstallCertificate
          - LogStatusNotification
          - MeterValues
          - RemoteStartTransaction
          - RemoteStopTransaction
          - ReserveNow
          - Reset
          - SecurityEventNotification
          - SendLocalList
          - SetChargingProfile
          - SignCertificate
          - SignedFirmwareStatusNotification
          - SignedUpdateFirmware
          - StartTransaction
          - StatusNotification
          - StopTransaction
          - TriggerMessage
          - UnlockConnector
          - UpdateFirmware
        payload:
          type: object
          description: The OCPP message payload.
          readOnly: true
        message_id:
          type: string
          description: The unique message ID for this OCPP call. Can be a UUID, integer, or string.
          readOnly: true
          example: abc-123
        response:
          description: The response to this OCPP call, if one has been received.
          oneOf:
          - $ref: '#/components/schemas/EVSEOCPPCallResponse'
          - type: 'null'
    Times:
