  /evse_onboarding:
    parameters: []
    get:
      summary: Initiate EVSE onboarding
      tags:
      - EVSEs
      responses:
        '200':
          description: Returned only when `response_type=json` is supplied. Carries an absolute URL to the EVSE onboarding wrapper that the client opens in a WebView (mobile) or redirects the browser to (web). The wrapper view either redirects to the provider (when a model was supplied) or shows the make picker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EVSEOnboardingJsonResponse'
        '302':
          description: 'Have the user''s browser follow the redirect to be prompted to connect their EVSE to the ev.energy system.


            If a make or model were not provided, the user will first be redirected to a screen to select these.'
          headers:
            Location:
              schema:
                type: string
              description: The URL that the users browser will be redirected to in order to integrate their EVSE.
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
      operationId: get-evse_onboarding
      description: 'Initiate the onboarding process for a new EVSE in your user''s browser (or an embedded web view in an app).


        If neither `make_id` or `model_id` are passed as query parameters, the user will be shown a user interface to pick their EVSE make.


        ## Native clients (`response_type=json`)


        Native mobile clients that need to open the onboarding URL in a WebView (rather than follow a 302 redirect) can pass `response_type=json` to receive a JSON payload instead. In that case at least one of `make_id` or `model_id` is required (otherwise the endpoint responds with `400`).


        ## Final redirect


        After the user completes the web flow, the browser is redirected to the `redirect_uri` query parameter (when supplied and valid) or otherwise the `onboarding_redirect_url` configured on your application. The redirect URL will carry two query parameters identifying the onboarded EVSE:


        - `evse_uid` — the v2 UID of the onboarded EVSE (preferred). Use this to call `GET /v2/evses/{evse_uid}` for further details.

        - `evse_id` — the legacy integer primary key. Prefer `evse_uid`.


        Example: `https://your-redirect/?evse_id=123&evse_uid=evse01...`.'
      parameters:
      - $ref: '#/components/parameters/user_id_onboarding'
      - schema:
          type: string
          example: emak01HN2NJQRGDQP0GBE1F7R6PB3D
        in: query
        name: make_id
        description: Specify the make of EVSE to be onboarded.
      - schema:
          type: string
          example: emod01HN2NJHAJJAQD32QJ4QXTDSGW
        in: query
        name: model_id
        description: Specify the model of EVSE to be onboarded.
      - $ref: '#/components/parameters/client_id'
      - schema:
          type: string
          enum:
          - json
        in: query
        name: response_type
        description: When set to `json`, the endpoint returns a JSON payload (200) instead of a 302 redirect. Used by native mobile clients that prefer to open the onboarding URL in a WebView. Requires at least one of `make_id` or `model_id`.
      - schema:
          type: string
          format: uri
          example: https://drivers.ev.energy/acme
        in: query
        name: redirect_uri
        description: Optional URL to return the user to after onboarding completes. Its scheme and host must match one of the application's registered `redirect_uris` or its `onboarding_redirect_url`, otherwise the endpoint responds with `400`. When omitted, the application's static `onboarding_redirect_url` is used.
      security: []
  /evse_onboarding/import:
    post:
      summary: Import an EVSE by serial number
      tags:
      - EVSEs
      responses:
        '201':
          description: Returns the newly imported EVSE, linked to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EVSE'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestCreate'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          description: The provider's system has no EVSE matching the supplied serial number for the authenticated user's email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '422':
          description: The import could not be completed — either the EVSE is already registered in our database, the integration provider returned an error, or the provider is not supported for serial-number-based import.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: post-evse_onboarding-import
      description: 'Import an EVSE into the ev.energy system using its serial number and the authenticated user''s email. The backend calls the provider''s API to look up the device and link it; the response is the freshly created `EVSE` resource, shape-identical to `GET /evses/{evse_id}`.


        Supported providers (serial-number-based onboarding): `ChargePoint`, `EO`, `SyncEV`, `EnelX`, `Easee`, `Wallbox`, `Zaptec`. Other EVSE providers use the OAuth flow via `GET /evse_onboarding/` instead.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EVSEImportRequest'
      parameters:
      - $ref: '#/components/parameters/expand-on-evse'
      - $ref: '#/components/parameters/version-2'
      security:
      - oauth2:
        - evse:write
  /evse_waitlist:
    post:
      summary: Add user to the EVSE waitlist
      description: 'Captures a user who hit an `incompatible` result on the EVSE compatibility check, so we can notify them once their hardware becomes supported. Pre-account, anonymous endpoint — no OAuth token required.


        The request body must identify the device in exactly one of two modes:


        - **Picker mode** — supply `evse_model_id` (uid of an `EVSEModel`). `evse_make_name` and `evse_model_name` must be omitted / null.

        - **Manual entry** — supply both `evse_make_name` and `evse_model_name` as free-text strings. `evse_model_id` must be omitted / null.


        Any other combination — including all three null — returns `400`.


        Country is derived server-side: from `program.country` when `program_id` is supplied; otherwise from the `Accept-Language` header (defaulting to `US`).


        Error responses follow RFC 9457 Problem Details. Problem types emitted by this endpoint:


        - `validation-failed-evse-waitlist` — request body fails validation (missing required field, mode constraint violation, unknown `evse_model_id` / `program_id`).'
      tags:
      - EVSEs
      operationId: post-evse_waitlist
      parameters:
      - $ref: '#/components/parameters/version-2'
      - $ref: '#/components/parameters/Accept-Language'
      - name: client_id
        in: query
        required: false
        description: 'OAuth `Application.client_id`. Mirrors the pre-account onboarding and compatibility-check endpoints: when supplied and the application has sandbox mode enabled, the endpoint returns a canned `201` without persisting anything.'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EVSEWaitlistRequest'
      responses:
        '201':
          description: Waitlist entry created. Body echoes the new entry's uid.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EVSEWaitlistResponse'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '405':
          $ref: '#/components/responses/Problem405MethodNotAllowed'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      security: []
components:
  responses:
    Problem405MethodNotAllowed:
      description: Could not satisfy this HTTP method.
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - title
            - detail
            properties:
              status:
                type: number
                example: 405
              title:
                type: string
                example: Method Not Allowed
              detail:
                type: string
                example: Could not satisfy this HTTP method.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
