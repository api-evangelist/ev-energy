  schemas:
    Supplier:
      title: Supplier
      type: object
      description: An energy company who supplies electricity tariffs.
      required:
      - id
      - url
      - name
      - icon
      properties:
        id:
          type: string
          description: Unique identifier for the given user.
          pattern: supl[A-Z\d]{26}
          example: supl01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/suppliers/supl01HN2NJ9NMRZBXT1H6FT9N7735
        name:
          type: string
          example: Rivendell Renewables
        icon:
          type:
          - string
          - 'null'
          format: uri
          example: https://cdn.example.com/rivendell_renewables.jpg
        highlighted:
          type: boolean
          description: A highlighted supplier is one that is often selected by users.
      x-tags:
      - Tariffs
    EVSEAPIErrorLog:
      title: EVSEAPIErrorLog
      description: Records an error that occurred when attempting to communicate with an EVSE's hardware API.
      type: object
      x-tags:
      - EVSEs
      properties:
        url:
          type: string
          example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5/error_logs/2024-04-17T09:39:45.984584Z/
          format: uri
          readOnly: true
        sampled_at:
          type: string
          description: The date and time when this error was sampled by the ev.energy system.
          format: date-time
          readOnly: true
        evse:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/EVSE'
        status_code:
          type:
          - integer
          - 'null'
          example: 401
          description: The HTTP status code of the error response from the EVSE hardware API.
          readOnly: true
        controller:
          type: string
          example: OCPP
          description: The EVSE controller/integration that was being used when the error occurred.
          readOnly: true
        error_code:
          type:
          - string
          - 'null'
          example: AUTHENTICATION_ERROR
          description: The error code received from the provider or determined by the ev.energy system.
          readOnly: true
        error_type:
          type:
          - string
          - 'null'
          example: HardwareAPIUnauthorized
          description: The error type received from the provider or determined by the ev.energy system.
          readOnly: true
        error_detail:
          type:
          - string
          - 'null'
          description: Detailed information about the error.
          readOnly: true
        external_request_id:
          type:
          - string
          - 'null'
          example: req-12345
          description: The external request ID that resulted in this error. Used for tracing and debugging.
          readOnly: true
        internal_command_id:
          type:
          - string
          - 'null'
          format: uuid
          example: d4e5f6a7-b8c9-0123-def0-123456789abc
          description: Internal UUID to track the command dispatch. This can be used to correlate errors with commands.
          readOnly: true
    EVSEFirmwareVersion:
      title: EVSEFirmwareVersion
      type: object
      description: A specific firmware release available for one or more EVSE models.
      required:
      - id
      - url
      - version
      - public_version
      - change_log
      - support_url
      properties:
        id:
          type: string
          pattern: evsf[A-Z\d]{26}
          example: evsf01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse_firmware_versions/evsf01HSH04KDEWF6Z4DB2J77J74K5/
          readOnly: true
        version:
          type: string
          description: The internal firmware version identifier.
          example: 1.2.3
          readOnly: true
        public_version:
          type:
          - string
          - 'null'
          description: The publicly displayed version label, if different from the internal version.
          example: '1.2'
          readOnly: true
        change_log:
          type:
          - string
          - 'null'
          description: A summary of the changes in this firmware release.
          example: Bug fixes and stability improvements
          readOnly: true
        support_url:
          type:
          - string
          - 'null'
          format: uri
          description: A link to documentation describing this firmware version.
          example: https://example.com/firmware/1.2
          readOnly: true
    EVSEConnectivity:
      title: EVSEConnectivity
      type: object
      description: Connectivity snapshot for an EVSE including signal strength, SIM data, firmware version, and connection reliability.
      required:
      - signal_strength_rssi_dbm
      - lowest_signal_strength_rssi_dbm_7d
      - highest_signal_strength_rssi_dbm_7d
      - connection_reliability_30d
      - ip_address
      - iccid
      - firmware_version
      - latest_status_log
      properties:
        signal_strength_rssi_dbm:
          type:
          - integer
          - 'null'
          description: Last known signal strength in RSSI dBm. Null for WiFi EVSEs.
          readOnly: true
          example: -65
        lowest_signal_strength_rssi_dbm_7d:
          type:
          - integer
          - 'null'
          description: Lowest signal strength in RSSI dBm over the past 7 days. Null for WiFi EVSEs.
          readOnly: true
          example: -89
        highest_signal_strength_rssi_dbm_7d:
          type:
          - integer
          - 'null'
          description: Highest signal strength in RSSI dBm over the past 7 days. Null for WiFi EVSEs.
          readOnly: true
          example: -57
        connection_reliability_30d:
          type: integer
          description: Connection reliability over the past 30 days, from 0 (fully offline) to 100 (fully online).
          readOnly: true
          example: 97
        ip_address:
          type:
          - string
          - 'null'
          description: The IP address assigned to the EVSE's SIM. Null if no SIM data is available.
          readOnly: true
          example: 10.193.28.42
        iccid:
          type:
          - string
          - 'null'
          description: The ICCID of the EVSE's SIM card. Null if no SIM data is available.
          readOnly: true
          example: '8944110000001234567'
        firmware_version:
          type:
          - string
          - 'null'
          description: The current firmware version running on the EVSE. Null if not known.
          readOnly: true
          example: 1.2.3
        latest_status_log:
          oneOf:
          - type:
            - string
            - 'null'
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5/status_logs/2024-04-17T09:39:45.984584Z/
            format: uri
          - $ref: '#/components/schemas/EVSEStatusLog'
          description: An expandable reference to the most recent status log for this EVSE. URL by default, full object when ?expand=latest_status_log is used.
          readOnly: true
    CTClamp:
      title: CTClamp
      description: A CT (Current Transformer) clamp used to measure grid current, typically for solar charging logic.
      type: object
      x-tags:
      - CT Clamps
      properties:
        id:
          type: string
          description: Unique identifier for the given CT clamp.
          pattern: ctcl[A-Z\d]{26}
          example: ctcl01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        evse:
          oneOf:
          - type:
            - string
            - 'null'
            format: uri
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/EVSE'
          description: The EVSE associated with this CT clamp. Will be null if not linked to an EVSE.
          readOnly: true
        calibration_factor:
          type: integer
          description: Calibration multiplier for current readings. A value of -1 indicates the clamp was fitted the wrong way around.
          example: 1
          readOnly: true
    EVSEOCPPLog:
      title: EVSEOCPPLog
      description: Records an OCPP message sent to or received from an EVSE.
      type: object
      x-tags:
      - EVSEs
      properties:
        url:
          type: string
          example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5/ocpp_logs/2024-04-17T09:39:45.984584Z/
          format: uri
