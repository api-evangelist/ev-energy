          type: string
          description: The integration provider that owns the EVSE. Must be one of the providers that supports serial-number-based import.
          enum:
          - ChargePoint
          - EO
          - SyncEV
          - EnelX
          - Easee
          - Wallbox
          - Zaptec
          example: Wallbox
        serial_number:
          type: string
          description: The serial number (CPID) of the EVSE as printed on the device or shown in the provider's app.
          example: WBX-12345678
    EVSECompatibilityCheckResult:
      title: EVSECompatibilityCheckResult
      description: 'Compatibility verdict for an `(EVSEModel, country)` pair. Returned

        by `GET /evse_compatibility/check`.'
      type: object
      required:
      - compatible
      - beta
      - recommendation_rank
      properties:
        compatible:
          type: boolean
          description: True if the model is supported in the requested country.
        beta:
          type: boolean
          description: 'True if support is currently in early-access / beta. Always

            present in the response; `false` when `compatible` is `false`.'
        recommendation_rank:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10
          description: 'Priority of the EVSE make on the new device-selection screen.

            Lower = higher priority (1 = top, 10 = lowest explicit value);

            `null` means no rank set and should be treated as lower priority

            than any explicit value. Always reflects the make''s current

            value, independent of `compatible`.'
