            example: https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/assessment
            readOnly: true
          - $ref: '#/components/schemas/ChargingSubSessionAssessment'
          description: A link to the performance assessment for this charging sub-session. Can be expanded. Requires debug:read scope.
          readOnly: true
        flags:
          oneOf:
