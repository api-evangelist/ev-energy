    ChargingSubSession:
      title: SubSession
      type: object
      description: Represents a period within a charging session (one plug-in episode) when the same charging mode was active. Begins either when a vehicle is plugged in or when it switches mode (eg. from smart to boost) and ends either when the vehicle is unplugged or the mode switches again. Note that start/end bound the period the mode was active — not when energy was actually flowing. Energy may be delivered during only part of the sub-session, or in several separate bursts (see the energy_usage endpoint). See [Understanding charging data](docs/understanding/charging_sessions.md).
      x-tags:
      - Charging sessions
      required:
      - id
      - url
      - start
      - end
      - mode
      - energy_delivered_watt_hours
      - location
      - cost
      - currency
      - total_co2_grams
      - co2_intensity_grams_per_kilowatt_hour
      - co2_intensity_classification
      - duration_minutes
      - grid_energy_delivered_watt_hours
      - solar_energy_delivered_watt_hours
      properties:
        id:
          type: string
          description: Unique identifier for the given Charging sub-session.
          pattern: csub[A-Z\d]{26}
          example: csub01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
        start:
          type: string
          format: date-time
          description: When this sub-session began — either when the vehicle was plugged in, or when the charging mode changed (e.g. the user activated boost). Not necessarily when energy started flowing; see the energy_usage endpoint for actual delivery intervals.
          readOnly: true
        end:
          type:
          - string
          - 'null'
          format: date-time
          description: When this sub-session ended — either when the vehicle was unplugged, or when the charging mode changed again. Null while the sub-session is ongoing. Energy delivery often finishes well before this time (e.g. once the target charge level is reached).
          readOnly: true
        mode:
          enum:
          - SMART
          - BOOST
          - UNMANAGED_HOME
          - UNMANAGED_OTG
          - MANAGED_OTG
          description: 'The type of scheduling applied during this period.


            SMART: Actively optimised charging


            BOOST: Charge immediately


            UNMANAGED_HOME: No optimisation, at a home location


            UNMANAGED_OTG: No optimisation, at an on-the-go (public) location


            MANAGED_OTG: Optimised charging at an on-the-go (public) location'
          readOnly: true
        vehicle:
          oneOf:
          - type:
            - string
            - 'null'
            example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
            format: uri
          - $ref: '#/components/schemas/Vehicle'
        evse:
          oneOf:
          - type:
            - string
            - 'null'
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
            format: uri
          - $ref: '#/components/schemas/EVSE'
        energy_delivered_watt_hours:
          type: integer
          example: 2300
          description: Net energy delivered to the vehicle during this sub-session in Wh.
          readOnly: true
        cost:
          type:
          - integer
          - 'null'
          example: 634
          readOnly: true
        location:
          type: object
          properties:
            name:
              type: string
              example: Home
              readOnly: true
            coordinates:
              type: object
              $ref: '#/components/schemas/LatLong'
              description: Can be null
            postal_code:
              type:
              - string
              - 'null'
              maxLength: 10
            address_1:
              type:
              - string
              - 'null'
            timezone:
              type:
              - string
              - 'null'
              example: Europe/London
              description: IANA timezone name for the charging location.
        percentage_added:
