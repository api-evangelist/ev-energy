            - https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
            description: Links to sub-sessions by default.
          - type: array
            items:
              $ref: '#/components/schemas/ChargingSubSession'
            description: Expanded sub-sessions when ?expand=sub_sessions is used, ordered newest first.
          description: Links by default, expanded data when ?expand=sub_sessions is used. Ordered newest first.
    DailyPrices:
      title: DailyPrices
