          - type: 'null'
          description: The reason the session was started. New values may be added over time.
          readOnly: true
        finish_reason:
          oneOf:
          - type: string
            enum:
            - BOOST_START
            - SMART_CHARGE_ENABLED
            - SMART_CHARGE_DISABLED
            - SOLAR_SETTINGS
            - ADMIN_ACTION
            - FAKE_CURRENT_CHARGING_CMD
            - REPROCESS_VEHICLEDATALOGS_CMD
            - SFTP_IMPORTER
            - INVALIDATE_ACCOUNT
            - REMOVE_INTEGRATION
            - EVSE_UNPAIR
            - EVSE_DISCONNECT
          - type: 'null'
          description: The reason the session finished. New values may be added over time.
          readOnly: true
        is_energy_delivered_capped:
          type: boolean
          description: Indicates whether delivered energy was capped to prevent unrealistic over-delivery beyond the vehicle's battery capacity.
          readOnly: true
        uncapped_energy_delivered_watt_hours:
          oneOf:
          - type: integer
          - type: 'null'
          description: The recalculated energy in watt-hours that would have been delivered without capping. Null when energy delivery was not capped or when recalculation cannot be completed.
          readOnly: true
        energy_usage_calculation_method:
          type: string
          enum:
          - ESTIMATED_CHARGE_ENERGY_ADDED
          - ESTIMATED_CHARGE_LEVEL
          - ESTIMATED_CHARGE_RATE
          - METERED
          - METERED_CHARGE_RATE
          - BETA_ESTIMATED_CHARGE_ENERGY_ADDED
          - ESTIMATED_CHARGE_LEVEL_WITH_INFERENCE
          - MANUAL_ENTRY
          description: The method used to calculate energy usage for this session.
          readOnly: true
        energy_usage_interpolation_method:
          type: string
          enum:
          - LINEAR
          - LINEAR_WITH_CHARGE_STEP
          description: The method used to interpolate data readings when calculating energy usage.
          readOnly: true
        solar_integration_type:
          oneOf:
          - type: string
            enum:
            - UNAVAILABLE
            - HARDWARE
            - SOFTWARE
            - SOFTWARE_BETA
            - HARDWARE_PASSTHROUGH
          - type: 'null'
          description: The solar integration type of the EVSE paired with this session. Null when no EVSE is associated with the session.
          readOnly: true
      required:
      - url
      - charging_sub_session
      - start_reason
      - finish_reason
      - is_energy_delivered_capped
      - uncapped_energy_delivered_watt_hours
      - energy_usage_calculation_method
      - energy_usage_interpolation_method
      - solar_integration_type
    SchedulePlans:
      title: SchedulePlans
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/schedule_plans
          readOnly: true
        charging_sub_session:
          oneOf:
