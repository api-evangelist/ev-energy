    ScheduleInterval:
      title: ScheduleInterval
      description: A schedule interval represents a charging instruction for a specific time period within a charging session. It specifies the charging current (in milliamps) that should be applied during that period.
      type: object
      x-tags:
      - Schedules
      properties:
        started_at:
          type: string
          format: date-time
          example: '2024-01-01T02:00:00Z'
          description: The start time of the period this schedule applies to. Always aligned to half-hour boundaries (:00 or :30).
          readOnly: true
        interval_seconds:
          type:
          - integer
          - 'null'
          example: 1800
          description: The duration of this schedule in seconds. Currently always 1800 seconds (30 minutes), or null for boost sessions which have no defined end time.
          readOnly: true
        current_milliamps:
          type: integer
          example: 7400
          description: The charging current in milliamps that should be applied during this period. A value of 0 means no charging.
          readOnly: true
        schedule_type:
          type: string
          example: SMART
          enum:
          - INITIAL_CHARGE_TIME
          - BATTERY_WARMING
          - SMART
          - BOOST
          - SOLAR_ONLY
          - SOLAR_SMART
          - V2G_DISCHARGE
          - V2G_CHARGEBACK
          - LEGACY
          description: 'The type of scheduling that generated this instruction.


            - INITIAL_CHARGE_TIME: Initial charge to condition the battery

            - BATTERY_WARMING: Pre-warming the hour before the ready-by-time

            - SMART: Optimised smart charging

            - BOOST: Immediate charging at maximum rate

            - SOLAR_ONLY: Charging only from solar generation

            - SOLAR_SMART: Combined solar and smart charging

            - V2G_DISCHARGE: Vehicle-to-grid discharge

            - V2G_CHARGEBACK: Charging back after V2G discharge

