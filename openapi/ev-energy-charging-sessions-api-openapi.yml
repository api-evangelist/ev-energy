          readOnly: true
        meter_reading_watt_hours:
          type:
          - integer
          - 'null'
          description: The meter reading in watt hours. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        is_enabled:
          type:
          - boolean
          - 'null'
          description: Whether the EVSE is enabled (free-vend mode). Will be null if we are unable to get this information from the EVSE integration.
