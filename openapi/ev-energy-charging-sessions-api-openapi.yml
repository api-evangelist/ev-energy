            example: https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5/debug_metadata
            readOnly: true
          - $ref: '#/components/schemas/ChargingSubSessionDebugMetadata'
          description: A link to debug metadata for this charging sub-session. Can be expanded. Requires debug:read scope.
          readOnly: true
        tariff:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735
          - $ref: '#/components/schemas/Tariff'
          - type: 'null'
          description: The electricity import tariff. Expandable with ?expand=tariff. Requires tariff:read scope.
          readOnly: true
        carbon_feed:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/carbon_feeds/cabf01HN2NJ9NMRZBXT1H6FT9N7735
          - $ref: '#/components/schemas/CarbonFeed'
          - type: 'null'
          description: The carbon feed used to calculate carbon intensity for this sub-session. Expandable with ?expand=carbon_feed. Requires carbon:read scope.
          readOnly: true
        grid_feeds:
          oneOf:
          - type: array
            items:
              type: string
              format: uri
              example: https://api.ev.energy/v2/grid_feeds/grfd01HN2NJ9NMRZBXT1H6FT9N7735
          - type: array
            items:
              $ref: '#/components/schemas/GridFeed'
          description: Grid feeds applied to this sub-session. Expandable with ?expand=grid_feeds. Requires grid:read scope.
          readOnly: true
        solar_mode_type:
          type:
          - string
          - 'null'
          enum:
          - 'OFF'
          - SOLAR_ONLY
          - SOLAR_AND_GRID
          - SOLAR_SMART
          - null
          description: The solar charging mode active for this sub-session. Null when solar charging is not configured.
          readOnly: true
        grid_energy_delivered:
          type: string
          format: decimal
          deprecated: true
          description: Use `grid_energy_delivered_watt_hours` instead
          readOnly: true
        solar_energy_delivered:
          type: string
          format: decimal
          deprecated: true
          description: Use `solar_energy_delivered_watt_hours` instead.
          readOnly: true
    SchedulePlan:
      title: SchedulePlan
      type: object
      description: A schedule plan containing the parameters used to generate charging schedules.
      properties:
        id:
          type: string
          pattern: scpl[A-Z\d]{26}
          example: scpl01HSH04KDEWF6Z4DB2J77J74K5
          description: Unique identifier for this schedule plan.
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T02:00:00Z'
          description: When this schedule plan was created.
          readOnly: true
        ready_by_time:
          type: string
          format: date-time
          example: '2024-01-01T08:00:00Z'
          description: The target time by which charging should be complete.
          readOnly: true
        price_threshold_minor_unit:
          type:
          - integer
          - 'null'
          example: 1500
          description: Price threshold in minor currency units (e.g., cents/pence) multiplied by 100. For example, 1500 represents 15 pence (£0.15), and 50 represents 0.5 pence (£0.005). Null if no threshold set.
          readOnly: true
        power_on_current_milliamps:
          type: integer
          example: 32000
          description: The charging current in milliamps when power is on.
          readOnly: true
        power_off_current_milliamps:
          type: integer
          example: 0
          description: The current in milliamps when power is off (typically 0).
          readOnly: true
        seconds_to_charge:
          type: integer
          example: 10800
          description: The number of seconds required to complete charging.
          readOnly: true
        vehicle_charge_level_watt_hours:
          type:
          - integer
          - 'null'
          example: 25000
          description: The vehicle's battery level in watt-hours at the time the plan was created. Null if unknown.
          readOnly: true
        estimated_charge_rate_watts:
          type: integer
          example: 7400
          description: The estimated charging rate in watts.
          readOnly: true
        estimated_charge_rate_source:
          type:
          - string
          - 'null'
          enum:
          - CURRENT_SESSION_EVSE_DATA_LOGS
          - CURRENT_SESSION_VEHICLE_DATA_LOGS
          - ENERGY_TRANSFER_PERIODS
          - DEFAULT_CHARGE_RATE
          - MAX_EVSE_CHARGE_RATE
          - MAX_VEHICLE_CHARGE_RATE
          - null
          description: The source of data used for estimating charge rate. Null if not specified.
          readOnly: true
        watt_hours_to_charge:
          type: integer
          example: 22000
          description: The total energy required to complete charging in watt-hours.
          readOnly: true
        min_charge_limit_percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 0
          description: The minimum charge limit as a percentage (0-100).
          readOnly: true
        max_charge_limit_percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 80
          description: The maximum charge limit as a percentage (0-100).
          readOnly: true
        price_data:
          oneOf:
          - type: 'null'
          - type: array
            items:
              $ref: '#/components/schemas/Price'
          description: Tariff rate intervals active when this schedule plan was created. Null by default; expand with ?expand=price_data to populate. Returns null if no tariff is associated with the session.
          readOnly: true
    Vehicle:
      title: Vehicle
      description: A resource representing a single, physical electric vehicle.
      type: object
      x-tags:
      - Vehicles
      required:
      - id
      - url
      - integrated
      - battery_size_watt_hours
      - effective_battery_size_watt_hours
      - maximum_charge_limit_percentage
      - description
      - disabled
      - smart_charging_enabled
      - vehicle_class
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle.
          pattern: vhcl[A-Z\d]{26}
          example: vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          readOnly: true
        trim:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/trim/vehicle_trim01HRFHBCM7VBSWRPVYFBQMH2BR
          - $ref: '#/components/schemas/VehicleTrim'
          description: Defaults to a url, but can be expanded to the full Trim resource via the `expand` query parameter.
          readOnly: true
        user:
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/user/user01HN2NJ9NMRZBXT1H6FT9N7735
          - $ref: '#/components/schemas/User'
          description: Defaults to a url, but can be expanded to the full User resource via the `expand` query parameter.
        latest_status_log:
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-04-17T09:39:45.994584Z/
          oneOf:
          - type:
            - string
            - 'null'
            example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-04-17T09:39:45.994584Z/
            format: uri
          - $ref: '#/components/schemas/VehicleStatusLog'
          description: An expandable reference to the most recent status log for this Vehicle. This can be requested or expanded to get the most accurate information we have on the device's current status.
        charging_sub_sessions:
          type: string
          format: uri
          example: https://api.ev.energy/charging_sub_sessions/?vehicle_id=vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          description: Provides a pre-constructed URL to list charging sub-sessions involving this Vehicle.
        integrated:
          enum:
          - UNINTEGRATED
          - ACTIVE
          - INACTIVE
          description: 'Whether we have an integration with this vehicle.

            - `UNINTEGRATED`: This vehicle is not integrated

            - `ACTIVE`: This vehicle is integrated and the connection is working.

            - `INACTIVE`: This vehicle has been integrated but the connection has been severed, usually because the user needs to reconnect it.'
          readOnly: true
        battery_size_watt_hours:
          type: integer
          minimum: 1000
          maximum: 300000
          description: The nominal battery capacity of the vehicle in watt-hours according to the vehicle integration or trim. Editable via PATCH only for unintegrated vehicles; sending it for an integrated vehicle is rejected. Setting it flags the battery size as user-provided. Stored to the nearest 0.01 kWh (10 Wh), so the value read back may be rounded.
          example: 60000
        effective_battery_size_watt_hours:
          type: integer
          description: The effective battery capacity of the vehicle in watt-hours, accounting for estimated degradation based on odometer reading. This is the value used by the smart charging scheduler.
          readOnly: true
          example: 60000
        maximum_charge_limit_percentage:
          type: integer
          minimum: 50
          maximum: 100
          description: The target state of charge of the car as a percentage between 50 and 100. The car will not be smart charged above this value. Can be null if target charge level has not been set or we don't know the car's battery size.
          default: 100
        description:
          type: string
          maxLength: 200
          description: Human-readable label for the vehicle.
          example: My Volvo C40
          readOnly: true
        disabled:
          type: boolean
          description: 'Whether the vehicle has been disabled and can no longer be smart-charged or controlled. Set when the user unenrolls the vehicle, when an integrated vehicle is switched to unintegrated (''dumb''), or when the owning account is pending deletion. Disabled vehicles that have not been permanently deleted are still returned by this endpoint. This is independent of integrated: a disabled vehicle can still report integrated=ACTIVE (e.g. pending deletion), and a healthy never-integrated vehicle is not disabled.'
          example: false
          readOnly: true
        smart_charging_enabled:
          type: boolean
          description: Whether smart (dynamic) charging is enabled for this vehicle.
          example: true
        vehicle_class:
          type:
          - string
          - 'null'
          enum:
          - PASSENGER
          - COMMERCIAL
          - null
          description: Class of vehicle, passenger or commercial.
          example: PASSENGER
    ChargingSubSessionEndedWebhook:
      title: Charging Sub Session Ended Webhook
      description: Webhook payload delivered when a charging sub-session ends.
      type: object
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          type: string
          enum:
          - charging_sub_session.ended
          description: The event type. Also delivered in the `svix-event-type` header.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp for when the event occurred.
        data:
          description: The ended charging sub-session, in the same format returned by `GET /v2/charging_sub_sessions/{id}`.
          allOf:
          - $ref: '#/components/schemas/ChargingSubSession'
      examples:
      - type: charging_sub_session.ended
        timestamp: '2022-11-03T20:26:10.344522Z'
        data:
          id: csub01HSH04KDEWF6Z4DB2J77J74K5
          url: https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
          start: '2019-08-24T14:15:22Z'
          end: '2019-08-24T15:15:22Z'
          mode: SMART
          energy_delivered_watt_hours: 2300
          location:
            name: Home
          cost: 634
          currency: GBP
          total_co2_grams: 229
          co2_intensity_grams_per_kilowatt_hour: 1
          co2_intensity_classification: low
          duration_minutes: 60
          grid_energy_delivered_watt_hours: 1840
          solar_energy_delivered_watt_hours: 460
    ChargingSessionFlag:
      title: ChargingSessionFlag
      type: object
      properties:
        name:
          type: string
          description: Name describing the type of issue flagged. New values may be added over time.
          example: ENERGY_OVER_DELIVERY
        root_cause:
          type: string
          description: Category describing the root cause of the issue. New values may be added over time.
          example: CHARGE_MEASUREMENT_OSCILLATION
      required:
      - name
      - root_cause
    ChargingSubSessionAssessmentMetrics:
      title: ChargingSubSessionAssessmentMetrics
      type: object
      description: Performance quality metrics for a charging session assessment. All fields are nullable.
      properties:
        vehicle_data_uptime:
          type:
          - integer
          - 'null'
          description: Vehicle data uptime as a percentage (0-100).
          example: 95
        vehicle_location_uptime:
          type:
          - integer
          - 'null'
          description: Vehicle location uptime as a percentage (0-100).
          example: 90
        vehicle_error_rate:
          type:
          - integer
          - 'null'
          description: Vehicle error rate as a percentage (0-100).
          example: 2
        vehicle_command_adherence:
          type:
          - integer
          - 'null'
          description: Vehicle command adherence as a percentage (0-100).
          example: 88
        evse_data_uptime:
          type:
          - integer
          - 'null'
          description: EVSE data uptime as a percentage (0-100).
          example: 98
        evse_command_adherence:
          type:
          - integer
          - 'null'
          description: EVSE command adherence as a percentage (0-100).
          example: 92
        schedule_quality:
          type:
          - integer
          - 'null'
          description: Time that schedule requested charging but no charge occurred as a percentage (0-100).
          example: 85
        charge_outside_of_schedule:
          type:
          - integer
          - 'null'
          description: Energy usage outside of schedule as a percentage (0-100).
          example: 5
        session_duration:
          type:
          - integer
          - 'null'
          description: Session duration.
          example: 28800
        energy_delivered_vs_required:
          type:
          - integer
          - 'null'
          description: Energy delivered vs required as a percentage (0-100).
          example: 95
        savings_attainment_rate:
          type:
          - integer
          - 'null'
          description: Savings achieved compared to theoretical maximum as a percentage (0-100).
          example: 78
        session_savings_range:
          type:
          - integer
          - 'null'
          description: Difference between maximum and minimum theoretical session costs (units of currency).
          example: 30
        charge_energy_added_meter_reset:
          type:
          - boolean
          - 'null'
          description: Whether a charge energy added meter reset was detected.
          example: false
        charge_energy_added_oscillation_count:
          type:
          - integer
          - 'null'
          description: Number of charge energy added oscillations.
          example: 0
        charge_level_oscillation_count:
          type:
          - integer
          - 'null'
          description: Number of charge level oscillations.
          example: 1
        charge_location_data_at_session_start_minutes:
          type:
          - integer
          - 'null'
          description: Age of charge location data at session start, in minutes.
          example: 5
        last_location_update_implied_velocity_kmh:
          type:
          - integer
          - 'null'
          description: Implied velocity from last location update, in km/h.
          example: 0
        distance_from_home_meters:
          type:
          - integer
          - 'null'
          description: Distance from home in meters.
          example: 15
        missing_location:
          type:
          - boolean
          - 'null'
          description: Whether location data is missing.
          example: false
        vehicle_median_data_gap_duration_minutes:
          type:
          - integer
          - 'null'
          description: Median vehicle data gap duration in minutes.
          example: 3
        vehicle_max_data_gap_duration_minutes:
          type:
          - integer
          - 'null'
          description: Maximum vehicle data gap duration in minutes.
          example: 12
        vehicle_data_frequency_below_threshold:
          type:
          - integer
