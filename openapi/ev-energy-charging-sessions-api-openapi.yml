          readOnly: true
        charging_sub_session:
          type: string
          format: uri
          example: https://api.ev.energy/v2/charging_sub_sessions/csub01HSH04KDEWF6Z4DB2J77J74K5
          readOnly: true
        intervals:
          type: array
