        evse_max_data_gap_duration_minutes:
          type:
          - integer
          - 'null'
          description: Maximum EVSE data gap duration in minutes.
          example: 8
        evse_data_frequency_below_threshold:
          type:
          - integer
          - 'null'
          description: EVSE data frequency below threshold as a percentage (0-100).
          example: 5
        charge_rate_max_mad_score:
          type:
          - integer
          - 'null'
          description: Maximum MAD score for charge rate.
          example: 3
        charge_rate_max_median_ratio:
          type:
          - integer
          - 'null'
          description: Charge rate max to median ratio as a percentage (0-100).
          example: 140
