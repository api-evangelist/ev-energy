    SupportTicket:
      title: Support Ticket
      type: object
      description: A resource that represents a support ticket from a customer support system.
      x-tags:
      - Support Tickets
      required:
      - id
      - url
      - external_ticket_id
      - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the given support ticket.
          pattern: tick[A-Z\d]{26}
          example: tick01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/support_tickets/tick01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        user:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          - $ref: '#/components/schemas/User'
          - type: 'null'
          description: 'Reference to the user who created the ticket. Can be null for tickets created through channels where a user account may not exist (e.g., pre-signup inquiries, web forms).


            Access control:

            - Tickets with a user are accessible based on user/organization permissions

            - Tickets without a user (null) are only accessible to applications with access_all_areas permission'
          readOnly: true
        external_ticket_id:
          type: string
          description: External ticket ID from Freshdesk or other support system.
          example: '12345'
          readOnly: true
        subject:
          type:
          - string
          - 'null'
          description: The subject or title of the ticket.
          example: Unable to connect my vehicle
          readOnly: true
        status:
          type:
          - string
          - 'null'
          description: Status name (e.g., Open, Resolved, Closed).
          example: Open
          readOnly: true
        priority:
          type:
          - string
          - 'null'
          description: Priority name (e.g., Low, Medium, High, Urgent).
          example: Medium
          readOnly: true
        source:
          type:
          - string
          - 'null'
          description: Source name (e.g., Email, Phone, Feedback Widget).
          example: Email
          readOnly: true
        human_verified_category:
          oneOf:
          - $ref: '#/components/schemas/SupportTicketCategoryEnum'
          - type: 'null'
          description: Human verified category for the ticket.
          example: VEHICLE
        human_verified_subcategory:
          oneOf:
          - $ref: '#/components/schemas/SupportTicketSubcategoryEnum'
          - type: 'null'
          description: Human verified subcategory for the ticket.
          example: TELEMATICS_ISSUE
        ai_generated_category:
          oneOf:
          - $ref: '#/components/schemas/SupportTicketCategoryEnum'
          - type: 'null'
          description: AI generated category for the ticket.
          example: VEHICLE
        ai_generated_subcategory:
          oneOf:
          - $ref: '#/components/schemas/SupportTicketSubcategoryEnum'
          - type: 'null'
          description: AI generated subcategory for the ticket.
          example: TELEMATICS_ISSUE
        type_deprecated:
          type:
          - string
          - 'null'
          description: Legacy ticket type (phased out for category/subcategory system).
          example: Vehicle API error
          readOnly: true
        tags:
          type: array
          description: List of tags (e.g., ['ai-categorised', 'escalated']).
          items:
            type: string
          example:
          - ai-categorised
          readOnly: true
        messages:
          oneOf:
          - type: array
            items:
              type: string
              format: uri
              example: https://api.ev.energy/v2/support_tickets/tick01HN2NJ9NMRZBXT1H6FT9N7735/messages/tmsgA1B2C3D4E5F6G7H8I9J0K1L2M3
          - type: array
            items:
              $ref: '#/components/schemas/SupportTicketMessage'
          description: Array of message URLs by default. When expanded with ?expand=messages, returns full message objects.
          readOnly: true
        conversation_summary:
          type:
          - string
          - 'null'
          description: An AI generated summary of the conversation.
          example: Customer experiencing issues with Tesla vehicle connection to mobile app.
          readOnly: true
        custom_fields:
          type: object
          description: Additional custom fields from support system (e.g., car_manufacturer, mobile_app, legal_country, membership_level).
          additionalProperties: true
          example:
            car_manufacturer: Tesla
            mobile_app: iOS
          readOnly: true
        attributes:
          type: object
          description: Additional information about the user and their hardware.
          additionalProperties: true
          example:
            evse_model: ChargePoint Home Flex
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When the ticket was created in the support system.
          example: '2019-08-24T14:15:22Z'
          readOnly: true
        ticket_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the ticket was last updated in the support system.
          example: '2019-08-24T15:30:00Z'
          readOnly: true
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the ticket was resolved in the support system.
          example: '2019-08-25T10:00:00Z'
          readOnly: true
    SupportTicketMessageTypeEnum:
      title: Support Ticket Message Type
      type: string
      description: The type of message in a support ticket conversation.
      enum:
      - INITIAL_REQUEST
      - CUSTOMER_RESPONSE
      - HUMAN_AGENT_RESPONSE
      - AI_AGENT_RESPONSE
  examples:
    ProblemInvalidPaginationParameter:
      value:
        type: https://api.ev.energy/v2/problems/pagination-parameters/
        status: 400
        title: Invalid pagination parameter
        detail: 'Invalid value for pagination parameter: page_size'
    ProblemUnsupportedVersion:
      value:
        type: https://api.ev.energy/v2/problems/pagination-parameters/
        status: 400
        title: Unsupported version
        detail: 'Unsupported version requested: 3.0'
