        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5/logs/2024-04-17T09:39:45.984584Z
          readOnly: true
        sampled_at:
          type: string
          format: date-time
          description: The date and time the current measurement was taken on the CT clamp.
        logged_at:
          type: string
          format: date-time
          description: The date and time when this data was recorded on the server.
        ct_clamp:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/ct_clamps/ctcl01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/CTClamp'
          description: The CT clamp this log entry belongs to.
        current_milliamps:
          type: integer
          description: The current reading in milliamps. Positive values indicate import from grid, negative values indicate export (e.g. solar generation).
          example: 5200
    LatLong:
      title: LatLong
      type: object
      description: Coordinates model used for locations.
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: float
          example: 51.52576576674041
        longitude:
          type: number
          format: float
          example: -0.08366433371722264
    EVSEMake:
      title: Make
      description: A resource representing a manufacturer of EVSEs.
      type: object
      x-tags:
      - EVSEs
      required:
      - id
      - url
      - name
      properties:
        id:
          type: string
          description: Unique identifier for the given EVSE Make.
          pattern: emak[A-Z\d]{26}
          example: emak01HS8FRXKJD5JZZ7ZN6W8H21P8
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse_makes/emak01HS8FRXKJD5JZZ7ZN6W8H21P8
          readOnly: true
        name:
          type: string
          example: BG SyncEV
          readOnly: true
        display_name:
          type:
          - string
          - 'null'
          example: BG SyncEV
          description: The EVSE make name for in-app display. May be null if no display name has been set.
          readOnly: true
        icon:
          type:
          - string
          - 'null'
          format: uri
          example: https://cdn.example.com/volvo.png
          description: A url for an image of the make's logo.
          readOnly: true
        onboarding_url:
          type:
          - string
          - 'null'
          example: https://api.ev.energy/v2/evse_onboarding?make_id=emak01HN2NJQRGDQP0GBE1F7R6PB3D&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          description: 'A pre-constructed link to initiate onboarding for an EVSE of this make. If it is null, then it cannot be onboarded with model alone. You should filter the list of [EVSE models](ev.energy-API-v2.yaml/paths/~1evse_models/get) by this make and then have the user select their model.


            Your `client_id` and the user''s `user_id` are automatically included based on your authentication token. If you are using client credentials authentication, the user ID will not be automatically included unless you set the EvEnergy-User header on your request.'
          readOnly: true
        is_beta:
          type: boolean
          example: false
          description: Whether this EVSE make integration is in beta.
          readOnly: true
        evse_models:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse_models/?make_id=emak01HN2NJQRGDQP0GBE1F7R6PB3D
          description: A pre-constructed link to a list of EVSE models filtered for this make.
          readOnly: true
