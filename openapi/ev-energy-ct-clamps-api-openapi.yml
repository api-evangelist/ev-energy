    EVSEStatusLog:
      title: EVSEStatusLog
      description: Records the state of an EVSE at a particular point in time.
      type: object
      x-tags:
      - EVSEs
      properties:
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/evse/evse01HSH04KDEWF6Z4DB2J77J74K5/status_logs/2024-01-01T11:11:11.1111Z/
          readOnly: true
        sampled_at:
          type: string
          format: date-time
          description: The date and time this status information was sampled on the EVSE.
        logged_at:
          type: string
          format: date-time
          description: The date and time when this data was recorded. Likely to be later than `sampled_at`, but how much later depends on the integration and other factors.
        evse:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/evses/evse01HSH04KDEWF6Z4DB2J77J74K5
          - $ref: '#/components/schemas/EVSE'
        is_plugged_in:
          type:
          - boolean
          - 'null'
          description: Is there currently a vehicle connected to the EVSE? Will be null if we are unable to get this information from the EVSE integration.
        is_charging:
          type:
          - boolean
          - 'null'
          description: Is the EVSE currently delivering charge? Will be null if we are unable to get this information from the EVSE integration.
        charge_rate_watts:
          type:
          - integer
          - 'null'
          description: The current rate of charge delivery, in watts. Will be null if we are unable to get this information from the EVSE integration.
        export_power_watts:
          type:
          - integer
          - 'null'
          description: Power flowing from the vehicle to the grid (V2X), in watts. Will be null when the EVSE does not report export power or is not bidirectional.
          readOnly: true
        control_pilot_status:
          type:
          - string
          - 'null'
          enum:
          - A
          - B
          - C
          - D
          - E
          - F
          - null
          description: "The SAE J1772 Control Pilot state of the EVSE. Will be null if we are unable to get this information from the EVSE integration.\n - `A`: Standby (no vehicle connected).\n - `B`: Vehicle detected (plugged in, not charging).\n - `C`: Ready / charging (drawing power, no ventilation required).\n - `D`: Charging with ventilation required.\n - `E`: No power (shut off).\n - `F`: Error / fault."
          readOnly: true
        meter_reading_watt_hours:
          type:
          - integer
          - 'null'
          description: The meter reading in watt hours. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        is_enabled:
          type:
          - boolean
          - 'null'
          description: Whether the EVSE is enabled (free-vend mode). Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        max_current_rating_milliamps:
          type:
          - integer
          - 'null'
          description: The maximum current the EVSE will allow the car to draw, in milliamps. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        cable_current_rating_milliamps:
          type:
          - integer
          - 'null'
          description: The maximum current the cable is rated for, in milliamps. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        signal_strength_rssi_dbm:
          type:
          - integer
          - 'null'
          description: The signal strength (RSSI) the EVSE reported, in dBm. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        inlet_power_watts:
          type:
          - integer
          - 'null'
          description: Power measured by the EVSE at the property supply inlet, in watts. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        voltage_millivolts:
          type:
          - integer
          - 'null'
          description: Voltage measured by the EVSE, in millivolts. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        state_of_charge_percentage:
          type:
          - integer
          - 'null'
          description: Battery charge level as a percentage, as received via the EVSE. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
        mode:
          type:
          - string
          - 'null'
          enum:
          - null
          - Unknown
          - Idle
          - Delay
          - Charge
          - Discharge
          - FFR
          - Load match
          - Export match
          - Peak time
          - Deep sleep
          description: Operating mode reported by the EVSE. Will be null if we are unable to get this information from the EVSE integration.
          readOnly: true
