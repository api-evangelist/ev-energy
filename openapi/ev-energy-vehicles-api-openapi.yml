          readOnly: true
        minutes_to_full_charge:
          type:
          - integer
          - 'null'
          description: The number of minutes the vehicle predicts until it is fully charged. Will be null if we are unable to get this information from the Vehicle integration.
          readOnly: true
        current_type:
          type:
          - string
          - 'null'
          enum:
