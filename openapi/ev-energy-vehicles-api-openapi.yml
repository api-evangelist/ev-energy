      - $ref: '#/components/parameters/previous'
      - $ref: '#/components/parameters/next'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/logged_at__gte'
      - $ref: '#/components/parameters/logged_at__lte'
      - $ref: '#/components/parameters/expand-on-vehiclecommandlog'
      security:
      - oauth2:
        - debug:read
  /vehicles/{vehicle_id}/command_logs/{logged_at}:
    parameters:
    - $ref: '#/components/parameters/vehicle_id'
    - schema:
        type: string
        format: date-time
      name: logged_at
      in: path
      required: true
      description: The time the command was logged.
      example: '2024-04-17T09:39:45.984584Z'
    get:
      summary: Retrieve a specific command log for a vehicle
      description: A single command log for a particular vehicle is uniquely identified by the timestamp it was logged at.
      tags:
      - Vehicles
      responses:
        '200':
          description: Returns the Vehicle command logged at a specific time.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCommandLog'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-vehicles-vehicle_id-command_logs-timestamp
      parameters:
      - $ref: '#/components/parameters/version-2'
      - $ref: '#/components/parameters/expand-on-vehiclecommandlog'
      security:
      - oauth2:
        - debug:read
  /vehicles/{vehicle_id}/vpp_modes:
    parameters:
    - $ref: '#/components/parameters/vehicle_id'
    get:
      summary: Get VPP modes for a vehicle
      description: Returns the VPP (Virtual Power Plant) control modes supported by this vehicle.
      tags:
      - Vehicles
      responses:
        '200':
          description: Returns the VPP modes supported by this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPPModes'
              examples:
                Vehicle VPP Modes:
                  value:
                    target_power: true
                    import_max_power: false
                    export_max_power: false
                    charge_mode: true
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: get-vehicles-vehicle_id-vpp_modes
      parameters:
      - $ref: '#/components/parameters/version-2'
      security:
      - oauth2:
        - vehicle:read
  /vehicle_onboarding:
    get:
      summary: Initiate vehicle onboarding
      tags:
      - Vehicles
      responses:
        '200':
          description: Returned only when `response_type=json` is supplied. Carries the integration provider's authorization URL plus the metadata native clients need (auth method, OAuth scopes, single-select hint) so they can either open the URL in a WebView or launch the provider's native SDK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleOnboardingJsonResponse'
        '302':
          description: 'Have the user''s browser follow the redirect to be prompted to connect their vehicle to the ev.energy system.


            If a make, model or trim were not provided, the user will first be redirect to a screen to select these.'
          headers:
            Location:
              schema:
                type: string
              description: The URL that the users browser will be redirected to in order to integrate their Vehicle.
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '422':
          description: Returned only on the `response_type=json` path when the integration provider could not produce an authorization URL — for example because the vehicle make is not supported, the provider is currently unavailable, or it returned an error code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
      operationId: get-vehicle_onboarding
      description: 'Initiate the onboarding process for a new vehicle in your user''s browser (or an embedded web view in an app).


        If none of `make_id`, `model_id` or `trim_id` are passed as query parameters, the user will be shown a user interface to pick their vehicle make.


        ## Native clients (`response_type=json`)


        Native mobile clients that need to launch a provider SDK (e.g. Smartcar Connect for BMW/MINI) instead of opening a WebView can pass `response_type=json` to receive a JSON payload instead of a 302 redirect. In that case at least one of `make_id`, `model_id` or `trim_id` is required (otherwise the endpoint responds with `400`).


        ## Final redirect


        After the user completes the web flow, the browser is redirected to the `redirect_uri` query parameter (when supplied and valid) or otherwise the `onboarding_redirect_url` configured on your application. The redirect URL will carry one or more query parameters identifying the onboarded vehicles:


        - `vehicle_uid` — the v2 UID of each onboarded vehicle (preferred). Use this to call `GET /v2/vehicles/{vehicle_uid}` for further details.

        - `vehicle_id` — the legacy integer primary key of each onboarded vehicle. Prefer `vehicle_uid`.


        When multiple vehicles are onboarded in a single flow, both query parameters appear once per vehicle in matching order. For example: `https://your-redirect/?vehicle_id=1&vehicle_id=2&vehicle_uid=vhcl01...&vehicle_uid=vhcl02...`.'
      security: []
      parameters:
      - $ref: '#/components/parameters/user_id_onboarding'
      - schema:
          type: string
          example: vmak01J443798BF893ZHFQVCS0FA23
        in: query
        name: make_id
        description: Specify the make of vehicle to be onboarded.
      - schema:
          type: string
          example: vhcl01HNARS42AVJN9QWQF6J52B7MB
        in: query
        name: model_id
        description: Specify the model of vehicle to be onboarded.
      - schema:
          type: string
          example: vhcl01HNARS42AVJN9QWQF6J52B7MB
        in: query
        name: trim_id
        description: Specify the trim of vehicle to be onboarded.
      - $ref: '#/components/parameters/client_id'
      - schema:
          type: string
          enum:
          - json
        in: query
        name: response_type
        description: When set to `json`, the endpoint returns a JSON payload (200) instead of a 302 redirect. Used by native mobile clients to choose between launching a provider SDK and opening a WebView. Requires at least one of `make_id`, `model_id` or `trim_id`.
      - schema:
          type: string
          format: uri
          example: https://drivers.ev.energy/acme
        in: query
        name: redirect_uri
        description: Optional URL to return the user to after onboarding completes. Its scheme and host must match one of the application's registered `redirect_uris` or its `onboarding_redirect_url`, otherwise the endpoint responds with `400`. When omitted, the application's static `onboarding_redirect_url` is used.
  /vehicle_onboarding/complete:
    post:
      summary: Complete vehicle onboarding
      tags:
      - Vehicles
      responses:
        '201':
          description: Authorization code exchanged successfully. Returns the list of created vehicles. Always an array, even when only a single vehicle was created.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleOnboardingCompleteResponse'
        '400':
          $ref: '#/components/responses/Problem400BadRequestCreate'
        '404':
          description: No `AccountAuthorizationRequest` matches the supplied `authorization_request_uid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '422':
          description: Returned when the authorization request has expired, the integration provider rejected the supplied `auth_code`, or no vehicles could be retrieved from the provider.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC9457ProblemDetail'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: post-vehicle_onboarding-complete
      description: 'Exchanges a provider `auth_code` for a list of vehicles, completing an onboarding flow that was initiated via `GET /v2/vehicle_onboarding/?response_type=json`. Used primarily by native mobile clients integrating with the Smartcar Connect SDK (the SDK returns the `auth_code` directly to the app).


        No OAuth bearer token is required, mirroring the init endpoint. The `authorization_request_uid` returned by the init call is what binds this request to the legitimate onboarding flow — it is treated as a single-use token.'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleOnboardingCompleteRequest'
  /vehicle_onboarding/onboarding_link:
    post:
      summary: Send vehicle onboarding link
      tags:
      - Vehicles
      operationId: post-vehicle_onboarding-onboarding_link
      description: 'Generates a vehicle onboarding deep link for the authenticated user and sends a Braze event containing the email, make name and onboarding URL.


        Requires an OAuth token with `vehicle:write` scope.'
      security:
      - OAuth2:
        - vehicle:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - make
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send the onboarding link to.
                  example: user@example.com
                make:
                  type: string
                  description: UID of the vehicle make to onboard.
      responses:
        '204':
          description: Onboarding link sent successfully.
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
  /vehicle_compatibility/check:
    get:
      summary: Check vehicle model compatibility in a country
      description: "Returns whether the given vehicle model is supported in the supplied\ncountry. Used by the onboarding flow to tell the user upfront\nwhether their vehicle will work before any account-linking step.\n\nPublic endpoint — callable pre-account, no authentication required.\n\nCountry resolution follows this order: explicit `country` query\nparameter, then the `Accept-Language` header, then `US`.\n\nWhen `program_id` is supplied, the check is scoped to that program's\neffective supported-models list (inclusion/exclusion lists applied)\nand the program's country — the `country` query parameter and\n`Accept-Language` header are ignored.\n\nError responses follow RFC 9457 Problem Details. Problem types\nemitted by this endpoint:\n\n- `validation-failed-vehicle-compatibility-check` — missing or\n  invalid `vehicle_model_id` / `country` query parameter (`400`).\n- `vehicle-model-not-found` — `vehicle_model_id` does not resolve\n  to a vehicle model (`404`).\n- `program-not-found-vehicle-compatibility` — `program_id` does\n  not resolve to a program (`404`)."
      tags:
      - Vehicles
      operationId: get-vehicle_compatibility-check
      parameters:
      - $ref: '#/components/parameters/version-2'
      - name: vehicle_model_id
        in: query
        required: true
        description: Vehicle Model id to check compatibility for.
        schema:
          type: string
          pattern: vmod[A-Z\d]{26}
      - name: country
        in: query
        required: false
        description: ISO-3166 alpha-2 country code. See description for fallback chain.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
          minLength: 2
          maxLength: 2
      - $ref: '#/components/parameters/Accept-Language'
      - name: client_id
        in: query
        required: false
        description: 'OAuth `Application.client_id`. Mirrors the pre-account

          onboarding endpoints: when supplied and the application has

          sandbox mode enabled, the endpoint returns a canned response

          without touching the database.'
        schema:
          type: string
      - name: program_id
        in: query
        required: false
        description: 'Program uid. When supplied, the check is scoped to the

          program''s effective supported-models list (inclusion / exclusion

          lists applied) and the program''s country. `country` and

          `Accept-Language` are ignored in that case. Omit for the core

          app''s pre-account flow where the program is not yet known.'
        schema:
          type: string
          pattern: prog[A-Z\d]{26}
      responses:
        '200':
          description: Compatibility verdict for the supplied model and country.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCompatibilityCheckResult'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '405':
          $ref: '#/components/responses/Problem405MethodNotAllowed'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
      security: []
  /vehicle_waitlist:
    post:
      summary: Add user to the vehicle waitlist
      description: 'Captures a user who hit an `incompatible` result on the vehicle compatibility check, so we can notify them once their hardware becomes supported. Pre-account, anonymous endpoint — no OAuth token required.


        The request body must identify the device in exactly one of two modes:


        - **Picker mode** — supply `vehicle_model_id` (uid of a `CarModel`). `vehicle_make_name` and `vehicle_model_name` must be omitted / null.

        - **Manual entry** — supply both `vehicle_make_name` and `vehicle_model_name` as free-text strings. `vehicle_model_id` must be omitted / null.


        Any other combination — including all three null — returns `400`.


        Country is derived server-side: from `program.country` when `program_id` is supplied; otherwise from the `Accept-Language` header (defaulting to `US`).


        Error responses follow RFC 9457 Problem Details. Problem types emitted by this endpoint:


        - `validation-failed-vehicle-waitlist` — request body fails validation (missing required field, mode constraint violation, unknown `vehicle_model_id` / `program_id`).'
      tags:
      - Vehicles
      operationId: post-vehicle_waitlist
      parameters:
      - $ref: '#/components/parameters/version-2'
      - $ref: '#/components/parameters/Accept-Language'
      - name: client_id
        in: query
        required: false
        description: 'OAuth `Application.client_id`. Mirrors the pre-account onboarding and compatibility-check endpoints: when supplied and the application has sandbox mode enabled, the endpoint returns a canned `201` without persisting anything.'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleWaitlistRequest'
      responses:
        '201':
          description: Waitlist entry created. Body echoes the new entry's uid.
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleWaitlistResponse'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '405':
          $ref: '#/components/responses/Problem405MethodNotAllowed'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      security: []
  /vehicles/{vehicle_id}/reconnect:
    parameters:
    - $ref: '#/components/parameters/vehicle_id'
    post:
      summary: Create reconnection URL
      tags:
      - Vehicles
      responses:
        '201':
          description: Returns the newly generated reconnection URL and it's expiry time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleReconnectionUrl'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestCreate'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: post-vehicles-vehicle_id-reconnect
      description: Create a reconnection request URL for the Vehicle.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleReconnectionUrl'
  /vehicles/{vehicle_id}/disconnect:
    parameters:
    - $ref: '#/components/parameters/vehicle_id'
    post:
      summary: Disconnect a vehicle's integration
      tags:
      - Vehicles
      responses:
        '200':
          description: 'The disconnection request was processed. Returns the updated

            Vehicle resource reflecting its current state — `INACTIVE` if

            the vehicle was previously integrated, or `UNINTEGRATED` if it

            had no active integration to disconnect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          headers:
            EvEnergy-Version:
              $ref: '#/components/headers/version-2'
            X-RateLimit-Limit:
              $ref: '#/components/headers/x-ratelimit-limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/x-ratelimit-remaining'
            RetryAfter:
              $ref: '#/components/headers/retry-after'
        '400':
          $ref: '#/components/responses/Problem400BadRequestRetrieve'
        '401':
          $ref: '#/components/responses/Problem401Unauthorized'
        '403':
          $ref: '#/components/responses/Problem403Forbidden'
        '404':
          $ref: '#/components/responses/Problem404NotFound'
        '406':
          $ref: '#/components/responses/Problem406NotAcceptable'
        '429':
          $ref: '#/components/responses/Problem429TooManyRequests'
      operationId: post-vehicles-vehicle_id-disconnect
      description: 'Disconnect the vehicle''s integration. Revokes provider OAuth tokens

        and invalidates the underlying account, leaving the vehicle in an

        `INACTIVE` state. Any open charging sessions on cars sharing the

        account are closed. The vehicle''s provider association is retained

        so the user can re-link by POSTing to

        `/vehicles/{vehicle_id}/reconnect`.


        This action is idempotent — calling it on an unintegrated vehicle

        is a no-op and still returns 200.'
      security:
      - oauth2:
        - vehicle:write
components:
  responses:
    Problem405MethodNotAllowed:
      description: Could not satisfy this HTTP method.
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - title
            - detail
            properties:
              status:
                type: number
                example: 405
              title:
                type: string
                example: Method Not Allowed
              detail:
                type: string
                example: Could not satisfy this HTTP method.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
        RetryAfter:
          $ref: '#/components/headers/retry-after'
    Problem400BadRequestCreate:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RFC9457ProblemDetail'
          examples:
            Request failed validation:
              $ref: '#/components/examples/ProblemValidationFailedVehicle'
      description: A problem with the request's parameters prevented it being fulfilled.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
        RetryAfter:
          $ref: '#/components/headers/retry-after'
    Problem429TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RFC9457ProblemDetail'
          examples:
            Example 1:
              value:
                type: https://api.ev.energy/v2/problems/rate-limit-exceeded/
                status: 429
                title: Too Many Requests
                detail: Request was rate limited. Try again in 42 seconds
      description: The client has exceeded its rate limit.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        Retry-After:
          $ref: '#/components/headers/retry-after'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
    Problem401Unauthorized:
      description: You need to authorise requests to access this resource.
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - title
            - detail
            properties:
              status:
                type: number
                example: 401
              title:
                type: string
                example: Unauthorized
              detail:
                type: string
                example: Authentication credentials were not provided.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
        RetryAfter:
          $ref: '#/components/headers/retry-after'
    Problem400UpdateVehicleStateOfChargeValidationFailed:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RFC9457ProblemDetail'
          examples:
            Request failed validation:
              value:
                type: https://api.ev.energy/v2/problems/validation-failed-update-vehicle-state-of-charge/
                status: 400
                title: Request failed validation.
                detail: 'Error on fields: state_of_charge_percentage'
                field_errors:
                  state_of_charge_percentage:
                  - Ensure this value is less than or equal to 100.
      description: The vehicle state of charge update request body failed validation.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
    Problem400BadRequestList:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RFC9457ProblemDetail'
          examples:
            Invalid Pagination Parameter:
              $ref: '#/components/examples/ProblemInvalidPaginationParameter'
            Unsupported Version:
              $ref: '#/components/examples/ProblemUnsupportedVersion'
      description: A problem with the request's parameters prevented it being fulfilled.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
        RetryAfter:
          $ref: '#/components/headers/retry-after'
    Problem406NotAcceptable:
      description: Could not satisfy the request Accept header.
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - title
            - detail
            properties:
              status:
                type: number
                example: 406
              title:
                type: string
                example: Not Acceptable
              detail:
                type: string
                example: Could not satisfy the request Accept header.
      headers:
        EvEnergy-Version:
          $ref: '#/components/headers/version-2'
        X-RateLimit-Limit:
          $ref: '#/components/headers/x-ratelimit-limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/x-ratelimit-remaining'
        RetryAfter:
          $ref: '#/components/headers/retry-after'
    Problem404NotFound:
      description: This resource either does not exist or the client is not authorized to access it.
      content:
        application/problem+json:
          schema:
