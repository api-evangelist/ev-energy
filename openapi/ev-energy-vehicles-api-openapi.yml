          - RECENTLY_FINISHED_DRIVING
          - STATIONARY
          - IN_SERVICE
          - PLUGGED_IN_NOT_CHARGING
          - PLUGGED_IN_CHARGING
          - PLUGGED_IN_COMPLETE
          - PLUGGED_IN_NEAR_READY_BY_TIME
          - PLUGGED_IN_ALMOST_COMPLETE
          - UNKNOWN
