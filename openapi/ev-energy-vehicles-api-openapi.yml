          readOnly: true
        odometer_meters:
          type:
          - integer
          - 'null'
          description: The vehicle's odometer reading in meters. Will be null if we are unable to get this information from the Vehicle integration.
          readOnly: true
        data_source:
          type:
          - string
          - 'null'
          description: The integration that originated this data.
          readOnly: true
        state:
