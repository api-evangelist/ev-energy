  schemas:
    VehicleAPIErrorLog:
      title: VehicleAPIErrorLog
      description: Records an error that occurred when attempting to communicate with a vehicle's telematics API.
      type: object
      x-tags:
      - Vehicles
      properties:
        url:
          type: string
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/error_logs/2024-04-17T09:39:45.984584Z/
          format: uri
          readOnly: true
        logged_at:
          type: string
          description: The date and time when this error was logged by the ev.energy system.
          format: date-time
          readOnly: true
        vehicle:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          - $ref: '#/components/schemas/Vehicle'
        status_code:
          type: integer
          example: 401
          description: The HTTP status code of the error response from the vehicle telematics API.
          readOnly: true
        controller:
          type: string
          example: ENODE
          description: The vehicle controller/integration that was being used when the error occurred.
          readOnly: true
        error_code:
          type: string
          example: AUTHENTICATION_ERROR
          description: The error code received from the provider or determined by the ev.energy system.
          readOnly: true
        error_type:
          type: string
          example: VehicleAPIUnauthorized
          description: The error type received from the provider or determined by the ev.energy system.
          readOnly: true
        request_id:
          type: string
          example: 56rst-z2jku-tty9t-0dn2f-qazow
          description: The request ID that resulted in this error. Used for tracing and debugging.
          readOnly: true
        command:
          type: string
          example: START_CHARGE
          description: The command/method that was being executed when the error occurred.
          readOnly: true
        error_detail:
          type: string
          description: Detailed information about the error.
          readOnly: true
        internal_command_id:
          type:
          - string
          - 'null'
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: Internal UUID to track the command dispatch. This can be used to correlate errors with commands.
          readOnly: true
    Supplier:
      title: Supplier
      type: object
      description: An energy company who supplies electricity tariffs.
      required:
      - id
      - url
      - name
      - icon
      properties:
        id:
          type: string
          description: Unique identifier for the given user.
          pattern: supl[A-Z\d]{26}
          example: supl01HN2NJ9NMRZBXT1H6FT9N7735
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/suppliers/supl01HN2NJ9NMRZBXT1H6FT9N7735
        name:
          type: string
          example: Rivendell Renewables
        icon:
          type:
          - string
          - 'null'
          format: uri
          example: https://cdn.example.com/rivendell_renewables.jpg
        highlighted:
          type: boolean
          description: A highlighted supplier is one that is often selected by users.
      x-tags:
      - Tariffs
    VehicleModelWrite:
      title: VehicleModelWrite
      description: Fields that must be set when creating a VehicleModel resource.
      type: object
      x-tags:
      - Vehicles
      required:
      - name
      - make
      properties:
        name:
          type: string
          description: The name of the vehicle model.
          example: Model 3
        make:
          type: string
          format: uri
          description: URL reference to the vehicle make.
          example: https://api.ev.energy/v2/vehicle_makes/vmak01HRFHBCM7VBSWRPVYFBQMH2BR
    Times:
      title: Times
      description: Defines a period of time.
      type: object
      x-tags:
      - Tariffs
      properties:
        start:
          type: string
          example: '18:00:00'
          pattern: \d\d:\d\d:\d\d
        end:
          type: string
          example: 00:00:00
          pattern: \d\d:\d\d:\d\d
    VehicleCompatibilityCheckResult:
      title: VehicleCompatibilityCheckResult
      description: 'Compatibility verdict for a `(vehicle_model, country)` pair.

        Returned by `GET /vehicle_compatibility/check`.'
      type: object
      required:
      - compatible
      - recommendation_rank
      properties:
        compatible:
          type: boolean
          description: True if the model is supported in the requested country.
        recommendation_rank:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10
          description: 'Priority of the car make on the new device-selection screen.

            Lower = higher priority (1 = top, 10 = lowest explicit value);

            `null` means no rank set and should be treated as lower priority

            than any explicit value. Always reflects the make''s current

            value, independent of `compatible`.'
    VehicleWaitlistRequest:
      title: VehicleWaitlistRequest
      description: 'Request body for `POST /vehicle_waitlist`. Device identification fields are mutually constrained: supply exactly one of (`vehicle_model_id`) or (both `vehicle_make_name` and `vehicle_model_name`). Any other combination returns `400`. Country is not part of the request body — see endpoint description for how it is derived.'
      type: object
      x-tags:
      - Vehicles
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: Email address to notify when the user's hardware becomes supported.
          example: user@example.com
        program_id:
          type:
          - string
          - 'null'
          pattern: prog[A-Z\d]{26}
          description: Optional `ProgramConfig` uid. Captured where known (web signup, whitelabel microsite) so later notification logic can scope by program.
          example: prog01HRS4TSK26BPBV7127DH7E0HA
        vehicle_model_id:
          type:
          - string
          - 'null'
          pattern: vmod[A-Z\d]{26}
          description: Uid of a `CarModel`. Used when the user picked from the vehicle picker. Mutually exclusive with `vehicle_make_name` / `vehicle_model_name`.
          example: vmod01HRS4TSK26BPBV7127DH7E0HA
        vehicle_make_name:
          type: string
          description: Free-text make name from manual entry. Must be supplied together with `vehicle_model_name`. Mutually exclusive with `vehicle_model_id`.
          example: Tesla
        vehicle_model_name:
          type: string
          description: Free-text model name from manual entry. Must be supplied together with `vehicle_make_name`. Mutually exclusive with `vehicle_model_id`.
          example: Model 3
    DailyPrices:
      title: DailyPrices
      description: Information about the tariff's prices for different parts of the day.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 3
      required:
      - peak
      properties:
        peak:
          $ref: '#/components/schemas/PriceSummary'
        mid_peak:
          $ref: '#/components/schemas/PriceSummary'
        off_peak:
          $ref: '#/components/schemas/PriceSummary'
      x-tags:
      - Tariffs
    VehicleCommandLog:
      title: VehicleCommandLog
      description: Records a command that was sent to a vehicle.
      type: object
      x-tags:
      - Vehicles
      properties:
        url:
          type: string
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/command_logs/2024-04-17T09:39:45.984584Z/
          format: uri
          readOnly: true
        logged_at:
          type: string
          description: The date and time when this command was logged by the ev.energy system.
          format: date-time
          readOnly: true
        vehicle:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          - $ref: '#/components/schemas/Vehicle'
        command:
          type: string
          example: START_CHARGE
          description: The type of command that was sent to the vehicle.
          enum:
          - START_CHARGE
          - STOP_CHARGE
          - WAKE_UP
          - SEND_SCHEDULE
          readOnly: true
        external_command_id:
          type:
          - string
          - 'null'
          example: ext-cmd-12345
          description: External command ID from the vehicle provider.
          readOnly: true
        current_milliamps:
          type:
          - integer
          - 'null'
          example: 32000
          description: If a start/stop command was sent, this is the current level that was sent in milliamps.
          readOnly: true
        internal_command_id:
          type:
          - string
          - 'null'
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: Internal UUID to track this command dispatch. This links with device command logs and error logs.
          readOnly: true
    Tariff:
      title: Tariff
      examples:
      - id: tari01HN2NJ9NMRZBXT1H6FT9N7735
        url: https://api.ev.energy/v2/tariffs/tari01HN2NJ9NMRZBXT1H6FT9N7735
        supplier: https://api.ev.energy/v2/suppliers/supl01HN2NJ9NMRZBXT1H6FT9N7735
        name: Fangorn Biomass
        currency: GBP
        gsp_group: _C
        valid_from: '2026-03-17'
        valid_until: '2027-03-17'
        daily_prices:
          peak:
            price: '0.30'
            times:
            - start: '18:00:00'
