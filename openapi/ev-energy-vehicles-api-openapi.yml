    Vehicle:
      title: Vehicle
      description: A resource representing a single, physical electric vehicle.
      type: object
      x-tags:
      - Vehicles
      required:
      - id
      - url
      - integrated
      - battery_size_watt_hours
      - effective_battery_size_watt_hours
      - maximum_charge_limit_percentage
      - description
      - disabled
      - smart_charging_enabled
      - vehicle_class
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle.
          pattern: vhcl[A-Z\d]{26}
          example: vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          readOnly: true
        trim:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/trim/vehicle_trim01HRFHBCM7VBSWRPVYFBQMH2BR
          - $ref: '#/components/schemas/VehicleTrim'
          description: Defaults to a url, but can be expanded to the full Trim resource via the `expand` query parameter.
          readOnly: true
        user:
          example: https://api.ev.energy/v2/users/user01HN2NJ9NMRZBXT1H6FT9N7735
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/user/user01HN2NJ9NMRZBXT1H6FT9N7735
          - $ref: '#/components/schemas/User'
          description: Defaults to a url, but can be expanded to the full User resource via the `expand` query parameter.
        latest_status_log:
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-04-17T09:39:45.994584Z/
          oneOf:
          - type:
            - string
            - 'null'
            example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-04-17T09:39:45.994584Z/
            format: uri
          - $ref: '#/components/schemas/VehicleStatusLog'
          description: An expandable reference to the most recent status log for this Vehicle. This can be requested or expanded to get the most accurate information we have on the device's current status.
        charging_sub_sessions:
          type: string
          format: uri
          example: https://api.ev.energy/charging_sub_sessions/?vehicle_id=vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
          description: Provides a pre-constructed URL to list charging sub-sessions involving this Vehicle.
        integrated:
          enum:
          - UNINTEGRATED
          - ACTIVE
          - INACTIVE
          description: 'Whether we have an integration with this vehicle.

            - `UNINTEGRATED`: This vehicle is not integrated

            - `ACTIVE`: This vehicle is integrated and the connection is working.

            - `INACTIVE`: This vehicle has been integrated but the connection has been severed, usually because the user needs to reconnect it.'
          readOnly: true
        battery_size_watt_hours:
          type: integer
          minimum: 1000
          maximum: 300000
          description: The nominal battery capacity of the vehicle in watt-hours according to the vehicle integration or trim. Editable via PATCH only for unintegrated vehicles; sending it for an integrated vehicle is rejected. Setting it flags the battery size as user-provided. Stored to the nearest 0.01 kWh (10 Wh), so the value read back may be rounded.
          example: 60000
        effective_battery_size_watt_hours:
          type: integer
          description: The effective battery capacity of the vehicle in watt-hours, accounting for estimated degradation based on odometer reading. This is the value used by the smart charging scheduler.
          readOnly: true
          example: 60000
        maximum_charge_limit_percentage:
          type: integer
          minimum: 50
          maximum: 100
          description: The target state of charge of the car as a percentage between 50 and 100. The car will not be smart charged above this value. Can be null if target charge level has not been set or we don't know the car's battery size.
          default: 100
        description:
          type: string
          maxLength: 200
          description: Human-readable label for the vehicle.
          example: My Volvo C40
          readOnly: true
        disabled:
          type: boolean
          description: 'Whether the vehicle has been disabled and can no longer be smart-charged or controlled. Set when the user unenrolls the vehicle, when an integrated vehicle is switched to unintegrated (''dumb''), or when the owning account is pending deletion. Disabled vehicles that have not been permanently deleted are still returned by this endpoint. This is independent of integrated: a disabled vehicle can still report integrated=ACTIVE (e.g. pending deletion), and a healthy never-integrated vehicle is not disabled.'
          example: false
          readOnly: true
        smart_charging_enabled:
          type: boolean
          description: Whether smart (dynamic) charging is enabled for this vehicle.
          example: true
        vehicle_class:
          type:
          - string
          - 'null'
          enum:
          - PASSENGER
          - COMMERCIAL
          - null
          description: Class of vehicle, passenger or commercial.
          example: PASSENGER
    VehicleReconnectionUrl:
