        url:
          type: string
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/status_logs/2024-01-01T11:11:11.1111Z/
          format: uri
          readOnly: true
        logged_at:
          type: string
