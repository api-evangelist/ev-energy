          readOnly: true
        target_charge_level_percentage:
          type:
          - integer
          - 'null'
          description: The target charge level as a percentage. Will be null if we are unable to get this information from the Vehicle integration.
          readOnly: true
        target_charge_level_watt_hours:
          type:
          - integer
          - 'null'
          description: The target charge level in watt hours. Will be null if we are unable to get this information from the Vehicle integration.
          readOnly: true
        charge_energy_added_watt_hours:
          type:
          - integer
