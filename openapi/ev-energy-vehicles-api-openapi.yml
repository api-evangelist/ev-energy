    VehicleStateOfCharge:
      title: VehicleStateOfCharge
      description: A vehicle's current battery state of charge.
      type: object
      x-tags:
      - Vehicles
      required:
      - url
      - vehicle
      - state_of_charge_percentage
      - source
      - updated_at
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/state_of_charge
        vehicle:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
        state_of_charge_percentage:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Current battery percentage. Null when unknown.
        source:
          type:
          - string
          - 'null'
          enum:
          - MANUAL
          - CONNECTED
          - null
          readOnly: true
          description: 'Where the current value came from: MANUAL (driver-entered) or

            CONNECTED (vehicle telemetry). Null when no value is available.'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
    LocationDetail:
      title: Location
      description: Extra fields only included when a single location is requested but omitted when locations are listed.
      allOf:
      - type: object
        properties:
          current_carbon_intensity_grams_per_kilowatt_hour:
            type:
            - integer
            - 'null'
            example: 300
            description: The current carbon intensity associated with the location in gCO2/kWh.
      - $ref: '#/components/schemas/Location'
    PriceSummary:
      title: PriceSummary
      description: A single price for a certain time range.
      type: object
      examples:
      - price: '0.10'
        times:
        - start: '18:00:00'
          end: 00:00:00
      x-tags:
      - Tariffs
      properties:
        price:
          type: string
          example: '0.10'
          description: The price is in major currency units e.g. 0.10 means £0.10.
        times:
          type: array
          items:
            $ref: '#/components/schemas/Times'
    VehicleMake:
      title: VehicleMake
      description: A resource representing a vehicle manufacturer.
      type: object
      x-tags:
      - Vehicles
      required:
      - id
      - url
      - name
      - icon
      - onboarding_url
      - models
      properties:
        id:
          type: string
          description: Unique identifier for the given Vehicle Make.
          pattern: vmak[A-Z\d]{26}
          example: vmak01HRFHBCM7VBSWRPVYFBQMH2BR
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/vehicle_makes/vmak01HRFHBCM7VBSWRPVYFBQMH2BR
          readOnly: true
        name:
          type: string
          example: Volvo
          readOnly: true
        icon:
          type:
          - string
          - 'null'
          format: uri
          example: https://cdn.example.com/volvo.png
          description: A url for an image of the make's logo.
          readOnly: true
        onboarding_url:
          type:
          - string
          - 'null'
          example: https://api.ev.energy/v2/vehicle_onboarding/?make_id=vmak01HN2P75GBNFRJPCZJXEFVXH5E&user_id=user01HN2NJ9NMRZBXT1H6FT9N7735&client_id=your_client_id
          description: 'A pre-constructed link to initiate onboarding for a vehicle of this make. If it is null, then it cannot be onboarded with make alone. You should filter the list of [vehicle models](ev.energy-API-v2.yaml/paths/~1vehicle_models/get) by this make and then have the user select their model.


            Your `client_id` and the user''s `user_id` are automatically included based on your authentication token. If you are using client credentials authentication, the user ID will not be automatically included unless you set the EvEnergy-User header on your request.'
          readOnly: true
        models:
          type: string
          format: uri
          example: https://api.ev.energy/vehicle_models?make_id=vmak01HN2P75GBNFRJPCZJXEFVXH5E
          description: A pre-constructed link to a list of vehicle models filtered for this make.
          readOnly: true
        subscription_name:
          type:
          - string
          - 'null'
          description: Full OEM telematics subscription name required for vehicle connectivity (e.g. 'Volkswagen We Connect ID'). Null if no subscription is required.
          example: Volkswagen We Connect ID
          readOnly: true
        subscription_package:
          type:
          - string
          - 'null'
          description: Specific OEM subscription package required (e.g. 'We Connect ID'). Null if no subscription is required.
          example: We Connect ID
          readOnly: true
