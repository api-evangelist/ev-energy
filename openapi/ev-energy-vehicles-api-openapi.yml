      - vehicle
      - native_connector
      - adaptors
      - updated_at
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H/connectors
        vehicle:
          type: string
          format: uri
          readOnly: true
          example: https://api.ev.energy/v2/vehicles/vhcl01HRFF3SEVSCRAV9B3CHVDFN0H
        native_connector:
          type:
          - string
          - 'null'
          enum:
          - CCS
          - NACS
          - CHADEMO
          - null
          description: 'The vehicle''s built-in DC-fast plug. A per-vehicle override, falling

            back to the model''s default connector when unset; null when not yet

