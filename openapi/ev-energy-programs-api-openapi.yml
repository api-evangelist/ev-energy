          readOnly: true
        default_connector_type:
          type:
          - string
          - 'null'
          enum:
          - CCS
          - NACS
          - CHADEMO
          - null
          description: 'Default charging connector type for this model, used to pre-fill

            connector selection during vehicle onboarding. Null when not yet

            known. Editable via PATCH with the `vehicle_catalogue:write` scope.'
    IncentiveScheme:
      title: IncentiveScheme
      type: object
      description: Incentive Schemes define a set of rules for how an elgible User can earn monetary Incentives.
      examples:
      - id: incs01JE3ZY9Z2C0E087C942B9WKBC
        name: Off-Peak Charging Incentives
        description: Earn $0.10 per kWh when charging off-peak
        visible: false
        available: true
      properties:
        id:
          type: string
          description: 'Prefix: "incs"'
        name:
          type: string
          description: Name to be displayed to the User.
        description:
          type: string
          description: Describes the rules of how the User earns this Incentive.
        visible:
          type: boolean
          default: false
          description: Should this Incentive Scheme be visible to the User in the App.
        available:
          type: boolean
          default: true
          description: 'Is this Incentive available for the User to earn.

            Some Incentive Schemes can only be earned a limitted number of times per User or Device.

            E.g. A Sign Up Incentive that can only be earned once per Device.

            This will also be False if it is outside the active period of the Incentive Scheme.'
    Program:
