  schemas:
    RFC9457ProblemDetail:
      title: RFC 9457 Problem Detail
      x-tags:
      - problems
      type: object
      required:
      - title
      - detail
      properties:
        type:
          type: string
          format: uri
          example: https://api.ev.energy/v2/problems/example-problem/
        status:
          type: number
          example: 400
        title:
          type: string
          example: Short description
        detail:
          type: string
          example: Long, more specific description.
        instance:
          type: string
          format: uri
          example: https://api.ev.energy/v2/users/user01HN2P75GBNFRJPCZJXEFVXH5E
        notification:
          $ref: '#/components/schemas/Notification'
      examples:
      - type: https://api.ev.energy/v2/problems/example-problem/
        status: 400
        title: Short description
        detail: Long, more specific description.
        instance: https://api.ev.energy/v2/users/user01HN2P75GBNFRJPCZJXEFVXH5E
        notification:
          id: notf01HTHKTXVB77901324BCQPF1RB
          url: https://api.ev.energy/notifications/notf01HTHKTXVB77901324BCQPF1RB
          message_id: ERR0123
          category: ACTIONABLE
          event_time: '2019-08-24T14:15:22Z'
          short_text_title: Your car is disconnected
          short_text_body: We need to reconnect to keep smart charging your car
          detail_page_title: Your car is disconnected
          detail_page_body: Your car has been disconnected. This happens when your password is reset. We need you to re-authorise ev.energy to access your account in order for us to keep managing your charging. Blah blah blah.
          external_link: http://example.com
          external_button_label: More info
          read_at: '2019-08-24T14:20:22Z'
          resolved_at: '2019-08-25T14:15:22Z'
    Notification:
      title: Notification
      description: Something that the user should be informed about.
      type: object
      examples:
      - id: notf67O36PLTFDB57M0E5L33JZLGM0
        url: https://api.ev.energy/notifications/notf67O36PLTFDB57M0E5L33JZLGM0
        message_id: ERR0123
        category: ACTIONABLE
        event_time: '2019-08-24T14:15:22Z'
        short_text_title: Your car is disconnected
        short_text_body: We need to reconnect to keep smart charging your car
        detail_page_title: Your car is disconnected
        detail_page_body: Your car has been disconnected. This happens when your password is reset. We need you to re-authorise ev.energy to access your account in order for us to keep managing your charging. Blah blah blah.
        external_link: http://example.com
        external_button_label: More info
        read_at: '2019-08-24T14:20:22Z'
        resolved_at: '2019-08-25T14:15:22Z'
      required:
      - id
      - url
      - message_id
      - category
      - event_time
      - short_text_title
      - short_text_body
      - detail_page_title
      - detail_page_body
      - external_link
      - external_button_label
      properties:
        id:
          type: string
          pattern: notf[A-Z\d]{26}
          example: notf67O36PLTFDB57M0E5L33JZLGM0
          description: Unique identifier for the Notification
        url:
          type: string
          format: uri
          example: https://api.ev.energy/notifications/notf67O36PLTFDB57M0E5L33JZLGM0
        message_id:
          type: string
          description: Internal identifier for this notification type. E.g. 'ERR0023'
        category:
          description: Category of this notification type
          enum:
          - ACTIONABLE
          - SERVICE
          - RETRY
          - MARKETING
          - INTERNAL
        event_time:
          type: string
          format: date-time
          description: The timestamp of the event described by this notification
        short_text_title:
          type: string
          description: Short title for the notification
          maxLength: 33
        short_text_body:
          type: string
          description: Short description of the event being notified
          maxLength: 49
        detail_page_title:
          type: string
          description: Title of a help page giving more information about this notification
        detail_page_body:
          type: string
          description: Text of a help page giving more information about this notification
        external_link:
          type:
          - string
          - 'null'
          description: URL of a web page giving further information about this notification
          format: uri
        external_button_label:
          type: string
          description: Text to be displayed on a button leading to the external_link location
        read_at:
          type: string
          format: date-time
          description: When the user examined the contents of this notification
        resolved_at:
          type: string
          format: date-time
          description: When the problem associated with this notification was resolved
    ParticipationAgreementVersion:
      title: ParticipationAgreementVersion
      type: object
      description: 'A version of a Program''s Participation Agreement. Programs have a single

        Participation Agreement with versioned content; users accept a version

        via `POST .../{id}/accept`. The currently active version is the

        highest-numbered published one — fetch it from the `current`

        sub-resource.

        '
      properties:
        id:
          type: string
          example: pagv01JCDYP6Z8MX9XWVAV0A7G3KPN
          pattern: pagv[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          format: uri
          example: https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC/participation_agreement_versions/pagv01JCDYP6Z8MX9XWVAV0A7G3KPN
          readOnly: true
        version_number:
          type: integer
          example: 1
          description: Monotonically increasing version number scoped to the parent agreement.
          readOnly: true
        published:
          type: boolean
          description: 'Whether this version is the currently active one shown to users.

            Only one version per agreement should be published at a time.

            '
          readOnly: true
        content:
          type: string
          description: HTML content of the agreement, translated for the requesting user's language.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When this version was created.
          readOnly: true
    ProgramTier:
      title: ProgramTier
      type: object
      example:
        id: tier01JCK1HPNAANB8WN253G27SFPC
        url: https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC/tiers/tier01JCK1HPNAANB8WN253G27SFPC
        short_name: standard
        name: Standard Tier
        logo_svg: https://api.ev.energy/media/program_tiers/standard.svg
        description_short: <html>Charge at off-peak times to earn standard rewards.</html>
        description_long: <html><p>Members of the Standard Tier earn rewards for charging during off-peak hours. No additional eligibility requirements apply.</p></html>
        smart_charging_enabled: true
        disable_changing_tariff: false
        visible: true
        eligible: true
      properties:
        id:
          type: string
          example: tier01JCK1HPNAANB8WN253G27SFPC
          pattern: tier[A-Z\d]{26}
          readOnly: true
        url:
          type: string
          example: https://api.ev.energy/v2/programs/prog01JCK1HPNAANB8WN253G27SFPC/tiers/tier01JCK1HPNAANB8WN253G27SFPC
          format: uri
          readOnly: true
        short_name:
          type: string
          example: standard
          description: A short slug-style identifier for the tier, unique within a program.
          readOnly: true
        name:
          type:
          - string
          - 'null'
          example: Standard Tier
          description: A human-friendly name for the tier.
          readOnly: true
        logo_svg:
          type:
          - string
          - 'null'
          format: uri
          description: URL to download an SVG logo for the tier.
          readOnly: true
        description_short:
          type:
          - string
          - 'null'
          description: Short HTML description of the tier. Wrapped in `<html>` tags on both real and sandbox responses.
          readOnly: true
        description_long:
          type:
          - string
          - 'null'
          description: Longer HTML description of the tier. Wrapped in `<html>` tags on both real and sandbox responses.
          readOnly: true
        smart_charging_enabled:
          type: boolean
          description: Whether smart charging is enabled for users in this tier.
          readOnly: true
        disable_changing_tariff:
          type: boolean
          description: Whether users in this tier are blocked from changing their tariff.
          readOnly: true
        visible:
          type: boolean
          description: Whether this tier should be shown to users when selecting a tier within the program.
          readOnly: true
        eligible:
          type:
          - boolean
          - 'null'
          description: 'Whether the authenticated user is eligible to join this tier. Populated only when

            the request is authenticated as a specific user (Authorization Code / Password grant,

            or Client Credentials with the `EvEnergy-User` header). `null` for anonymous and

            pure client-credentials requests.

            '
          readOnly: true
