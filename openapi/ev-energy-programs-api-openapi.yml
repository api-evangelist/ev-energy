        model:
          oneOf:
          - type: string
            format: uri
            example: https://api.ev.energy/v2/vehicle_models/vmod01HSBR8Z36GD7A46K7M4R12VG0
          - $ref: '#/components/schemas/VehicleModel'
          description: Link to the vehicle model by default. Expanded to full object when ?expand=model is used.
          readOnly: true
        type:
          type:
          - string
          - 'null'
          description: 'The vehicle type: BEV (Battery Electric Vehicle) or PHEV (Plug-in Hybrid Electric Vehicle).'
          example: BEV
          enum:
          - BEV
          - PHEV
          - null
          readOnly: true
        supported_countries:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
          description: List of ISO 3166-1 alpha-2 country codes this vehicle is compatible in.
          example:
          - US
          - CA
          readOnly: true
        start_year:
          type: integer
          description: The first model year this compatibility applies to.
          example: 2020
          readOnly: true
        end_year:
          type:
          - integer
          - 'null'
          description: The last model year this compatibility applies to. Null if still in production.
          example: 2026
          readOnly: true
    VehicleMake:
      title: VehicleMake
